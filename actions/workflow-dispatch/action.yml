name: Dispatch and wait for workflow
description: Dispatch one or more workflow_dispatch targets with individual inputs, verify each exact run ID and commit.
inputs:
  required_workflows:
    description: Comma-separated list of one or more required workflow filenames
    required: true
  branch:
    description: Target branch
    required: true
  sha:
    description: Expected branch commit SHA
    required: true
  token:
    description: Token with actions write/read
    required: true
  workflow_inputs:
    description: JSON object keyed by workflow filename, with workflow_dispatch inputs for each target
    default: "{}"
  sha-input:
    description: Optional input name for the expected SHA; empty disables injection
    default: checkout-sha
  timeout-seconds:
    description: Total wait timeout, in seconds
    default: "300"
  poll-seconds:
    description: Poll interval, in seconds
    default: "15"
outputs:
  workflow-results:
    description: JSON array of successfully completed required workflow runs
    value: ${{ steps.dispatch.outputs.workflow-results }}
runs:
  using: composite
  steps:
    - id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REQUIRED_WORKFLOWS: ${{ inputs.required_workflows }}
        DISPATCH_BRANCH: ${{ inputs.branch }}
        DISPATCH_SHA: ${{ inputs.sha }}
        WORKFLOW_INPUTS: ${{ inputs.workflow_inputs }}
        DISPATCH_SHA_INPUT: ${{ inputs.sha-input }}
        DISPATCH_TIMEOUT: ${{ inputs.timeout-seconds }}
        DISPATCH_POLL_INTERVAL: ${{ inputs.poll-seconds }}
      run: node "$GITHUB_ACTION_PATH/index.mjs"
