name: Dispatch and wait for workflow
description: Dispatch a workflow using its exact GitHub API run ID, poll and verify successful completion.
inputs:
  workflow:
    description: Required workflow filename
    required: true
  branch:
    description: Target branch
    required: true
  sha:
    description: Expected branch commit SHA
    required: true
  token:
    description: Token with actions write/read
    required: true
  inputs:
    description: JSON object of workflow_dispatch inputs
    default: '{}'
  sha-input:
    description: Optional input name for the expected SHA; empty disables injection
    default: checkout-sha
  timeout-seconds:
    description: Total wait timeout, in seconds
    default: '300'
  poll-seconds:
    description: Poll interval, in seconds
    default: '15'
outputs:
  workflow-id:
    value: ${{ steps.dispatch.outputs.workflow-id }}
  workflow-url:
    value: ${{ steps.dispatch.outputs.workflow-url }}
  workflow-conclusion:
    value: ${{ steps.dispatch.outputs.workflow-conclusion }}
runs:
  using: composite
  steps:
    - id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DISPATCH_WORKFLOW: ${{ inputs.workflow }}
        DISPATCH_BRANCH: ${{ inputs.branch }}
        DISPATCH_SHA: ${{ inputs.sha }}
        DISPATCH_INPUTS: ${{ inputs.inputs }}
        DISPATCH_SHA_INPUT: ${{ inputs.sha-input }}
        DISPATCH_TIMEOUT: ${{ inputs.timeout-seconds }}
        DISPATCH_POLL_INTERVAL: ${{ inputs.poll-seconds }}
      run: node "$GITHUB_ACTION_PATH/../../src/workflow-dispatch/index.mjs"
