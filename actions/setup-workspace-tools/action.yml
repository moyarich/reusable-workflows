name: Setup Workspace Tools
description: Resolve @moyarich/workspace-tools from the npm registry, current checkout, or Git repository.

inputs:
  source:
    description: "registry:npm:<version>, checkout:current, or checkout:upstream;branch:<ref> (tag: and sha: also supported)"
    required: false
    default: registry:npm:0.2.0
  build-command:
    description: Build command used when source is checkout:current or checkout:upstream.
    required: false
    default: npm run build

outputs:
  bin-dir:
    description: Directory containing workspace-tools executables.
    value: ${{ steps.resolve.outputs.bin-dir }}
  source:
    description: Resolved tooling source.
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: composite
  steps:
    - name: Resolve typed source
      id: typed
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail
        case "$SOURCE" in
          checkout:current) mode=current; value="" ;;
          registry:npm:*)
            mode=registry
            value="${SOURCE#registry:npm:}"
            [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.+-]+)?$ ]] || { echo "::error::Expected an explicit npm version"; exit 1; }
            ;;
          checkout:upstream\;branch:*|checkout:upstream\;tag:*|checkout:upstream\;sha:*)
            mode=upstream
            selection="${SOURCE#checkout:upstream;}"
            kind="${selection%%:*}"
            value="${selection#*:}"
            if [ "$kind" = sha ]; then
              [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Expected a full 40-character SHA"; exit 1; }
            else
              [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] && [[ "$value" != *..* ]] || { echo "::error::Invalid Git ref"; exit 1; }
            fi
            if [ "$kind" = branch ]; then value="refs/heads/$value"; fi
            if [ "$kind" = tag ]; then value="refs/tags/$value"; fi
            ;;
          *) echo "::error::Invalid workspace-tools source: $SOURCE"; exit 1 ;;
        esac
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "value=$value" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js for published package
      if: ${{ steps.typed.outputs.mode == 'registry' }}
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        registry-url: https://registry.npmjs.org
        scope: "@moyarich"

    - name: Install published Workspace Tools
      if: ${{ steps.typed.outputs.mode == 'registry' }}
      shell: bash
      env:
        VERSION: ${{ steps.typed.outputs.value }}
      run: |
        set -euo pipefail
        npm install --global "@moyarich/workspace-tools@$VERSION" --registry=https://registry.npmjs.org

    - name: Setup Node.js for repository source
      if: ${{ steps.typed.outputs.mode == 'upstream' }}
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        registry-url: https://registry.npmjs.org
        scope: "@moyarich"

    - name: Checkout upstream Workspace Tools
      if: ${{ steps.typed.outputs.mode == 'upstream' }}
      shell: bash
      env:
        UPSTREAM_REF: ${{ steps.typed.outputs.value }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TOOL_DIR="$RUNNER_TEMP/workspace-tools-upstream"
        rm -rf "$TOOL_DIR"
        mkdir -p "$TOOL_DIR"
        git -C "$TOOL_DIR" init -q
        git -C "$TOOL_DIR" remote add origin https://github.com/moyarich/workspace-tools.git
        git -C "$TOOL_DIR" -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --depth=1 origin "$UPSTREAM_REF"
        git -C "$TOOL_DIR" checkout -q --detach FETCH_HEAD

    - name: Build upstream Workspace Tools
      if: ${{ steps.typed.outputs.mode == 'upstream' }}
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/workspace-tools-upstream"
        npm ci --include=optional
        bash -lc "$BUILD_COMMAND"
        test -f dist/bin/discover-packages.mjs || { echo "::error::Upstream build missing discover-packages CLI"; exit 1; }

    - name: Build Workspace Tools from current checkout
      if: ${{ steps.typed.outputs.mode == 'current' }}
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        set -euo pipefail

        PACKAGE_NAME="$(node -p "require('./package.json').name")"
        if [ "$PACKAGE_NAME" != "@moyarich/workspace-tools" ]; then
          echo "::error::source=checkout:current is only supported when the checked-out local package is @moyarich/workspace-tools; found $PACKAGE_NAME"
          exit 1
        fi

        bash -lc "$BUILD_COMMAND"

        if [ ! -d "$GITHUB_WORKSPACE/dist/bin" ]; then
          echo "::error::Local build did not produce dist/bin."
          exit 1
        fi

    - id: resolve
      name: Resolve CLI directory
      shell: bash
      env:
        SOURCE: ${{ steps.typed.outputs.mode }}
      run: |
        set -euo pipefail

        if [ "$SOURCE" = "current" ]; then
          BIN_DIR="$GITHUB_WORKSPACE/dist/bin"
        elif [ "$SOURCE" = "upstream" ]; then
          BIN_DIR="$RUNNER_TEMP/workspace-tools-upstream/dist/bin"
        else
          RELEASE_BIN="$(command -v workspace-release)"
          RELEASE_TARGET="$(readlink -f "$RELEASE_BIN")"
          BIN_DIR="$(dirname "$RELEASE_TARGET")"
        fi

        for cli in workspace-release.mjs workspace-publish.mjs; do
          if [ ! -f "$BIN_DIR/$cli" ]; then
            echo "::error::Workspace Tools CLI is missing: $BIN_DIR/$cli"
            exit 1
          fi
        done

        {
          echo "bin-dir=$BIN_DIR"
          echo "source=${{ inputs.source }}"
        } >> "$GITHUB_OUTPUT"
