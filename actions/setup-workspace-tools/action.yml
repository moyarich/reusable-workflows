name: Setup Workspace Tools
description: Resolve @moyarich/workspace-tools from the published package or the current local checkout.

inputs:
  source:
    description: Tooling source. Use package for normal consumers or caller when developing workspace-tools itself.
    required: false
    default: package
  version:
    description: Published @moyarich/workspace-tools version used when source is package.
    required: false
    default: "0.1.0"
  build-command:
    description: Build command used when source is local.
    required: false
    default: npm run build

outputs:
  bin-dir:
    description: Directory containing workspace-tools executables.
    value: ${{ steps.resolve.outputs.bin-dir }}
  source:
    description: Resolved tooling source.
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: composite
  steps:
    - name: Validate source
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail
        case "$SOURCE" in
          package|local) ;;
          *)
            echo "::error::source must be 'package' or 'local'"
            exit 1
            ;;
        esac

    - name: Setup Node.js for published package
      if: ${{ inputs.source == 'package' }}
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        registry-url: https://npm.pkg.github.com
        scope: "@moyarich"

    - name: Install published workspace tools
      if: ${{ inputs.source == 'package' }}
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        npm install --global "@moyarich/workspace-tools@$VERSION" --registry=https://npm.pkg.github.com

    - name: Build workspace tools from local checkout
      if: ${{ inputs.source == 'local' }}
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        set -euo pipefail

        PACKAGE_NAME="$(node -p "require('./package.json').name")"
        if [ "$PACKAGE_NAME" != "@moyarich/workspace-tools" ]; then
          echo "::error::source=local is only supported when the checked-out local package is @moyarich/workspace-tools; found $PACKAGE_NAME"
          exit 1
        fi

        bash -lc "$BUILD_COMMAND"

        if [ ! -d "$GITHUB_WORKSPACE/dist/bin" ]; then
          echo "::error::Caller build did not produce dist/bin."
          exit 1
        fi

    - id: resolve
      name: Resolve CLI directory
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail

        if [ "$SOURCE" = "local" ]; then
          BIN_DIR="$GITHUB_WORKSPACE/dist/bin"
        else
          BIN_DIR="$(dirname "$(command -v workspace-release)")"
        fi

        {
          echo "bin-dir=$BIN_DIR"
          echo "source=$SOURCE"
        } >> "$GITHUB_OUTPUT"
