name: Select distribution packages
description: Validate per-repository distribution configuration and produce a matrix.
inputs:
  discovered:
    description: JSON package discovery report
    required: true
  package:
    description: Package name, directory, or all
    default: all
  dist-path:
    description: Distribution template override
    default: ""
  build-command:
    description: Build command override
    default: ""
  config-path:
    description: YAML configuration file
    default: .github/check-dist-config.yml
outputs:
  matrix:
    value: ${{ steps.select.outputs.matrix }}
  has-packages:
    value: ${{ steps.select.outputs.has-packages }}
  single-package:
    value: ${{ steps.select.outputs.single-package }}
runs:
  using: composite
  steps:
    - name: Select packages
      id: select
      shell: bash
      env:
        DISCOVERED: ${{ inputs.discovered }}
        PACKAGES: ${{ inputs.package }}
        DIST_PATH_OVERRIDE: ${{ inputs.dist-path }}
        BUILD_COMMAND_OVERRIDE: ${{ inputs.build-command }}
        CONFIG_FILE: ${{ inputs.config-path }}
      run: node "$GITHUB_ACTION_PATH/index.mjs"
