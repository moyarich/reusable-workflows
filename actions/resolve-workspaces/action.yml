name: Resolve npm workspace dependencies
description: Generate a JSON workspace dependency and publish plan, optionally rewriting wildcard internal versions
inputs:
  package:
    description: all, workspace name or workspace directory
    default: all
  range:
    description: caret, exact, or tilde
    default: caret
  write:
    description: Update selected package.json manifests in this checkout
    default: "false"
  output:
    description: JSON report path relative to workspace root
    default: resolve-workspaces.json
outputs:
  report:
    description: Path to the JSON report
    value: ${{ steps.resolve.outputs.report }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        PACKAGE_SELECTOR: ${{ inputs.package }}
        RANGE: ${{ inputs.range }}
        OUTPUT: ${{ inputs.output }}
        WRITE: ${{ inputs.write }}
      run: |
        args=(--package="$PACKAGE_SELECTOR" --range="$RANGE" --output="$OUTPUT")
        if [ "$WRITE" = "true" ]; then args+=(--write); fi
        node "$GITHUB_ACTION_PATH/../../packages/cli/src/actions/resolve-workspaces/index.mjs" "${args[@]}"
        echo "report=$OUTPUT" >> "$GITHUB_OUTPUT"
