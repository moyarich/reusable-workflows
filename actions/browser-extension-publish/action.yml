name: Browser extension publish
description: Validate, package, and submit Chrome and Firefox extension distributions.
inputs:
  operation:
    description: validate, package, publish-chrome, or publish-firefox
    required: true
  build-directory:
    description: Directory containing built extension assets
    default: dist
  registry:
    description: chrome, firefox, or all for validation
    default: all
  firefox-addon-id:
    description: Expected Gecko extension ID
    default: ""
  archive:
    description: Chrome archive to publish
    default: extension.zip
  output:
    description: Output ZIP for package operation
    default: extension.zip
  output-directory:
    description: Firefox signed artifact directory
    default: firefox-signed
  publisher-id:
    description: Chrome Web Store publisher ID
    default: ""
  extension-id:
    description: Chrome Web Store extension ID
    default: ""
outputs:
  version:
    description: Validated extension version
    value: ${{ steps.validate.outputs.version }}
runs:
  using: composite
  steps:
    - id: validate
      if: ${{ inputs.operation == 'validate' }}
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-directory }}
        REGISTRY: ${{ inputs.registry }}
        FIREFOX_ID: ${{ inputs.firefox-addon-id }}
      run: node "$GITHUB_ACTION_PATH/index.mjs" validate --build-directory "$BUILD_DIR" --registry "$REGISTRY" --firefox-addon-id "$FIREFOX_ID"
    - if: ${{ inputs.operation == 'package' }}
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-directory }}
        OUTPUT: ${{ inputs.output }}
      run: node "$GITHUB_ACTION_PATH/index.mjs" package --build-directory "$BUILD_DIR" --output "$OUTPUT"
    - if: ${{ inputs.operation == 'publish-chrome' }}
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
        PUBLISHER_ID: ${{ inputs.publisher-id }}
        EXTENSION_ID: ${{ inputs.extension-id }}
      run: node "$GITHUB_ACTION_PATH/index.mjs" publish-chrome --archive "$ARCHIVE" --publisher-id "$PUBLISHER_ID" --extension-id "$EXTENSION_ID"
    - if: ${{ inputs.operation == 'publish-firefox' }}
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-directory }}
        OUTPUT_DIR: ${{ inputs.output-directory }}
      run: node "$GITHUB_ACTION_PATH/index.mjs" publish-firefox --build-directory "$BUILD_DIR" --output-directory "$OUTPUT_DIR"
