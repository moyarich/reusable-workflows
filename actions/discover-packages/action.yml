name: Discover Packages
description: Discover repository packages and emit normalized package and matrix metadata.

inputs:
  workspace-tools-source:
    description: "registry:npm:0.2.0, checkout:current, or checkout:upstream;branch:main"
    required: false
    default: registry:npm:0.2.0
  workspace-tools-build-command:
    description: Build command for checkout sources.
    required: false
    default: npm run build
  packages-directory:
    description: Directory containing direct-child packages when workspace discovery is disabled.
    required: false
    default: packages
  use-workspaces:
    required: false
    default: "false"
  include-root-package:
    required: false
    default: "false"
  include-private:
    required: false
    default: "false"
  require-publish-config:
    required: false
    default: "false"
  require-test-script:
    required: false
    default: "false"
  require-build-script:
    required: false
    default: "false"

outputs:
  packages:
    value: ${{ steps.discover.outputs.packages }}
  matrix:
    value: ${{ steps.discover.outputs.matrix }}
  has-packages:
    value: ${{ steps.discover.outputs.has-packages }}
  count:
    value: ${{ steps.discover.outputs.count }}

runs:
  using: composite
  steps:
    - name: Resolve workspace tools
      id: workspace-tools
      uses: moyarich/reusable-workflows/actions/setup-workspace-tools@main
      with:
        source: ${{ inputs.workspace-tools-source }}
        build-command: ${{ inputs.workspace-tools-build-command }}
    - id: discover
      shell: bash
      env:
        WORKSPACE_TOOLS_BIN: ${{ steps.workspace-tools.outputs.bin-dir }}
      run: |
        set -euo pipefail
        args=( "--directory=${{ inputs.packages-directory }}" --json )
        [ "${{ inputs.use-workspaces }}" = "true" ] && args+=(--workspaces)
        [ "${{ inputs.include-root-package }}" = "true" ] && args+=(--include-root-package)
        [ "${{ inputs.include-private }}" = "true" ] && args+=(--include-private)
        [ "${{ inputs.require-publish-config }}" = "true" ] && args+=(--require-publish-config)
        [ "${{ inputs.require-test-script }}" = "true" ] && args+=(--require-test-script)
        [ "${{ inputs.require-build-script }}" = "true" ] && args+=(--require-build-script)
        packages="$(node "$WORKSPACE_TOOLS_BIN/discover-packages.mjs" "${args[@]}")"
        matrix="$(jq -cn --argjson packages "$packages" '{include:$packages}')"
        count="$(jq 'length' <<<"$packages")"
        {
          echo "packages=$packages"
          echo "matrix=$matrix"
          echo "count=$count"
          if [ "$count" -gt 0 ]; then echo "has-packages=true"; else echo "has-packages=false"; fi
        } >> "$GITHUB_OUTPUT"
