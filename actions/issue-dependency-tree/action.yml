name: Issue Dependency Tree
description: Render native GitHub issue blocking relationships as a cycle-aware dependency tree.

inputs:  workspace-tools-source:
    description: "registry:npm:0.2.0, checkout:current, or checkout:upstream;branch:main"
    required: false
    default: registry:npm:0.2.0
  repo:
    description: Optional owner/repository override. Defaults to the current repository.
    required: false
    default: ""

outputs:
  tree:
    value: ${{ steps.render.outputs.tree }}
  graph-json:
    value: ${{ steps.render.outputs.graph-json }}

runs:
  using: composite
  steps:
    - name: Resolve Workspace Tools
      id: workspace-tools
      uses: moyarich/reusable-workflows/actions/setup-workspace-tools@main
      with:
        source: ${{ inputs.workspace-tools-source }}
    - id: render
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKSPACE_TOOLS_BIN: ${{ steps.workspace-tools.outputs.bin-dir }}
      run: |
        set -euo pipefail
        args=()
        [ -n "${{ inputs.repo }}" ] && args+=(--repo "${{ inputs.repo }}")
        tree="$(node "$WORKSPACE_TOOLS_BIN/issue-dependency-tree.mjs" "${args[@]}")"
        graph="$(node "$WORKSPACE_TOOLS_BIN/issue-dependency-tree.mjs" "${args[@]}" --json)"
        {
          echo "tree<<__TREE__"
          printf '%s\n' "$tree"
          echo "__TREE__"
          echo "graph-json=$graph"
        } >> "$GITHUB_OUTPUT"
