name: Validate package changelogs
description: Check that every non-private npm workspace has a CHANGELOG.md heading matching its package version
runs:
  using: composite
  steps:
    - name: Validate package changelogs
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { globSync, readFileSync, existsSync } from 'node:fs';
        import { dirname, join } from 'node:path';

        const root = JSON.parse(readFileSync('package.json', 'utf8'));
        const patterns = Array.isArray(root.workspaces) ? root.workspaces : root.workspaces?.packages ?? [];
        const include = patterns.filter(p => typeof p === 'string' && !p.startsWith('!'));
        const exclude = patterns.filter(p => typeof p === 'string' && p.startsWith('!')).map(p => p.slice(1));
        const locate = pattern => pattern.replace(/^\.\//, '').replace(/\/$/, '') + '/package.json';
        const included = new Set(include.flatMap(p => globSync(locate(p))));
        const excluded = new Set(exclude.flatMap(p => globSync(locate(p))));
        const errors = [];
        let validated = 0;

        for (const file of [...included].filter(f => !excluded.has(f)).sort()) {
          const manifest = JSON.parse(readFileSync(file, 'utf8'));
          if (manifest.private === true) continue;
          const changelog = join(dirname(file), 'CHANGELOG.md');
          if (!existsSync(changelog)) {
            errors.push(`${manifest.name ?? file}: missing ${changelog}`);
            continue;
          }
          const lines = readFileSync(changelog, 'utf8').split(/\r?\n/);
          const expected = `## ${manifest.version}`;
          if (!lines.some(line => line.trim() === expected)) {
            errors.push(`${manifest.name ?? file}: ${changelog} must contain "${expected}"`);
          } else {
            validated++;
          }
        }

        console.log(`Validated ${validated} workspace changelogs.`);
        for (const message of errors) console.error('::error::' + message);
        if (errors.length) process.exitCode = 1;
        NODE
