name: Prettier self-heal
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit formatting fixes
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  prettier:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_prettier.yml@main
    with:
      mode: fix
      prettier-config: this-repository
      commit: ${{ inputs.commit }}
      node-version: "24"
