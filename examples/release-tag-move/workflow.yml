name: Example · Restore canonical release tag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Preview canonical tag restoration
        uses: moyarich/reusable-workflows/actions/release-tag@v0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: restore
          tag: v1.2.3
          commit: "0000000000000000000000000000000000000000"
          dry-run: "true"
