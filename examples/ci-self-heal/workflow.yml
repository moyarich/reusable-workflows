name: CI self-heal

# In a consumer repository: .github/workflows/ci-self-heal.yml
# Keep this workflow separate from CI to prevent recovery loops.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write
  packages: read

jobs:
  recover:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_self-heal-ci.yml@main
    with:
      failed-run-id: ${{ github.event.workflow_run.id }}
      ci-workflow: ci.yml
      package-directory: .
      node-version: "24"
    # Configure a recovery-token secret with permission to create PRs if
    # GITHUB_TOKEN cannot create pull requests in repository settings.
    # secrets:
    #   recovery-token: ${{ secrets.CI_RECOVERY_TOKEN }}
