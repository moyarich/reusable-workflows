name: Check dist

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-dist:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_check-dist.yml@main
    with:
      dist-path: dist/
      build-command: npm run build
      dry-run: true
      commit: false
