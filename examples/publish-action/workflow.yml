name: Example · Promote action major tag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Promote major version
        uses: moyarich/reusable-workflows/actions/release-tag@v0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: promote
          source-tag: v1.2.3
          dry-run: "true"
