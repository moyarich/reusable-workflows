name: Publish package
on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package directory or workspace name
        required: true
        default: packages/my-package
        type: string
      registry:
        description: Package registry
        required: true
        default: all
        type: choice
        options:
          - github
          - npm
          - all
      tag:
        description: npm distribution tag
        required: true
        type: string
      dry-run:
        description: Preview without publishing
        required: true
        default: true
        type: boolean
permissions:
  contents: write
  packages: write
jobs:
  publish:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@v0
    with:
      package-directory: ${{ inputs.package-directory }}
      target-branch: ${{ github.ref_name }}
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
      dry-run: ${{ inputs.dry-run }}
      node-version: "24"
    secrets: inherit
