name: Example · Release drafter
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  example:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-drafter.yml@v0
    with:
      release-name: 'Release v{{VERSION}}'
      target-branch: main
      # Uses the latest published release, not package.json, as baseline.
      version-mode: auto
      dry-run: true
