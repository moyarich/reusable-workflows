name: Example · Restore release
on:
  workflow_dispatch:
    inputs:
      package:
        type: string
        default: "."
        required: true
      restore-source:
        description: "Historical source: commit:<sha>, tag:<tag>, or run:<id>"
        type: string
        required: true
      match-mode:
        type: choice
        options: [package-json, exact]
        default: package-json
      exact-tag:
        type: string
        default: ""
      dry-run:
        type: boolean
        default: true
jobs:
  restore:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_restore-release.yml@v0
    with:
      package: ${{ inputs.package }}
      restore-source: ${{ inputs.restore-source }}
      match-mode: ${{ inputs.match-mode }}
      exact-tag: ${{ inputs.exact-tag }}
      target-branch: ${{ github.ref_name }}
      workspace-tools-version: "0.2.0"
      dry-run: ${{ inputs.dry-run }}
