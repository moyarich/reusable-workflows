# Fallback when the configured caller registry file does not exist.
# Secret names are documentation; callers must explicitly pass credentials.
registries:
  npm:
    url: https://registry.npmjs.org
    token-secret: NPM_TOKEN
    publish-mode: staged
    enabled: true
  github:
    url: https://npm.pkg.github.com
    token-secret: GITHUB_TOKEN
    publish-mode: direct
    enabled: true
