name: Copy files to another repository
description: Copy a prepared directory tree into another GitHub repository and commit changed files.
inputs:
  source-repository:
    description: Source owner/repository recorded in synchronization pull requests.
    required: true
  source-ref:
    description: Source ref recorded in synchronization pull requests.
    default: main
  mode:
    description: pull-request or update-branch.
    default: pull-request
  token:
    description: Token with contents write and workflow-file permissions in the destination.
    required: true
  source-directory:
    description: Local directory tree whose relative paths are copied into destination root.
    required: true
  destination-repository:
    description: Destination owner/repository.
    required: true
  destination-branch:
    description: Existing destination branch.
    required: false
    default: main
  dry-run:
    description: Report changes without pushing.
    required: false
    default: "true"
  commit-message:
    description: Commit message for synchronized files.
    required: false
    default: "chore: synchronize repository files"
outputs:
  pull-request-url:
    description: URL of the created or reused synchronization pull request.
    value: ${{ steps.copy.outputs.pull-request-url }}
  pull-request-title:
    description: Title of the existing or newly created synchronization pull request.
    value: ${{ steps.copy.outputs.pull-request-title }}
  pull-request-status:
    description: Whether the synchronization PR already existed or was created.
    value: ${{ steps.copy.outputs.pull-request-status }}
  changed:
    description: Whether any files differ.
    value: ${{ steps.copy.outputs.changed }}
  committed:
    description: Whether a commit was pushed.
    value: ${{ steps.copy.outputs.committed }}
runs:
  using: composite
  steps:
    - id: copy
      shell: bash
      env:
        COPY_SOURCE_REPO: ${{ inputs.source-repository }}
        COPY_SOURCE_REF: ${{ inputs.source-ref }}
        COPY_MODE: ${{ inputs.mode }}
        COPY_TOKEN: ${{ inputs.token }}
        COPY_SOURCE: ${{ inputs.source-directory }}
        COPY_DEST: ${{ inputs.destination-repository }}
        COPY_BRANCH: ${{ inputs.destination-branch }}
        COPY_DRY_RUN: ${{ inputs.dry-run }}
        COPY_MESSAGE: ${{ inputs.commit-message }}
      run: node "$GITHUB_ACTION_PATH/index.mjs"
