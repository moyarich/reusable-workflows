# yaml-language-server: $schema=https://raw.githubusercontent.com/moyarich/reusable-workflows/main/actions/copy-files-to-another-repository/config.schema.json
# Destination repositories must explicitly opt in. Selected workflows are copied
# whether or not they already exist. No deletions are propagated.
source:
  repository: moyarich/reusable-workflows-callers
  directory: .github/workflows
  allow:
    - "ci_*.yml"
    - "ci.yml"
    - "delete-release-tag.yml"
    - "history-cleanup.yml"
    - "pages.yml"
    - "prepare-release-pr.yml"
    - "publish*.yml"
    - "release*.yml"
    - "reset-release.yml"
    - "restore-release.yml"
    - "sync-release-package-choices.yml"
    - "upgrade-dependencies.yml"
  ignore:
    - "copy-files-to-another-repository.yml"
    - "_self-test_*.yml"
    - "reusable_*.yml"
    - "smoke-test_*.yml"
    - "check-dist.yml"
    - "issue-dependencies_*.yml"
destination-directory: .github/workflows
defaults:
  branch: main
  include: ["*.yml"]
  exclude: ["publish*.yml"]
profiles:
  npm:
    include: [publish.yml]
  vscode:
    include: [publish-vscode-vsx.yml]
  browser:
    include: [publish-browser-extension.yml]
repositories:
  - name: moyarich/snippet-canvas
  - name: moyarich/github_emulator
  - name: moyarich/moyaforge
    profiles: [npm]
  - name: moyarich/autofilename
    profiles: [vscode]
  - name: moyarich/colorshower
    profiles: [vscode]
  - name: moyarich/workspace-tools
    profiles: [npm]
    # Package options are maintained by sync-release-package-choices.yml.
    # Retain local workspace/app manifest triggers when copying this caller.
    overrides:
      .github/workflows/sync-release-package-choices.yml:
        on:
          push:
            paths:
              - package.json
              - packages/**/package.json
              - apps/**/package.json
              - .github/workflows/check-dist.yml
              - .github/workflows/release.yml
              - .github/workflows/release-draft.yml
              - .github/workflows/publish.yml
              - .github/workflows/restore-release.yml
              - .github/workflows/reset-release.yml
              - .github/workflows/sync-release-package-choices.yml
  - name: moyarich/css-expand-collapse
    profiles: [npm]
  - name: moyarich/console
    profiles: [npm]
  - name: moyarich/JotebookSync
    profiles: [vscode]
  - name: moyarich/vscode-act-runner-local
    profiles: [vscode]
  - name: moyarich/dev-toolkit
    profiles: [npm]
  - name: moyarich/vscode-dev-toolkit
    profiles: [vscode]
  - name: moyarich/css-color-parser
  - name: moyarich/vscode-dependency-links
    profiles: [vscode]
  - name: moyarich/vue-webview-vite
    profiles: [vscode]
  - name: moyarich/pointer-bubble
    profiles: [npm]
  - name: moyarich/css-modules-kit
    profiles: [npm]
  - name: moyarich/vite-github-actions
    profiles: [npm]
  - name: moyarich/vite-package-bin
    profiles: [npm]
  - name: moyarich/element-inspector
    profiles: [browser]
  - name: moyarich/zsh-glow
    profiles: [npm]
# Per repository: include, exclude, and overrides are optional.
# Source allow/ignore defines the candidate boundary. Each layer adjusts the source selection: defaults, then ordered profiles, then repository.
# Includes add files and excludes remove them; later layers take precedence.
