name: "Self-heal · Action distribution"

on:
  push:
    paths:
      - "src/actions/**"
      - "vite.config.ts"
      - "package.json"
      - ".prettierignore"
      - "tests/**"
      - "actions/dist/**"
      - ".github/workflows/self-heal.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  action-dist:
    name: Rebuild and commit action distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"

      - name: Install build dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Format editable action sources with Prettier
        id: prettier
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/prettier --write src/actions/ vite.config.ts tests/ --ignore-path .prettierignore
          if [ -n "$(git status --porcelain -- src/actions/ vite.config.ts tests/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build action distribution
        run: npm run build:cli

      - name: Test built setup CLI
        run: npm run test:cli

      - name: Commit rebuilt action distribution
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -f -- actions/dist/
          git add -- src/actions/ vite.config.ts tests/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Action distribution is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(build): format sources and update action distribution"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch distribution validation for healed head
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run check-dist.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Self-heal summary
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.commit.outcome }}
          FORMATTED: ${{ steps.prettier.outputs.changed }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Action distribution self-heal"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo '| Source | `src/actions/` |'
            echo '| Distribution | `actions/dist/` |'
            echo "| Source formatting changed | ${FORMATTED:-not completed} |"
            echo "| Commit step | $BUILD |"
            echo "| Distribution updated | ${CHANGED:-not completed} |"
            echo "| Result | $RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
