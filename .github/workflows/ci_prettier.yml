name: CI / Prettier

on:
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.md"
      - "**/*.mdx"
      - ".prettier*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_prettier.yml"
      - ".github/workflows/reusable_self-heal-prettier.yml"
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.md"
      - "**/*.mdx"
      - ".prettier*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_prettier.yml"
      - ".github/workflows/reusable_self-heal-prettier.yml"
  workflow_dispatch:
    inputs:
      repair:
        description: Repair and commit formatting or lockfile drift
        type: boolean
        default: true

concurrency:
  group: self-heal-validation-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prettier:
    uses: $/.github/workflows/reusable_self-heal-prettier.yml
    with:
      mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.repair)) && 'check' || 'fix' }}
      commit: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.repair) }}
      prettier-config: this-repository

