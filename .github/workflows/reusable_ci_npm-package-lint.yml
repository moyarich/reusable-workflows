name: Reusable CI / npm package lint
on:
  workflow_call:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
      expected-author:
        description: Expected author value for publishable workspace package manifests; empty disables author lint
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  npm-package-lint:
    name: Validate publishable npm tarballs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Build workspace packages
        id: build
        continue-on-error: true
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            npm run build --workspaces --if-present
          fi
      - name: Lint publishable workspaces and validate exports
        env:
          EXPECTED_AUTHOR: ${{ inputs.expected-author }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          npm query '.workspace' --json > "$RUNNER_TEMP/workspaces.json"
          mapfile -t packages < <(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const workspaces = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/workspaces.json', 'utf8'));
          for (const pkg of workspaces.filter(p => p.private !== true && p.name && p.location).sort((a, b) => a.name.localeCompare(b.name))) {
            console.log(`${pkg.name}\t${pkg.location}`);
          }
          NODE
          )
          if (( ${#packages[@]} == 0 )); then
            echo "No publishable npm workspace packages found"
            exit 0
          fi
          if [[ -n "$EXPECTED_AUTHOR" ]]; then
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/author-lint-config.json', JSON.stringify({ rules: { 'require-author': 'error', 'valid-values-author': ['error', [process.env.EXPECTED_AUTHOR]] } }));
          NODE
          fi
          npm-pkg-lint-wrapper() {
            (cd "$RUNNER_TEMP" && npx --yes --package=npm-pkg-lint@5.4.0 npm-pkg-lint --tarball "$1")
          }
          validate-exports() {
            local manifest="$1"
            # The external validator requires a root export and cannot expand
            # nested wildcard targets. Check the actual packed files for these
            # valid Node export maps instead.
            if node -e 'const p=require(require("node:path").resolve(process.argv[1])); process.exit(p.exports && (!Object.hasOwn(p.exports,".") || Object.keys(p.exports).some(k=>k.includes("*"))) ? 0 : 1)' "$manifest"; then
              node --input-type=module - "$manifest" <<'NODE'
          import { readFileSync, statSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const manifest = resolve(process.argv[2]);
          const root = dirname(manifest);
          const pkg = JSON.parse(readFileSync(manifest, 'utf8'));
          const packed = new Set(JSON.parse(execFileSync('npm', ['pack','--dry-run','--ignore-scripts','--json'], {cwd:root, encoding:'utf8'}))[0].files.map(f=>f.path));
          let count = 0;
          function targets(value) {
            if (typeof value === 'string') return [value];
            if (value === null) return [];
            if (typeof value === 'object') return Object.values(value).flatMap(targets);
            throw new Error('Invalid export target: '+JSON.stringify(value));
          }
          for (const [key, value] of Object.entries(pkg.exports)) {
            const paths = targets(value);
            let captures;
            for (const target of paths) {
              if (!target.startsWith('./') || target.split('/').includes('..')) throw new Error('Invalid export target: '+target);
              const file = target.slice(2);
              if (file.includes('*')) {
                if (!key.includes('*')) throw new Error('Wildcard target without wildcard key: '+key);
                const [prefix, suffix] = file.split('*');
                const matches = new Set([...packed].filter(p=>p.startsWith(prefix)&&p.endsWith(suffix)&&p.length>prefix.length+suffix.length).map(p=>p.slice(prefix.length,p.length-suffix.length)));
                if (!matches.size) throw new Error('No packed files match '+target);
                if (captures && (captures.size!==matches.size || [...captures].some(p=>!matches.has(p)))) throw new Error('Inconsistent wildcard targets for '+key);
                captures = matches;
                count += matches.size;
              } else {
                if (!packed.has(file) || !statSync(resolve(root,file)).isFile()) throw new Error('Missing packed export '+target);
                count++;
              }
            }
          }
          if (!count) throw new Error('No public export targets');
          console.log('Validated '+count+' packed export targets');
          NODE
            else
              npx --yes validate-package-exports "$manifest" --check --verbose --info
            fi
          }
          # Pack all publishable workspaces before testing any consumer.
          archive_dir="$RUNNER_TEMP/workspace-tarballs"
          mkdir -p "$archive_dir"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const temp = process.env.RUNNER_TEMP;
          const workspaces = JSON.parse(readFileSync(resolve(temp, 'workspaces.json'), 'utf8'));
          const packs = workspaces.filter(p => p.private !== true && p.name && p.location).map(p => {
            const manifest = JSON.parse(readFileSync(resolve(p.location, 'package.json'), 'utf8'));
            const [pack] = JSON.parse(execFileSync('npm', ['pack', '--workspace', p.name, '--ignore-scripts', '--pack-destination', resolve(temp, 'workspace-tarballs'), '--json'], {encoding:'utf8'}));
            return {...pack, manifest};
          });
          writeFileSync(resolve(temp, 'workspace-packs.json'), JSON.stringify(packs));
          NODE
          smoke-install() {
            local archive="$1" package="$2" consumer
            local -a local_archives=()
            consumer="$(mktemp -d "$RUNNER_TEMP/npm-consumer.XXXXXX")" || return 1
            (
              set -e
              cd "$consumer" || exit 1
              printf '{"private":true,"type":"module"}\n' > package.json
              # Resolve local runtime dependency closure from workspace manifests,
              # not the registry. npm still checks the declared dependency ranges.
              node --input-type=module - "$package" <<'NODE' > local-archives.txt || exit 1
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const temp = process.env.RUNNER_TEMP;
          const packs = JSON.parse(readFileSync(resolve(temp, 'workspace-packs.json'), 'utf8'));
          const manifests = new Map(packs.map(p => [p.name, p.manifest]));
          const archives = new Map(packs.map(p => [p.name, resolve(temp, 'workspace-tarballs', p.filename)]));
          const seen = new Set([process.argv[2]]);
          function visit(name) {
            const manifest = manifests.get(name);
            if (!manifest) return;
            for (const dep of Object.keys({...manifest.dependencies, ...manifest.optionalDependencies, ...manifest.peerDependencies})) {
              if (seen.has(dep) || !archives.has(dep)) continue;
              seen.add(dep);
              console.log(archives.get(dep));
              visit(dep);
            }
          }
          visit(process.argv[2]);
          NODE
              mapfile -t local_archives < local-archives.txt
              npm install --ignore-scripts --no-audit --no-fund "$archive" "${local_archives[@]}" || exit 1
              node --input-type=module - "$package" <<'NODE' || exit 1
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';
          const name = process.argv[2];
          const pkg = JSON.parse(readFileSync(resolve('node_modules', name, 'package.json'), 'utf8'));
          const exports = pkg.exports;
          const root = exports && typeof exports === 'object' && !Array.isArray(exports) &&
            Object.keys(exports).some(k => k.startsWith('.')) ? exports['.'] : exports;
          function target(value, conditions) {
            if (typeof value === 'string') return value;
            if (Array.isArray(value)) return value.map(v => target(v, conditions)).find(Boolean);
            if (value && typeof value === 'object') {
              for (const [key, entry] of Object.entries(value)) {
                if (key === 'default' || conditions.has(key)) {
                  const result = target(entry, conditions);
                  if (result) return result;
                }
              }
            }
          }
          const runtime = value => typeof value === 'string' && /\.(?:[cm]?js|node)$/.test(value);
          const types = value => typeof value === 'string' && /\.d\.[cm]?ts$/.test(value);
          const conditions = mode => new Set(['node', 'node-addons', mode, 'module-sync']);
          const importTarget = exports === undefined ? pkg.main ?? 'index.js' : target(root, conditions('import'));
          const requireTarget = exports === undefined ? pkg.main ?? 'index.js' : target(root, conditions('require'));
          const commonjs = runtime(requireTarget) && (
            requireTarget.endsWith('.cjs') ||
            (!requireTarget.endsWith('.mjs') && pkg.type !== 'module') ||
            (root && typeof root === 'object' && Object.hasOwn(root, 'require'))
          );
          const specifier = JSON.stringify(name);
          const sources = [];
          if (runtime(importTarget)) {
            await import(name);
            console.log('Installed ESM import passed');
            if (types(target(root, new Set([...conditions('import'), 'types']))) || pkg.types || pkg.typings) {
              writeFileSync('consumer.mts', 'import * as library from ' + specifier + ';\nvoid library;\n');
              sources.push('consumer.mts');
            }
          }
          if (commonjs) {
            createRequire(import.meta.url)(name);
            console.log('Installed CommonJS require passed');
            if (types(target(root, new Set([...conditions('require'), 'types']))) || pkg.types || pkg.typings) {
              writeFileSync('consumer.cts', 'import library = require(' + specifier + ');\nvoid library;\n');
              sources.push('consumer.cts');
            }
          }
          if (!runtime(importTarget) && !commonjs) console.log('No Node JavaScript root export; runtime smoke skipped');
          writeFileSync('smoke-sources.json', JSON.stringify(sources));
          NODE
              if [[ "$(cat smoke-sources.json)" != '[]' ]]; then
                npm exec --yes --package=typescript -- tsc --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2022 consumer.*ts || exit 1
              else
                echo "No declared root TypeScript entry point; compilation skipped"
              fi
            )
            local status=$?
            rm -rf "$consumer"
            return "$status"
          }
          failures=0
          checked=0
          report="$RUNNER_TEMP/npm-package-lint-report.md"
          printf '| Package | Check | Result |\n|---|---|---|\n' > "$report"
          record() {
            local pkg="$1" label="$2" status="$3"
            printf '| %s | %s | %s |\n' "$pkg" "$label" "$status" >> "$report"
          }
          if [[ "$BUILD_OUTCOME" != success ]]; then
            echo "::error title=Workspace build failed::Build failed; continuing package-level validation"
            record "Workspace" "build" "FAIL"
            failures=$((failures + 1))
          fi
          check() {
            local pkg="$1" label="$2"
            shift 2
            checked=$((checked + 1))
            if "$@"; then
              record "$pkg" "$label" "PASS"
            else
              echo "::error title=Package validation failed::$pkg: $label"
              record "$pkg" "$label" "FAIL"
              failures=$((failures + 1))
            fi
          }
          for entry in "${packages[@]}"; do
            IFS="$(printf '\t')" read -r package location <<< "$entry"
            if [[ -n "$EXPECTED_AUTHOR" ]]; then
              echo "::group::Author metadata: $package"
              check "$package" "author metadata" npx --yes npm-package-json-lint --configFile "$RUNNER_TEMP/author-lint-config.json" --noConfigFiles "$location/package.json"
              echo "::endgroup::"
            fi
            echo "::group::Package lint: $package"
            if ! tarball="$(npm pack --workspace "$package" --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent)"; then
              echo "::error title=Package validation failed::$package: npm pack"
              failures=$((failures + 1))
              record "$package" "npm pack" "FAIL"
              echo "::endgroup::"
              echo "::group::Validate public exports: $package"
              check "$package" "exports" validate-exports "$location/package.json"
              echo "::endgroup::"
              continue
            fi
            record "$package" "npm pack" "PASS"
            check "$package" "npm-pkg-lint" npm-pkg-lint-wrapper "$RUNNER_TEMP/$tarball"
            echo "::endgroup::"
            echo "::group::Installation smoke tests: $package"
            check "$package" "installation smoke" smoke-install "$RUNNER_TEMP/$tarball" "$package"
            echo "::endgroup::"
            echo "::group::Publint: $package"
            check "$package" "publint" npx --yes publint "$RUNNER_TEMP/$tarball" --strict
            echo "::endgroup::"
            echo "::group::TypeScript package compatibility: $package"
            checked=$((checked + 1))
            # The package declares its supported module format via exports and engines.
            # Legacy node10 resolution and CJS require() are not promised by modern,
            # ESM-only packages. Validate every supported resolution mode instead.
            diagnostics="$RUNNER_TEMP/attw-$(echo "$package" | tr '/@' '--').json"
            npx --yes @arethetypeswrong/cli "$RUNNER_TEMP/$tarball" --format json --exclude-entrypoints styles.css > "$diagnostics" || true
            if node --input-type=module - "$location/package.json" "$diagnostics" <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const diagnostics = JSON.parse(readFileSync(process.argv[3], 'utf8'));
          const problems = diagnostics.problems ?? {};
          // Stylesheets are assets, not JavaScript entry points. A CSS
          // export must not make an otherwise ESM-only package appear to
          // support CommonJS require() in TypeScript's Node16 mode.
          const exportEntries = Object.entries(manifest.exports ?? {})
            .filter(([subpath, target]) =>
              !(subpath.endsWith('.css') &&
                typeof target === 'string' &&
                target.endsWith('.css')))
            .map(([, target]) => target);
          // A type-only subpath is not a CommonJS runtime entry point.
          // Derive support from JavaScript export conditions, not filenames.
          const esmOnly = manifest.type === 'module' &&
            exportEntries.length > 0 &&
            exportEntries.every(entry => typeof entry === 'object' && entry !== null &&
              !('require' in entry) &&
              (typeof entry.import === 'string' ||
                (typeof entry.types === 'string' && !('default' in entry))));
          const modernNode = /(?:>=|\^)\s*(?:2[2-9]|[3-9]\d)/.test(manifest.engines?.node ?? '');
          const ignored = new Set();
          if (modernNode) ignored.add('node10');
          if (esmOnly) ignored.add('node16-cjs');

          const failures = [];
          for (const [kind, entries] of Object.entries(problems)) {
            for (const problem of entries) {
              if (!ignored.has(problem.resolutionKind)) {
                failures.push(`${kind}: ${problem.entrypoint} (${problem.resolutionKind})`);
              }
            }
          }
          if (failures.length) {
            console.error('Unsupported package resolutions:');
            for (const failure of failures) console.error('  ' + failure);
            process.exitCode = 1;
          } else {
            console.log('All declared ESM and bundler resolutions passed.');
          }
          NODE
            then
              record "$package" "TypeScript compatibility" "PASS"
            else
              record "$package" "TypeScript compatibility" "FAIL"
              echo "::error title=Package validation failed::$package: TypeScript compatibility"
              failures=$((failures + 1))
              echo "::group::TypeScript resolution diagnostics: $package"
              cat "$diagnostics"
              echo "::endgroup::"
            fi
            echo "::endgroup::"
            echo "::group::Validate public exports: $package"
            check "$package" "exports" validate-exports "$location/package.json"
            echo "::endgroup::"
          done
          {
            echo "## npm workspace package validation"
            echo
            echo "Publishable packages: ${#packages[@]} · Checks executed: $checked · Failures: $failures"
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( failures > 0 )); then
            echo "::error::$failures validation check(s) failed across ${#packages[@]} publishable packages"
            exit 1
          fi
