name: Reusable · Self-heal failed CI

on:
  workflow_call:
    inputs:
      failed-run-id:
        description: Failed CI workflow run ID on the caller's default branch
        required: true
        type: number
      ci-workflow:
        description: CI workflow filename to dispatch and await on the repaired branch (must support workflow_dispatch)
        type: string
        default: ci.yml
      node-version:
        type: string
        default: "24"
      browser-tests:
        description: Enable Chromium checks in reusable Node CI
        type: boolean
        default: false
      package-directory:
        description: Workspace passed to reusable Node CI
        type: string
        default: "."
    secrets:
      recovery-token:
        required: false

permissions:
  contents: read

jobs:
  repair:
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: ci-self-heal-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Inspect failed trusted run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.failed-run-id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/failed-run.json
          jq -e --arg branch "${GITHUB_REF_NAME}" '
            .event == "push" and .head_branch == $branch and
            .status == "completed" and .conclusion == "failure" and
            .head_repository.full_name == env.GITHUB_REPOSITORY
          ' /tmp/failed-run.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed-ci.log || true
          test -s /tmp/failed-ci.log
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Apply known repair
        id: patch
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          # Keep repair recipes inside the called workflow so that @vX.Y.Z
          # always runs the recipes shipped in that exact workflow revision.
          node --input-type=module - /tmp/failed-ci.log <<'SELF_HEAL'
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          import { spawnSync } from "node:child_process";

          const log = readFileSync(process.argv[2], "utf8");
          // Workflow-file changes require additional GitHub permissions and are
          // not automatically proposed by this constrained recovery pipeline.
          if (/npm audit|vulnerabilities|security vulnerabilities/i.test(log)) {
            const audit = spawnSync("npm", ["audit", "fix"], { stdio: "inherit" });
            if (audit.status !== 0) {
              console.error("npm audit fix did not complete cleanly; recovery is not safe");
              process.exit(1);
            }
            console.log("Applied npm audit fix within declared semver ranges");
            process.exit(0);
          }
          console.log("Unrecognized CI failure; leaving repository unchanged");
          SELF_HEAL
          if [[ -n "$(git status --porcelain --untracked-files=no -- . ':!.github/workflows/**')" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish candidate repair branch
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.recovery-token || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/ci-self-heal"
          git switch -c "$branch"
          # Do not let automation modify workflow definitions.
          git add -u -- . ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo "No permitted repair changes"
            exit 1
          fi
          git commit -m "fix(ci): automatically repair recognized CI failure"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --force-with-lease origin "HEAD:refs/heads/$branch"

  verify:
    needs: repair
    if: needs.repair.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and await caller CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          REPAIR_BRANCH: automation/ci-self-heal
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CI_WORKFLOW" =~ ^[A-Za-z0-9_-]+[.]ya?ml$ ]]; then
            echo "::error::ci-workflow must be a workflow filename such as ci.yml"
            exit 1
          fi

          repaired_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REPAIR_BRANCH" --jq '.object.sha')"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$CI_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$REPAIR_BRANCH"

          run_id=""
          for attempt in {1..30}; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$CI_WORKFLOW" --branch "$REPAIR_BRANCH" --event workflow_dispatch --json databaseId,headSha,createdAt --limit 20 --jq '[.[] | select(.headSha == "'"$repaired_sha"'" and .createdAt >= "'"$started_at"'")] | first | .databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::Could not identify the dispatched CI run"
            exit 1
          fi
          echo "Validating repaired commit $repaired_sha in run $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  propose:
    needs: [repair, verify]
    if: needs.repair.outputs.changed == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or update reviewed repair PR
        env:
          GH_TOKEN: ${{ secrets.recovery-token || github.token }}
          RUN_ID: ${{ inputs.failed-run-id }}
        run: |
          branch="automation/ci-self-heal"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$existing" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$GITHUB_REF_NAME" \
              --title "fix(ci): self-heal recognized CI failure" \
              --body "Automated repair for failed [CI run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID), verified by the caller CI workflow. Review required; no automatic merge."
          else
            gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Updated repair verified by caller CI for [CI run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID)."
          fi
