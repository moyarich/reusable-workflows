name: "Smoke-test · Action distribution path"

on:
  pull_request:
    paths:
      - "actions/**"
      - ".github/workflows/smoke-test_action-dist-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-path:
    name: Local sibling distribution path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Execute action from sibling dist
        uses: ./actions/path-smoke-test
        id: smoke
      - name: Assert action output
        env:
          RESULT: ${{ steps.smoke.outputs.shared-dist-supported }}
        run: test "$RESULT" = true
      - name: Write local verification summary
        if: always()
        env:
          RESULT: ${{ steps.smoke.outputs.shared-dist-supported }}
          ASSERTION: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Shared action distribution — local"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo '| Entry point | `actions/path-smoke-test/action.yml` |'
            echo '| runs.main | `../dist/path-smoke-test.mjs` |'
            echo "| Action execution | $ASSERTION |"
            echo "| Output assertion | ${RESULT:-missing} |"
          } >> "$GITHUB_STEP_SUMMARY"

  remote-path:
    name: Remote action sibling distribution path
    runs-on: ubuntu-latest
    steps:
      - name: Execute same repository at this commit as a remote action
        uses: moyarich/reusable-workflows/actions/path-smoke-test@fix/require-structured-discovery-json
        id: smoke
      - name: Assert remote action output
        env:
          RESULT: ${{ steps.smoke.outputs.shared-dist-supported }}
        run: test "$RESULT" = true
      - name: Write remote verification summary
        if: always()
        env:
          RESULT: ${{ steps.smoke.outputs.shared-dist-supported }}
          ASSERTION: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Shared action distribution — remote"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo '| Action | `moyarich/reusable-workflows/actions/path-smoke-test` |'
            echo '| runs.main | `../dist/path-smoke-test.mjs` |'
            echo "| Action execution | $ASSERTION |"
            echo "| Output assertion | ${RESULT:-missing} |"
          } >> "$GITHUB_STEP_SUMMARY"
