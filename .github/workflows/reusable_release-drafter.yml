# Persistent Release Drafter workflow.
#
# Release Drafter discovers, filters, categorizes, and versions merged pull
# requests. This wrapper owns the GitHub Release body so reviewer-authored text
# is preserved and newly discovered PR entries are appended idempotently.
name: "Reusable · Release Drafter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "repository, package:<name>, or directory:<path>"
        default: repository
        type: string
      target-branch:
        description: Branch to inspect
        default: main
        type: string
      version-selection:
        description: "auto, bump:minor, exact:1.2.3, or package-json"
        default: auto
        type: string
      release:
        description: "auto, tag:<tag>, or name:<name>"
        default: auto
        type: string
      changelog-path:
        description: Changelog path
        default: CHANGELOG.md
        type: string
      template-path:
        description: Release Drafter template path
        default: .github/release-drafter-template.yml
        type: string
      dry-run:
        description: Preview without writing
        default: true
        type: boolean
  workflow_call:
    inputs:
      show-input-summary:
        description: Report effective reusable workflow inputs; set false when the caller already reports them
        required: false
        default: true
        type: boolean
      target-branch:
        description: Branch whose merged PRs feed the draft
        required: false
        default: main
        type: string
      version:
        description: Optional explicit semantic version
        required: false
        default: ""
        type: string
      version-mode:
        description: Version resolution mode (bump, package-json, exact); empty retains automatic or explicit version
        required: false
        default: ""
        type: string
      version-bump:
        description: Semantic version increment when version-mode is bump
        required: false
        default: ""
        type: string
      exact-version:
        description: Exact semantic version when version-mode is exact
        required: false
        default: ""
        type: string
      initial-version:
        description: Version used when the target has no published releases
        required: false
        default: "0.1.0"
        type: string
      release-tag:
        description: Optional explicit release tag
        required: false
        default: ""
        type: string
      tag-prefix:
        description: Prefix used to identify releases for this target
        required: false
        default: "v"
        type: string
      package-name:
        description: Optional package name
        required: false
        default: ""
        type: string
      package-directory:
        description: Optional package or application path used for PR and commit scoping
        required: false
        default: ""
        type: string
      include-paths:
        description: Optional JSON array of repository path globs included in this draft
        required: false
        default: "[]"
        type: string
      target-key:
        description: Stable draft target identifier; derived when omitted
        required: false
        default: ""
        type: string
      release-name:
        description: Release name or template containing {{VERSION}}
        required: true
        type: string
      changelog-path:
        description: Changelog used only to seed a missing draft
        required: false
        default: CHANGELOG.md
        type: string
      template-path:
        description: Caller-local Release Drafter template path, with version-matched actions fallback
        required: false
        default: .github/release-drafter-template.yml
        type: string
      seed-body-base64:
        description: Optional base64-encoded release body used to seed a newly recreated draft
        required: false
        default: ""
        type: string
      seed-updated-at:
        description: Optional timestamp from the release being recreated, used to preserve its PR baseline
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview the resulting persistent draft without writing it
        required: false
        default: true
        type: boolean
    outputs:
      version:
        description: Resolved release version
        value: ${{ jobs.draft.outputs.version }}
      tag:
        description: Resolved release tag
        value: ${{ jobs.draft.outputs.tag }}
      release-url:
        description: GitHub Release draft URL
        value: ${{ jobs.draft.outputs.release-url }}
      draft-action:
        description: previewed, created, or updated
        value: ${{ jobs.draft.outputs.draft-action }}
      release-body:
        description: Resolved persistent GitHub Release draft body
        value: ${{ jobs.draft.outputs.release-body }}

permissions: {}

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "release draft · Reusable workflow inputs"

  draft:
    name: "job: Persistent release draft"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-draft-${{ github.repository }}-${{ inputs.target-key || inputs.package-directory || inputs.package-name || 'root' }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      release-url: ${{ steps.write.outputs.url }}
      draft-action: ${{ steps.write.outputs.action }}
      release-body: ${{ steps.result.outputs.body }}

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      TARGET_PATH: ${{ inputs.package-directory }}
      INCLUDE_PATHS: ${{ inputs.include-paths }}
      TARGET_KEY_INPUT: ${{ inputs.target-key }}
      PACKAGE_NAME: ${{ inputs.package-name }}
      CHANGELOG_PATH: ${{ inputs.changelog-path }}
      TEMPLATE_PATH: ${{ inputs.template-path }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
      RELEASE_TAG_INPUT: ${{ inputs.release-tag }}
      RELEASE_NAME_INPUT: ${{ inputs.release-name }}
      INPUT_VERSION: ${{ inputs.version }}
      INITIAL_VERSION: ${{ inputs.initial-version }}
      SEED_BODY_BASE64: ${{ inputs.seed-body-base64 }}
      SEED_UPDATED_AT: ${{ inputs.seed-updated-at }}

    steps:
      - name: Parse typed dispatch inputs
        id: typed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version-selection != '' }}
        uses: moyarich/reusable-workflows/actions/parse-typed-inputs@main
        with:
          version: ${{ inputs.version-selection }}
          target: ${{ inputs.target }}
          release: ${{ inputs.release }}

      - name: Export typed dispatch identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version-selection != '' }}
        shell: bash
        env:
          TARGET_DIRECTORY: ${{ steps.typed.outputs.package-directory }}
          TARGET_PACKAGE: ${{ steps.typed.outputs.package-name }}
          RELEASE_TAG: ${{ steps.typed.outputs.release-tag }}
          RELEASE_NAME: ${{ steps.typed.outputs.release-name }}
        run: |
          {
            echo "TARGET_PATH=$TARGET_DIRECTORY"
            echo "PACKAGE_NAME=$TARGET_PACKAGE"
            echo "RELEASE_TAG_INPUT=$RELEASE_TAG"
            echo "RELEASE_NAME_INPUT=${RELEASE_NAME:-Release {{VERSION}}}"
          } >> "$GITHUB_ENV"

      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Checkout version-matched reusable workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/reusable-workflows-runtime
          persist-credentials: false
          sparse-checkout: actions/release-draft-sync
          sparse-checkout-cone-mode: false

      - name: Load version-matched draft template
        id: assets
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail

          ACTIONS_REF="$(printf '%s' "$WORKFLOW_REF" | sed 's/.*@//')"
          TEMPLATE="$TEMPLATE_PATH"

          if [ ! -f "$TEMPLATE" ]; then
            TEMPLATE="$RUNNER_TEMP/release-drafter-template.yml"
            gh api \
              "repos/moyarich/reusable-workflows/contents/$TEMPLATE_PATH?ref=$ACTIONS_REF" \
              --jq '.content' |
              base64 --decode > "$TEMPLATE"
          fi

          {
            echo "template=$TEMPLATE"
            echo "actions-ref=$ACTIONS_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve draft history
        id: history
        shell: bash
        run: |
          set -euo pipefail

          TARGET_KEY="$TARGET_KEY_INPUT"
          if [ -z "$TARGET_KEY" ]; then
            if [ -n "$TARGET_PATH" ] && [ "$TARGET_PATH" != "." ]; then
              TARGET_KEY="$TARGET_PATH"
            elif [ -n "$PACKAGE_NAME" ]; then
              TARGET_KEY="$PACKAGE_NAME"
            else
              TARGET_KEY="root"
            fi
          fi

          RELEASES="$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")"

          EXPECTED_TAG="$RELEASE_TAG_INPUT"
          if [ -z "$EXPECTED_TAG" ] && [ -n "$INPUT_VERSION" ]; then
            EXPECTED_TAG="$TAG_PREFIX$INPUT_VERSION"
          fi

          PREVIOUS_TAG="$(
            jq -r --arg prefix "$TAG_PREFIX" '
              [
                .[][] |
                select(
                  .draft == false and
                  (.tag_name | startswith($prefix))
                )
              ]
              | sort_by(.published_at // .created_at)
              | last
              | .tag_name // empty
            ' <<< "$RELEASES"
          )"

          EXISTING="$(
            jq -c               --arg marker "<!-- release-draft-sync:target=$TARGET_KEY -->"               --arg expectedTag "$EXPECTED_TAG" '
              [
                .[][] |
                select(
                  .draft == true and
                  ((.body // "") | contains($marker)) and
                  (
                    ($expectedTag | length) == 0 or
                    .tag_name == $expectedTag
                  )
                )
              ]
              | sort_by(.created_at)
              | last // empty
            ' <<< "$RELEASES"
          )"

          # Migration path for drafts created before persistent target markers.
          # When the caller supplied a version/tag, never migrate a different
          # version's draft into the requested release identity.
          if [ -z "$EXISTING" ]; then
            EXISTING="$(
              jq -c                 --arg prefix "$TAG_PREFIX"                 --arg expectedTag "$EXPECTED_TAG" '
                [
                  .[][] |
                  select(
                    .draft == true and
                    (.tag_name | startswith($prefix)) and
                    (
                      ($expectedTag | length) == 0 or
                      .tag_name == $expectedTag
                    )
                  )
                ]
                | sort_by(.created_at)
                | last // empty
              ' <<< "$RELEASES"
            )"
          fi

          EXISTING_BODY_FILE="$RUNNER_TEMP/existing-release-body.md"
          : > "$EXISTING_BODY_FILE"

          EXISTING_ID=""
          EXISTING_URL=""
          EXISTING_TAG=""
          EXISTING_UPDATED_AT=""
          SEED_SHA=""

          if [ -n "$EXISTING" ]; then
            EXISTING_ID="$(jq -r '.id' <<< "$EXISTING")"
            EXISTING_URL="$(jq -r '.html_url' <<< "$EXISTING")"
            EXISTING_TAG="$(jq -r '.tag_name' <<< "$EXISTING")"
            EXISTING_UPDATED_AT="$(jq -r '.updated_at // .created_at // ""' <<< "$EXISTING")"
            jq -r '.body // ""' <<< "$EXISTING" > "$EXISTING_BODY_FILE"

            SEED_SHA="$(
              sed -n 's/.*release-draft-sync:seed-sha=\([^ ]*\).*/\1/p'                 "$EXISTING_BODY_FILE" |
                head -n 1
            )"

            # Existing unmarked drafts are authoritative. Establish a migration
            # baseline from the draft's last update so historical PRs are not
            # replayed, while PRs merged after that draft state can append.
            if [ -z "$SEED_SHA" ]; then
              if [ -n "$EXISTING_UPDATED_AT" ]; then
                SEED_SHA="$(git rev-list -1 --before="$EXISTING_UPDATED_AT" HEAD)"
              fi

              if [ -z "$SEED_SHA" ]; then
                SEED_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
              fi
            fi
          elif [ -n "$SEED_BODY_BASE64" ]; then
            printf '%s' "$SEED_BODY_BASE64" | base64 --decode > "$EXISTING_BODY_FILE"

            SEED_SHA="$(
              sed -n 's/.*release-draft-sync:seed-sha=\([^ ]*\).*/\1/p' "$EXISTING_BODY_FILE" |
                head -n 1
            )"

            if [ -z "$SEED_SHA" ] && [ -n "$SEED_UPDATED_AT" ]; then
              SEED_SHA="$(git rev-list -1 --before="$SEED_UPDATED_AT" HEAD)"
            fi

            if [ -z "$SEED_SHA" ]; then
              SEED_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          EFFECTIVE_VERSION="$INPUT_VERSION"
          if [ -z "$PREVIOUS_TAG" ] && [ -z "$EFFECTIVE_VERSION" ]; then
            EFFECTIVE_VERSION="$INITIAL_VERSION"
          fi

          {
            echo "target-key=$TARGET_KEY"
            echo "expected-tag=$EXPECTED_TAG"
            echo "previous-tag=$PREVIOUS_TAG"
            echo "effective-version=$EFFECTIVE_VERSION"
            echo "existing-id=$EXISTING_ID"
            echo "existing-url=$EXISTING_URL"
            echo "existing-tag=$EXISTING_TAG"
            echo "existing-body-file=$EXISTING_BODY_FILE"
            echo "seed-sha=$SEED_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve requested release version
        id: resolve-version
        env:
          MODE: ${{ steps.typed.outputs.version-mode || inputs.version-mode }}
          BUMP: ${{ steps.typed.outputs.version-bump || inputs.version-bump }}
          EXACT: ${{ steps.typed.outputs.exact-version || inputs.exact-version }}
          EXPLICIT: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ steps.history.outputs.previous-tag }}
          PREFIX: ${{ inputs.tag-prefix }}
          DIRECTORY: ${{ inputs.package-directory }}
          INITIAL: ${{ inputs.initial-version }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const e = process.env;
          const parse = (v) => {
            const m = /^(\d+)\.(\d+)\.(\d+)(?:-([\da-zA-Z.-]+))?(?:\+[\da-zA-Z.-]+)?$/.exec(v);
            if (!m) throw Error('Invalid semantic version: ' + v);
            return { major:+m[1], minor:+m[2], patch:+m[3], pre:m[4] || '' };
          };
          let version = e.EXPLICIT;
          if (e.MODE === 'exact') {
            if (!e.EXACT) throw Error('exact-version is required for exact mode');
            version = e.EXACT;
          } else if (e.MODE === 'package-json') {
            version = JSON.parse(readFileSync(join(e.DIRECTORY || '.', 'package.json'), 'utf8')).version;
          } else if (e.MODE === 'bump') {
            const kind = e.BUMP || 'patch';
            if (!['major','minor','patch','premajor','preminor','prepatch','prerelease'].includes(kind)) throw Error('Invalid version bump: ' + kind);
            const previous = e.PREVIOUS_TAG && e.PREVIOUS_TAG.startsWith(e.PREFIX) ? e.PREVIOUS_TAG.slice(e.PREFIX.length) : '';
            // The npm release CLI bumps package.json, not the last GitHub tag.
            // Use that same baseline so draft and published versions agree,
            // including 0.x minor releases. Non-package targets retain the
            // existing tag/initial-version fallback.
            const manifestPath = join(e.DIRECTORY || '.', 'package.json');
            let current = '';
            try {
              current = JSON.parse(readFileSync(manifestPath, 'utf8')).version;
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
            }
            if (current) parse(current);
            if (!previous) {
              // An initial draft remains pinned to the configured first
              // release, rather than skipping directly to its next bump.
              version = e.EXPLICIT || e.INITIAL;
            } else {
              const v = parse(current || previous);
              if (kind === 'major' || kind === 'premajor') { v.major++; v.minor=0; v.patch=0; v.pre=''; }
              else if (kind === 'minor' || kind === 'preminor') { v.minor++; v.patch=0; v.pre=''; }
              else if (kind === 'patch' || kind === 'prepatch' || (kind === 'prerelease' && !v.pre)) { v.patch++; v.pre=''; }
              if (kind.startsWith('pre')) v.pre='0';
              else if (kind === 'prerelease') {
                const parts=v.pre.split('.');
                const last=parts.length-1;
                if (/^\d+$/.test(parts[last])) parts[last]=String(Number(parts[last])+1);
                else parts.push('0');
                v.pre=parts.join('.');
              }
              version = `${v.major}.${v.minor}.${v.patch}${v.pre ? '-' + v.pre : ''}`;
            }
          } else if (e.MODE) throw Error('Invalid version mode: ' + e.MODE);
          if (version) parse(version);
          appendFileSync(e.GITHUB_OUTPUT, 'version=' + (version || '') + '\n');
          NODE

      - name: Generate Release Drafter config
        id: config
        shell: bash
        run: |
          set -euo pipefail

          GENERATED=".github/release-drafter-generated.yml"

          SOURCE_TEMPLATE="$SOURCE_TEMPLATE"           RELEASE_NAME_INPUT="$RELEASE_NAME_INPUT"           RELEASE_TAG_INPUT="$RELEASE_TAG_INPUT"           TAG_PREFIX="$TAG_PREFIX"           PACKAGE_NAME="$PACKAGE_NAME"           PACKAGE_DIRECTORY="$TARGET_PATH"           INCLUDE_PATHS="$INCLUDE_PATHS"           INPUT_VERSION="${{ steps.resolve-version.outputs.version || inputs.version }}"           node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const versionToken = process.env.INPUT_VERSION || "$RESOLVED_VERSION";
          const releaseName = process.env.RELEASE_NAME_INPUT.replaceAll(
            "{{VERSION}}",
            versionToken,
          );
          const releaseTag =
            process.env.RELEASE_TAG_INPUT ||
            `${process.env.TAG_PREFIX}${versionToken}`;

          const packageDirectory = process.env.PACKAGE_DIRECTORY;
          const configuredPaths = JSON.parse(process.env.INCLUDE_PATHS || "[]");
          const packagePaths =
            configuredPaths.length > 0
              ? configuredPaths
              : [
                  packageDirectory && packageDirectory !== "."
                    ? `${packageDirectory}/**`
                    : "**",
                ];
          const packagePathsYaml = packagePaths
            .map((path) => `        - ${JSON.stringify(path)}`)
            .join("\n");

          const template = readFileSync(process.env.SOURCE_TEMPLATE, "utf8");
          const config = template
            .replaceAll("{{PACKAGE_NAME}}", process.env.PACKAGE_NAME)
            .replaceAll("{{PACKAGE_DIRECTORY}}", packageDirectory)
            .replaceAll("{{PACKAGE_PATHS}}", packagePathsYaml)
            .replaceAll("{{RELEASE_NAME_TEMPLATE}}", releaseName)
            .replaceAll("{{TAG_TEMPLATE}}", releaseTag)
            .replaceAll("{{TAG_PREFIX}}", process.env.TAG_PREFIX);

          writeFileSync(process.env.GENERATED ?? "$RUNNER_TEMP/release-drafter-generated.yml", config);
          NODE

          echo "path=$GENERATED" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_TEMPLATE: ${{ steps.assets.outputs.template }}
          GENERATED: .github/release-drafter-generated.yml

      - name: Discover release changes
        id: drafter
        uses: release-drafter/release-drafter@v7.9.0
        with:
          config-name: file:release-drafter-generated.yml
          commitish: ${{ inputs.target-branch }}
          dry-run: true
          version: ${{ steps.resolve-version.outputs.version || steps.history.outputs.effective-version }}
          from: ${{ steps.history.outputs.seed-sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve canonical draft identity
        id: identity
        env:
          DRAFTER_VERSION: ${{ steps.drafter.outputs.resolved_version }}
          DRAFTER_TAG: ${{ steps.drafter.outputs.tag_name }}
          DRAFTER_NAME: ${{ steps.drafter.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$DRAFTER_VERSION"
          TAG="$DRAFTER_TAG"
          NAME="$DRAFTER_NAME"

          if [ -z "$VERSION" ] || [ -z "$TAG" ] || [ -z "$NAME" ]; then
            echo "::error::Release Drafter did not resolve a complete release identity."
            exit 1
          fi

          PUBLISHED_ID="$(
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
              jq -r --arg tag "$TAG" '
                [.[][] | select(.draft == false and .tag_name == $tag)]
                | first
                | .id // empty
              '
          )"

          if [ -n "$PUBLISHED_ID" ]; then
            echo "::error::A published GitHub Release already exists for $TAG."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare draft reconciliation
        id: reconcile-inputs
        env:
          GENERATED_BODY: ${{ steps.drafter.outputs.body }}
          EXISTING_SEED_SHA: ${{ steps.history.outputs.seed-sha }}
        shell: bash
        run: |
          set -euo pipefail

          GENERATED_FILE="$RUNNER_TEMP/release-drafter-generated.md"
          RESULT_FILE="$RUNNER_TEMP/reconciled-release-body.md"

          printf '%s\n' "$GENERATED_BODY" > "$GENERATED_FILE"

          SEED_SHA="$EXISTING_SEED_SHA"
          if [ -z "$SEED_SHA" ]; then
            SEED_SHA="$(git rev-parse HEAD)"
          fi

          {
            echo "generated-file=$GENERATED_FILE"
            echo "result-file=$RESULT_FILE"
            echo "seed-sha=$SEED_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile persistent draft body
        id: reconcile
        uses: ./.github/reusable-workflows-runtime/actions/release-draft-sync
        with:
          existing-body-file: ${{ steps.history.outputs.existing-body-file }}
          generated-body-file: ${{ steps.reconcile-inputs.outputs.generated-file }}
          output-file: ${{ steps.reconcile-inputs.outputs.result-file }}
          changelog-path: ${{ inputs.changelog-path }}
          version: ${{ steps.identity.outputs.version }}
          target-key: ${{ steps.history.outputs.target-key }}
          seed-sha: ${{ steps.reconcile-inputs.outputs.seed-sha }}
          target-path: ${{ inputs.package-directory }}

      - name: Export reconciled draft result
        id: result
        env:
          BODY_FILE: ${{ steps.reconcile.outputs.body-file }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BODY_FILE" ] || [ ! -f "$BODY_FILE" ]; then
            echo "::error::Reconciled release draft body was not produced."
            exit 1
          fi

          DELIMITER="RELEASE_BODY_$(date +%s%N)"
          {
            echo "body<<$DELIMITER"
            cat "$BODY_FILE"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update persistent draft
        id: write
        env:
          EXISTING_ID: ${{ steps.history.outputs.existing-id }}
          EXISTING_URL: ${{ steps.history.outputs.existing-url }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_NAME: ${{ steps.identity.outputs.name }}
          BODY_FILE: ${{ steps.reconcile-inputs.outputs.result-file }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail

          BODY="$(cat "$BODY_FILE")"

          if [ "$DRY_RUN" = "true" ]; then
            echo "url=$EXISTING_URL" >> "$GITHUB_OUTPUT"
            echo "action=previewed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$EXISTING_ID" ]; then
            RELEASE="$(
              gh api                 --method PATCH                 "repos/$GH_REPO/releases/$EXISTING_ID"                 -f tag_name="$RELEASE_TAG"                 -f target_commitish="$TARGET_BRANCH"                 -f name="$RELEASE_NAME"                 -f body="$BODY"                 -F draft=true
            )"
            ACTION=updated
          else
            RELEASE="$(
              gh api                 --method POST                 "repos/$GH_REPO/releases"                 -f tag_name="$RELEASE_TAG"                 -f target_commitish="$TARGET_BRANCH"                 -f name="$RELEASE_NAME"                 -f body="$BODY"                 -F draft=true
            )"
            ACTION=created
          fi

          echo "url=$(jq -r '.html_url' <<< "$RELEASE")" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Persistent draft summary
        if: always()
        env:
          BODY_FILE: ${{ steps.reconcile.outputs.body-file }}
          SUMMARY_TARGET: ${{ steps.history.outputs.target-key || 'unresolved' }}
          SUMMARY_EXPECTED_TAG: ${{ steps.history.outputs.expected-tag || 'auto' }}
          SUMMARY_VERSION: ${{ steps.identity.outputs.version || 'unresolved' }}
          SUMMARY_TAG: ${{ steps.identity.outputs.tag || 'unresolved' }}
          SUMMARY_SEED_SHA: ${{ steps.reconcile-inputs.outputs.seed-sha || 'unresolved' }}
          SUMMARY_RESULT: ${{ steps.write.outputs.action || 'not written' }}
          SUMMARY_DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          {
            echo "# GitHub Release Draft"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Target | `%s` |\n' "$SUMMARY_TARGET"
            printf '| Expected tag | `%s` |\n' "$SUMMARY_EXPECTED_TAG"
            printf '| Version | `%s` |\n' "$SUMMARY_VERSION"
            printf '| Tag | `%s` |\n' "$SUMMARY_TAG"
            printf '| Seed SHA | `%s` |\n' "$SUMMARY_SEED_SHA"
            printf '| Result | **%s** |\n' "$SUMMARY_RESULT"
            if [ -n "${{ steps.write.outputs.url }}" ]; then
              printf '| Draft | [Open draft](%s) |\n' "${{ steps.write.outputs.url }}"
            elif [ "$SUMMARY_DRY_RUN" = "true" ]; then
              echo "| Draft | _preview only; no release mutated_ |"
            else
              echo "| Draft | unavailable |"
            fi
            echo
            echo "> Existing draft text is authoritative."
            echo "> Release Drafter supplies newly merged PR entries; only unseen PR markers are appended."
            echo
            if [ -n "$BODY_FILE" ] && [ -f "$BODY_FILE" ]; then
              echo "## Draft content"
              echo
              cat "$BODY_FILE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
