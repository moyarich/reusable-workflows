name: CI / npm package lock

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/**/package.json"
      - "apps/**/package.json"
      - ".npmrc"
      - ".github/workflows/ci_package-lock.yml"
      - ".github/workflows/reusable_self-heal_package-lock.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/**/package.json"
      - "apps/**/package.json"
      - ".npmrc"
      - ".github/workflows/ci_package-lock.yml"
      - ".github/workflows/reusable_self-heal_package-lock.yml"
  workflow_dispatch:
    inputs:
      repair:
        description: Repair and commit formatting or lockfile drift
        type: boolean
        default: true

concurrency:
  group: self-heal-validation-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  lockfile:
    uses: $/.github/workflows/reusable_self-heal_package-lock.yml
    with:
      mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.repair)) && 'check' || 'fix' }}
      commit: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.repair) }}

