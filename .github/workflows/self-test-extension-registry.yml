name: Extension registry configuration self-test
on:
  pull_request:
    paths:
      - config/vscode-registries.yml
      - .github/workflows/reusable_vscode-publish.yml
      - .github/workflows/extension-registry-self-test.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint VSIX publication workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9 -ignore 'shellcheck reported issue' .github/workflows/reusable_vscode-publish.yml .github/workflows/extension-registry-self-test.yml
      - name: Validate extension registries and caller overrides
        shell: bash
        run: |
          ruby -ryaml -ruri <<'RUBY'
          defaults = YAML.safe_load_file('config/vscode-registries.yml').fetch('registries')
          abort 'Missing extension defaults' unless defaults.is_a?(Hash) && defaults.size >= 2
          defaults.each do |name, entry|
            abort 'Redundant token-secret' if entry.key?('token-secret')
            abort 'Invalid selector' unless name.match?(/\A[a-z][a-z0-9_-]*\z/)
            uri = URI.parse(entry.fetch('url'))
            abort 'Invalid HTTPS URL' unless uri.is_a?(URI::HTTPS)
            abort 'Invalid token-source' unless entry.fetch('token-source').match?(/\A[A-Za-z_][A-Za-z0-9_]*\z/)
            abort 'Invalid token-env' unless entry.fetch('token-env').match?(/\A[A-Z][A-Z0-9_]*\z/)
          end
          override = {'company' => {'url' => 'https://example.test', 'backend' => 'custom', 'token-source' => 'company-token', 'token-env' => 'COMPANY_TOKEN', 'publish-command' => 'true', 'enabled' => true}, defaults.keys.first => {'enabled' => false}}
          resolved = defaults.merge(override) {|_, base, extra| base.merge(extra)}
          selected = resolved.select {|_, entry| entry.fetch('enabled', true)}
          abort 'Caller extension not included' unless selected.key?('company')
          abort 'Disabled default still selected' if selected.key?(defaults.keys.first)
          RUBY
