name: "Check · Action distribution"

on:
  pull_request:
    paths:
      - "src/actions/**"
      - "actions/dist/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/reusable_heal-cli-dist.yml"
      - ".github/workflows/check-dist.yml"
      - ".github/workflows/reusable_check-dist.yml"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit regenerated distribution to the selected branch
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-dist:
    if: github.event_name == 'pull_request'
    name: Check committed action distribution
    uses: ./.github/workflows/reusable_check-dist.yml
    with:
      dist-path: actions/dist/
      build-command: npm run build:cli
      install-command: npm install --no-package-lock --no-audit --no-fund
      node-version: "24"
      node-caching: ""
      artifact-name: action-dist


  heal-dist:
    if: github.event_name == 'workflow_dispatch'
    name: Rebuild, verify and repair distribution
    permissions:
      contents: write
    uses: ./.github/workflows/reusable_heal-cli-dist.yml
    with:
      dist-path: actions/dist/
      build-command: npm run build:cli
      install-command: npm install --no-package-lock --no-audit --no-fund
      validation-command: npx vitest run
      target-branch: ${{ github.ref_name }}
      expected-sha: ${{ github.sha }}
      node-version: "24"
      commit: ${{ inputs.commit }}
