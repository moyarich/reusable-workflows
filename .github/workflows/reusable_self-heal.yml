name: Reusable · Self-heal before required workflow

on:
  workflow_call:
    inputs:
      repair:
        description: Which preventive repairs to run
        type: string
        default: all
      commit:
        description: Commit repaired files
        type: boolean
        default: true
      node-version:
        type: string
        default: "24"
      required-workflow:
        description: Workflow filename to dispatch and await after successful repairs
        type: string
        required: true
      required-workflow-sha-input:
        description: Optional workflow_dispatch input name used to pass the healed commit SHA; empty disables injection
        type: string
        default: checkout-sha
      required-workflow-inputs:
        description: JSON object of additional workflow_dispatch inputs
        type: string
        default: '{}'
      dist-path:
        description: Optional generated action distribution path
        type: string
        default: ""
      dist-build-command:
        type: string
        default: npm run build:cli
      dist-test-command:
        type: string
        default: npm run test:cli
      target-branch:
        description: Trusted branch to repair and validate
        type: string
        default: main
    outputs:
      healed-sha:
        description: Commit SHA handed to the required workflow
        value: ${{ jobs.required-workflow.outputs.healed-sha }}
permissions: {}
jobs:
  package-lock:
    if: ${{ inputs.repair == 'all' || inputs.repair == 'package-lock' }}
    permissions:
      contents: write
      packages: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-package-lock.yml@main
    with:
      commit: ${{ inputs.commit }}
      node-version: ${{ inputs.node-version }}

  prettier:
    needs: package-lock
    if: ${{ always() && (needs.package-lock.result == 'success' || needs.package-lock.result == 'skipped') && (inputs.repair == 'all' || inputs.repair == 'prettier') }}
    permissions:
      contents: write
      packages: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_prettier.yml@main
    with:
      expected-sha: ${{ needs.package-lock.outputs.healed-sha || github.sha }}
      mode: fix
      prettier-config: this-repository
      commit: ${{ inputs.commit }}
      node-version: ${{ inputs.node-version }}

  action-dist:
    name: Rebuild generated distribution (optional)
    needs: [package-lock, prettier]
    if: ${{ always() && inputs.dist-path != '' && (needs.package-lock.result == 'success' || needs.package-lock.result == 'skipped') && (needs.prettier.result == 'success' || needs.prettier.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      healed-sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Ensure distribution checkout matches preceding repair
        env:
          EXPECTED_SHA: ${{ needs.prettier.outputs.healed-sha || needs.package-lock.outputs.healed-sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::Branch changed before distribution rebuild; restart self-heal"
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm ci --ignore-scripts
      - name: Rebuild and test
        env:
          BUILD_COMMAND: ${{ inputs.dist-build-command }}
          TEST_COMMAND: ${{ inputs.dist-test-command }}
        run: |
          bash -euo pipefail -c "$BUILD_COMMAND"
          bash -euo pipefail -c "$TEST_COMMAND"
      - name: Commit generated distribution
        if: ${{ inputs.commit }}
        env:
          DIST_PATH: ${{ inputs.dist-path }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -euo pipefail
          [[ "$DIST_PATH" =~ ^[a-zA-Z0-9_./-]+$ && "$DIST_PATH" != *..* ]] || exit 1
          test -e "$DIST_PATH"
          git add -f -- "$DIST_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update generated distribution"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Record distribution commit SHA
        id: final
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  required-workflow:
    needs: [package-lock, prettier, action-dist]
    if: ${{ always() && (needs.package-lock.result == 'success' || needs.package-lock.result == 'skipped') && (needs.prettier.result == 'success' || needs.prettier.result == 'skipped') && (needs.action-dist.result == 'success' || needs.action-dist.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      healed-sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Resolve final healed head SHA
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH"
          expected="${{ needs.action-dist.outputs.healed-sha || needs.prettier.outputs.healed-sha || needs.package-lock.outputs.healed-sha || github.sha }}"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq .sha)"
          if [[ "$sha" != "$expected" ]]; then
            echo "::error::Branch advanced since last repair ($expected → $sha). Restart self-heal."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Build required workflow inputs
        id: workflow-inputs
        env:
          INPUTS: ${{ inputs.required-workflow-inputs }}
          SHA_INPUT: ${{ inputs.required-workflow-sha-input }}
          HEALED_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          jq -e 'type == "object"' <<< "$INPUTS" >/dev/null
          if [[ -n "$SHA_INPUT" ]]; then
            [[ "$SHA_INPUT" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || {
              echo "::error::Invalid required-workflow-sha-input"; exit 1;
            }
            result="$(jq -cn --argjson obj "$INPUTS" --arg key "$SHA_INPUT" --arg sha "$HEALED_SHA" '$obj + {($key): $sha}')"
          else
            result="$(jq -c . <<< "$INPUTS")"
          fi
          echo "json=$result" >> "$GITHUB_OUTPUT"
      - name: Dispatch required workflow for healed head and wait
        id: validate
        uses: the-actions-org/workflow-dispatch@v4
        with:
          workflow: ${{ inputs.required-workflow }}
          ref: ${{ inputs.target-branch }}
          inputs: ${{ steps.workflow-inputs.outputs.json }}
          token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout: 30m
      - name: Validate dispatch run SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.validate.outputs.workflow-id }}
          EXPECTED_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Required workflow run started at $actual, expected $EXPECTED_SHA"
            exit 1
          fi
      - name: Link required workflow report
        if: always()
        env:
          WORKFLOW_URL: ${{ steps.validate.outputs.workflow-url }}
          WORKFLOW_NAME: ${{ inputs.required-workflow }}
          RESULT: ${{ steps.validate.outputs.workflow-conclusion }}
        run: |
          {
            echo "## Required workflow after preventive self-heal"
            echo
            echo "Result: ${RESULT:-not completed}"
            echo
            echo "Workflow: $WORKFLOW_NAME"
            if [[ -n "$WORKFLOW_URL" ]]; then echo "[View workflow run]($WORKFLOW_URL)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
