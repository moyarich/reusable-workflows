name: "Reusable · Node CI"

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        default: "."
        type: string
      packages-directory:
        description: Directory containing packages when package-directory is all
        required: false
        default: packages
        type: string
      browser-tests:
        description: Install Chromium dependencies for browser-based tests
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version used by CI
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      checkout-ref:
        description: Optional git ref to validate instead of the caller event ref
        required: false
        type: string
        default: ""
      browser-tests:
        description: Install Chromium dependencies for browser-based tests
        required: false
        default: false
        type: boolean
      package-directory:
        description: Workspace path, directory name, or package name
        required: false
        type: string
        default: "."
      packages-directory:
        description: Directory containing packages when package-directory is all
        required: false
        type: string
        default: packages
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
    secrets:
      package-token:
        description: Token used to install packages from GitHub Packages
        required: false

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Select Node packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-packages: ${{ steps.select.outputs.has-packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false
      - name: Resolve package matrix
        id: select
        shell: bash
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          PACKAGES_DIRECTORY: ${{ inputs.packages-directory }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, existsSync, appendFileSync } from "node:fs";
          import { join, normalize } from "node:path";

          const root = JSON.parse(readFileSync("package.json", "utf8"));
          const selector = process.env.PACKAGE_SELECTOR || ".";
          const base = process.env.PACKAGES_DIRECTORY || "packages";
          const patterns = Array.isArray(root.workspaces) ? root.workspaces : root.workspaces?.packages ?? [];
          const dirs = new Set(["."]);
          for (const pattern of patterns) {
            if (pattern.endsWith("/*")) {
              const parent = pattern.slice(0, -2);
              if (existsSync(parent)) for (const e of readdirSync(parent, { withFileTypes: true })) {
                if (e.isDirectory()) dirs.add(join(parent, e.name));
              }
            } else dirs.add(pattern);
          }
          if (existsSync(base)) for (const e of readdirSync(base, { withFileTypes: true })) {
            if (e.isDirectory()) dirs.add(join(base, e.name));
          }
          const packages = [...dirs].flatMap((directory) => {
            const path = join(directory, "package.json");
            if (!existsSync(path)) return [];
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            return [{ name: manifest.name || directory, directory, scripts: manifest.scripts ?? {} }];
          });
          let selected;
          if (selector === "all") {
            selected = packages.filter((p) => p.directory !== "." && normalize(p.directory).startsWith(normalize(base) + "/") && p.scripts.test);
          } else if (selector === ".") {
            selected = packages.filter((p) => p.directory === ".");
          } else {
            selected = packages.filter((p) => p.name === selector || normalize(p.directory) === normalize(selector));
            if (selected.length === 0) {
              console.error(`::error::Unknown package selector: ${selector}`);
              process.exit(1);
            }
          }
          const matrix = { include: selected.map(({ name, directory }) => ({ name, directory })) };
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\nhas-packages=${selected.length > 0}\n`);
          console.log(JSON.stringify(matrix));
          NODE


  check-node-project:
    name: "Checks · ${{ matrix.name }}"
    needs: resolve
    if: needs.resolve.outputs.has-packages == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7 # v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Install workspace dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
      - name: Build selected workspace and local dependencies
        env:
          WORKSPACE: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$WORKSPACE" = "." ]; then
            npm run build --if-present
            exit 0
          fi

          BUILD_ORDER="$(
            node --input-type=module - "$WORKSPACE" <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";

          const selector = process.argv[2];
          const rootPackage = JSON.parse(readFileSync("package.json", "utf8"));
          const patterns = Array.isArray(rootPackage.workspaces)
            ? rootPackage.workspaces
            : rootPackage.workspaces?.packages ?? [];

          const workspaceDirs = [];
          for (const pattern of patterns) {
            if (!pattern.endsWith("/*")) continue;
            const base = pattern.slice(0, -2);
            for (const entry of readdirSync(base, { withFileTypes: true })) {
              if (entry.isDirectory()) workspaceDirs.push(`${base}/${entry.name}`);
            }
          }

          const packages = new Map();
          for (const dir of workspaceDirs) {
            try {
              const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
              if (manifest.name) packages.set(manifest.name, { dir, manifest });
            } catch {}
          }

          let target = [...packages.values()].find(
            (item) => item.dir === selector || item.manifest.name === selector,
          );

          if (!target) {
            const manifest = JSON.parse(readFileSync(`${selector}/package.json`, "utf8"));
            target = { dir: selector, manifest };
          }

          const seen = new Set();
          const order = [];

          const visit = (item) => {
            if (!item?.manifest?.name || seen.has(item.manifest.name)) return;
            seen.add(item.manifest.name);

            const deps = {
              ...item.manifest.dependencies,
              ...item.manifest.devDependencies,
              ...item.manifest.optionalDependencies,
            };

            for (const name of Object.keys(deps ?? {})) {
              const local = packages.get(name);
              if (local) visit(local);
            }

            order.push(item.manifest.name);
          };

          visit(target);
          process.stdout.write(order.join("\n"));
          NODE
          )"

          while IFS= read -r package; do
            [ -n "$package" ] || continue
            echo "::group::Build $package"
            npm run build --workspace "$package" --if-present
            echo "::endgroup::"
          done <<< "$BUILD_ORDER"

      - name: Install Chromium for Storybook tests
        if: ${{ inputs.browser-tests }}
        run: npx playwright install --with-deps chromium

      - name: Test
        env:
          WORKSPACE: ${{ matrix.directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then
            npm test
          else
            npm test --workspace "$WORKSPACE"
          fi
      - name: Lint
        env:
          WORKSPACE: ${{ matrix.directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run lint --if-present; else npm run lint --workspace "$WORKSPACE" --if-present; fi
      - name: Typecheck
        env:
          WORKSPACE: ${{ matrix.directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run typecheck --if-present; else npm run typecheck --workspace "$WORKSPACE" --if-present; fi

      - name: Validate package tarball
        if: ${{ inputs.package-directory != '.' }}
        env:
          WORKSPACE: ${{ matrix.directory }}
        run: npm pack --workspace "$WORKSPACE" --dry-run

      - name: CI summary
        if: ${{ always() }}
        run: |
          {
            echo "## CI result"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Workspace | \`${{ matrix.directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
