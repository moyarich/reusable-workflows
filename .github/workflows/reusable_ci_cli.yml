name: Reusable CI / CLI and workspace quality
on:
  workflow_call:
    inputs:
      checkout-sha:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate (e.g. after self-heal)
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout-sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f eslint.config.js || -f eslint.config.mjs || -f eslint.config.cjs ]]; then
            npx --no-install eslint . --max-warnings 0
          else
            npx --yes @biomejs/biome@2.2.5 lint packages apps
          fi
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck --if-present
          npm run typecheck --workspaces --if-present
          if [[ -f tsconfig.tests.json ]]; then
            npx --no-install tsc -p tsconfig.tests.json --noEmit
          fi
      - name: Build
        run: npm run build --if-present
      - name: Vitest (workspaces and root)
        run: npm test --workspaces --if-present --include-workspace-root
      - name: Package contents
        run: npm run pack:check --if-present
