name: "Reusable · Validate merged release preparation"
on:
  workflow_call:
    inputs:
      expected-base:
        type: string
        default: main
    outputs:
      manifest:
        value: ${{ jobs.verify.outputs.manifest }
      packages:
        value: ${{ jobs.verify.outputs.packages }
permissions: {}
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/prepare-') && github.event.pull_request.base.ref == inputs.expected-base }
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.validate.outputs.manifest }
      packages: ${{ steps.validate.outputs.packages }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }
          persist-credentials: false
      - name: Verify release manifest matches merged workspace manifests
        id: validate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const file=".release/prepared.json";
          const manifest=JSON.parse(fs.readFileSync(file,"utf8"));
          if(manifest.schemaVersion!==1||!Array.isArray(manifest.packages)||!manifest.packages.length)throw Error("Invalid release manifest");
          const seen=new Set();
          for(const pkg of manifest.packages){
            if(typeof pkg.name!=="string"||typeof pkg.version!=="string"||typeof pkg.directory!=="string")throw Error("Malformed package");
            if(!/^packages\/[A-Za-z0-9/_-]+$/.test(pkg.directory))throw Error("Unsafe package directory: "+pkg.directory);
            if(!/^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$/.test(pkg.version))throw Error("Invalid version: "+pkg.version);
            if(seen.has(pkg.name))throw Error("Duplicate package");
            seen.add(pkg.name);
            const source=path.join(pkg.directory,"package.json");
            const actual=JSON.parse(fs.readFileSync(source,"utf8"));
            if(actual.private||actual.name!==pkg.name||actual.version!==pkg.version)throw Error("Release manifest mismatch: "+pkg.name);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"manifest="+JSON.stringify(manifest)+"\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"packages="+JSON.stringify(manifest.packages)+"\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Approved release candidate\n\nMerged commit: "+process.env.EXPECTED_SHA+"\n\n"+manifest.packages.map(p=>"- "+p.name+"@"+p.version).join("\n")+"\n");
          NODE
