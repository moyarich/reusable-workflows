name: "Reusable · Validate merged release preparation"
on:
  workflow_call:
    inputs:
      expected-base:
        type: string
        default: main
      required-workflows:
        description: Comma-separated paths to CI workflows required to succeed on the PR head SHA
        type: string
        default: ''
    outputs:
      manifest:
        value: ${{ jobs.verify.outputs.manifest }}
      packages:
        value: ${{ jobs.verify.outputs.packages }}
permissions: {}
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/prepare-') && github.event.pull_request.base.ref == inputs.expected-base }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
      statuses: read
      pull-requests: read
    outputs:
      manifest: ${{ steps.validate.outputs.manifest }}
      packages: ${{ steps.validate.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful designated pull request CI
        uses: $/actions/verify-workflow-runs
        with:
          workflows: ${{ inputs.required-workflows }}
          sha: ${{ github.event.pull_request.head.sha }}
          branch: ${{ github.event.pull_request.head.ref }}
          event: pull_request
          token: ${{ github.token }}
      - name: Resolve final approved package versions
        id: validate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const git=(args)=>execFileSync("git",args,{encoding:"utf8"}).trim();
          // The tracked release plan selects packages, but does not freeze versions.
          // Source code, tests, lockfiles, changelogs and versions can all evolve
          // while the PR is reviewed. Read versions from the final merged commit.
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));
          const planFile=".github/release-preparation.json";
          const selected=[];
          const names=new Set();
          let packages;
          if (fs.existsSync(planFile)) {
            const plan=JSON.parse(fs.readFileSync(planFile,"utf8"));
            if(plan.schemaVersion!==1 || !Array.isArray(plan.packages) || !plan.packages.length)
              throw Error("Invalid release preparation plan");
            packages=plan.packages;
          } else {
            // Compatibility with older release preparation PRs that predate
            // tracked package selection: discover changed package versions.
            const base=event.pull_request?.base?.sha;
            if (!/^[0-9a-f]{40}$/.test(base??"")) throw Error("Missing PR base SHA");
            git(["cat-file","-e",base+"^{commit}"]);
            const changed=git(["diff","--name-only",base,"HEAD"]).split("\\n");
            packages=changed.filter(file=>/^(?:packages\\/|apps\\/)[a-zA-Z0-9_./-]+\\/package\\.json$/.test(file) && !file.includes(".."))
              .filter(file=>{
                let previous;
                try {previous=JSON.parse(git(["show",base+":"+file]));} catch {previous=null;}
                const after=JSON.parse(fs.readFileSync(file,"utf8"));
                return previous?.version!==after.version;
              }).map(file=>({directory:file.slice(0,-"/package.json".length)}));
          }
          for(const pkg of packages) {
            const dir=pkg.directory;
            if(typeof dir!=="string" || !/^(?:packages|apps)\\/[a-zA-Z0-9_./-]+$/.test(dir) || dir.includes(".."))
              throw Error("Invalid release package directory: "+dir);
            const file=dir+"/package.json";
            const final=JSON.parse(fs.readFileSync(file,"utf8"));
            if(final.private===true || typeof final.name!=="string" || !/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(final.version))
              throw Error("Invalid final publishable version in "+file);
            if(pkg.name && pkg.name!==final.name) throw Error("Package identity changed: "+file);
            if(names.has(final.name)) throw Error("Duplicate release package: "+final.name);
            names.add(final.name);
            selected.push({name:final.name,directory:dir,version:final.version});
          }
          if(!selected.length) throw Error("No release packages selected");
          const manifest={schemaVersion:1,packages:selected};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"manifest="+JSON.stringify(manifest)+"\npackages="+JSON.stringify(selected)+"\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Approved merged package versions\n\n"+selected.map(p=>"- "+p.name+"@"+p.version).join("\n")+"\n");
          NODE
