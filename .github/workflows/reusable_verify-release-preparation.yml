name: "Reusable · Validate merged release preparation"
on:
  workflow_call:
    inputs:
      expected-base:
        type: string
        default: main
      pr-number:
        type: string
        default: ''
    outputs:
      manifest:
        value: ${{ jobs.verify.outputs.manifest }}
      packages:
        value: ${{ jobs.verify.outputs.packages }}
permissions: {}
jobs:
  verify:
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/prepare-') && github.event.pull_request.base.ref == inputs.expected-base) || (github.event_name == 'workflow_dispatch' && inputs.pr-number != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
      statuses: read
      pull-requests: read
    outputs:
      manifest: ${{ steps.validate.outputs.manifest }}
      packages: ${{ steps.validate.outputs.packages }}
    steps:
      - name: Resolve and validate approved merge
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          EXPECTED_BASE: ${{ inputs.expected-base }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid PR number'; exit 1; }
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/approved-pr.json"
          else
            cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/approved-event.json"
            jq '.pull_request' "$RUNNER_TEMP/approved-event.json" > "$RUNNER_TEMP/approved-pr.json"
          fi
          jq -e --arg repo "$GH_REPO" --arg base "$EXPECTED_BASE" '
            .merged == true and .state == "closed" and .base.ref == $base and
            .head.repo.full_name == $repo and (.head.ref | startswith("release/prepare-")) and
            (.merge_commit_sha | type == "string" and test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/approved-pr.json" > /dev/null || { echo '::error::PR is not an approved merged release preparation'; exit 1; }
          echo "merge-sha=$(jq -r '.merge_commit_sha' "$RUNNER_TEMP/approved-pr.json")" >> "$GITHUB_OUTPUT"
          echo "pr-file=$RUNNER_TEMP/approved-pr.json" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.approved.outputs.merge-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout version-matched reusable workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'moyarich/reusable-workflows' }}
          github-server-url: https://github.com
          ref: ${{ job.workflow_sha || 'main' }}
          path: .github/reusable-workflows-runtime
          persist-credentials: false
      - name: Resolve final approved package versions
        id: validate
        env:
          EXPECTED_SHA: ${{ steps.approved.outputs.merge-sha }}
          APPROVED_PR_FILE: ${{ steps.approved.outputs.pr-file }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const git=(args)=>execFileSync("git",args,{encoding:"utf8"}).trim();
          // Package selection is maintained in the editable PR description.
          // The merged commit is authoritative for code and final versions.
          const approved=JSON.parse(fs.readFileSync(process.env.APPROVED_PR_FILE,"utf8"));
          const body=approved.body ?? "";
          const marker=/<!-- release-preparation:start -->\s*```json\s*([\s\S]*?)\s*```\s*<!-- release-preparation:end -->/g;
          const matches=[...body.matchAll(marker)];
          if(matches.length!==1) throw Error("Expected exactly one release preparation JSON section in the merged PR description");
          const plan=JSON.parse(matches[0][1]);
          if(plan.schemaVersion!==1 || !Array.isArray(plan.packages) || !plan.packages.length)
            throw Error("Invalid release preparation selection");
          const packages=plan.packages;
          const selected=[];
          const names=new Set();
          for(const pkg of packages) {
            const dir=pkg.directory;
            if(typeof dir!=="string" || !/^(?:packages|apps)\/[a-zA-Z0-9_./-]+$/.test(dir) || dir.includes(".."))
              throw Error("Invalid release package directory: "+dir);
            const file=dir+"/package.json";
            const final=JSON.parse(fs.readFileSync(file,"utf8"));
            if(final.private===true || typeof final.name!=="string" || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(final.version))
              throw Error("Invalid final publishable version in "+file);
            if(pkg.name && pkg.name!==final.name) throw Error("Package identity changed: "+file);
            if(names.has(final.name)) throw Error("Duplicate release package: "+final.name);
            names.add(final.name);
            selected.push({name:final.name,directory:dir,version:final.version});
          }
          if(!selected.length) throw Error("No release packages selected");
          const manifest={schemaVersion:1,packages:selected};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"manifest="+JSON.stringify(manifest)+"\npackages="+JSON.stringify(selected)+"\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Approved merged package versions\n\n"+selected.map(p=>"- "+p.name+"@"+p.version).join("\n")+"\n");
          NODE
