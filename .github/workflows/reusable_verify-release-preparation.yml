name: "Reusable · Validate merged release preparation"
on:
  workflow_call:
    inputs:
      expected-base:
        type: string
        default: main
      required-workflows:
        description: Comma-separated paths to CI workflows required to succeed on the PR head SHA
        type: string
        default: ''
    outputs:
      manifest:
        value: ${{ jobs.verify.outputs.manifest }}
      packages:
        value: ${{ jobs.verify.outputs.packages }}
permissions: {}
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/prepare-') && github.event.pull_request.base.ref == inputs.expected-base }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
      statuses: read
      pull-requests: read
    outputs:
      manifest: ${{ steps.validate.outputs.manifest }}
      packages: ${{ steps.validate.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require passing pull request checks before release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          checks="$(gh api --paginate --slurp "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" |
            jq -c '[.[] | .check_runs[]? | {name, status, conclusion}]')"
          jq -e 'length > 0 and any(.[]; .status == "completed" and .conclusion == "success") and
            all(.[]; .status == "completed" and (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped"))' <<< "$checks" >/dev/null || {
            echo "::error::Release preparation PR does not have exclusively completed, passing CI check runs."
            exit 1
          }
          statuses="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status")"
          jq -e '(.statuses | length == 0) or .state == "success"' <<< "$statuses" >/dev/null || {
            echo "::error::Commit status checks are not successful."
            exit 1
          }
          echo "Verified successful head SHA checks for $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Require designated CI workflows on the approved head
        if: ${{ inputs.required-workflows != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_WORKFLOWS: ${{ inputs.required-workflows }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra paths <<< "$REQUIRED_WORKFLOWS"
          for entry in "${paths[@]}"; do
            workflow="$(printf '%s' "$entry" | xargs)"
            [[ "$workflow" =~ ^\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$ ]] || {
              echo "::error::Invalid required workflow path: $workflow"
              exit 1
            }
            workflow_file="${workflow##*/}"
            runs="$(gh api "repos/$GH_REPO/actions/workflows/$workflow_file/runs?head_sha=$HEAD_SHA&per_page=100")"
            jq -e --arg sha "$HEAD_SHA" --arg path "$workflow" '
              any(.workflow_runs[]?;
                .head_sha == $sha and .path == $path and
                .status == "completed" and .conclusion == "success" and
                (.event == "pull_request" or .event == "pull_request_target")
              )' <<< "$runs" >/dev/null || {
              echo "::error::Required CI workflow $workflow has no successful completed PR run for head $HEAD_SHA."
              exit 1
            }
            echo "Required CI workflow passed: $workflow" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Resolve final approved package versions
        id: validate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const git=(args)=>execFileSync("git",args,{encoding:"utf8"}).trim();
          // Compare the final merged tree with the exact PR base SHA.
          // Using merge-base may include unrelated changes from main.
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));
          const before=event.pull_request?.base?.sha;
          if (!/^[0-9a-f]{40}$/.test(before ?? "")) throw Error("Missing PR base SHA");
          const base=before;
          git(["cat-file","-e",base+"^{commit}"]);
          const changed=git(["diff","--name-only",base,"HEAD"]).split("\n");
          const selected=[];
          const names=new Set();
          for(const file of changed) {
            if(!/^(?:packages\/|apps\/)[a-zA-Z0-9_./-]+\/package\.json$/.test(file) || file.includes("..")) continue;
            let previous;
            try { previous=JSON.parse(git(["show",base+":"+file])); } catch { previous=null; }
            const after=JSON.parse(fs.readFileSync(file,"utf8"));
            if(previous?.version===after.version) continue;
            if(after.private || typeof after.name!=="string" || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(after.version)) throw Error("Invalid publishable package version in "+file);
            if(names.has(after.name))throw Error("Duplicate changed workspace package: "+after.name);
            names.add(after.name);
            selected.push({name:after.name,directory:file.slice(0,-"/package.json".length),version:after.version});
          }
          if(!selected.length) throw Error("No publishable workspace versions changed in approved merge");
          const manifest={schemaVersion:1,packages:selected};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"manifest="+JSON.stringify(manifest)+"\npackages="+JSON.stringify(selected)+"\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Approved merged package versions\n\n"+selected.map(p=>"- "+p.name+"@"+p.version).join("\n")+"\n");
          NODE
