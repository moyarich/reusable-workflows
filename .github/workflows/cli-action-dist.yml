
name: CLI build and Vitest

on:
  pull_request:
    paths:
      - "src/**"
      - "packages/cli/**"
      - "tests/**"
      - "actions/**"
      - "vite.config.ts"
      - "vitest.config.*"
      - "playwright.config.*"
      - "**/playwright.config.*"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".prettierignore"
      - "tsconfig.json"
      - "tsconfig.tests.json"
      - ".github/workflows/action-cli-vitest.yml"

  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact healed commit SHA to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.repository }}-${{ inputs.checkout-sha || github.ref }}
  cancel-in-progress: false

jobs:
  lint-workflows:
    name: Validate workflow syntax
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_actionlint.yml@main

  cli:
    name: CLI build, typecheck and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional
        
      - name: Run Typecheck
        id: typecheck
        shell: bash
        run: |
          npm run typecheck --workspaces --if-present

          if [[ -f tsconfig.tests.json ]]; then
            npx --no-install tsc -p tsconfig.tests.json --noEmit
          elif [[ -f tsconfig.json ]]; then
            npx --no-install tsc -p tsconfig.json --noEmit
          else
            echo "No TypeScript configuration found; skipping tsc."
          fi

      - name: Build action CLI distributions
        id: build
        run: npm run build

      - name: Build npm Commander CLI
        id: build-package
        run: npm run build:package

      - name: Run Vitest
        id: vitest
        run: npx --no-install vitest run

      - name: Verify npm CLI help and package contents
        id: verify-package
        run: |
          node packages/cli/dist/cli.mjs --help
          node packages/cli/dist/cli.mjs workspace-source --source registry:npm:latest
          npm pack --workspace @moyarich/reusable-workflows-cli --dry-run

      - name: Verify tracked action distributions
        id: verify-dist
        run: |
          git diff --exit-code -- actions/dist/
          test -f actions/dist/browser-extension-publish.mjs
          test -f actions/dist/setup-workspace-tools.mjs
          test -f actions/dist/release-draft-sync.mjs
          test -f actions/dist/validate-release-identity.mjs
          test -z "$(git ls-files --others --exclude-standard -- actions/dist/)"
          
      # Detect browser-test changes only on pull requests.
      # Manual dispatch runs Playwright when configured.
      - name: Detect Playwright changes
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            playwright:
              - '**/*.spec.*'
              - '**/*.specs.*'
              - '**/playwright.config.*'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/action-cli-vitest.yml'

      # Only install browsers when Playwright is configured
      # and the relevant files have changed (or manually dispatched).
      - name: Install Playwright browsers
        id: playwright-install
        if: |
          hashFiles('playwright.config.*', '**/playwright.config.*') != '' &&
          (github.event_name != 'pull_request' ||
           steps.changes.outputs.playwright == 'true')
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Playwright
        id: playwright
        if: |
          hashFiles('playwright.config.*', '**/playwright.config.*') != '' &&
          (github.event_name != 'pull_request' ||
           steps.changes.outputs.playwright == 'true')
        run: npx --no-install playwright test

      - name: Upload Playwright traces on failure
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

      - name: Write verification summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BUILD_PACKAGE: ${{ steps.build-package.outcome }}
          VITEST: ${{ steps.vitest.outcome }}
          VERIFY_PACKAGE: ${{ steps.verify-package.outcome }}
          VERIFY_DIST: ${{ steps.verify-dist.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
        run: |
          {
            echo "## CLI build and Vitest"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Typecheck | $TYPECHECK |"
            echo "| Action CLI build | $BUILD |"
            echo "| npm Commander CLI build | $BUILD_PACKAGE |"
            echo "| Vitest | $VITEST |"
            echo "| npm package verification | $VERIFY_PACKAGE |"
            echo "| Action distribution verification | $VERIFY_DIST |"
            echo "| Playwright | $PLAYWRIGHT |"
            echo
            echo "**Overall:** $STATUS"
            echo
            echo 'Source: `src/actions/` | Output: `actions/dist/`'
            echo
            echo "Node.js 24"
          } >> "$GITHUB_STEP_SUMMARY"
