name: "Self-test · Dispatch input summary"

on:
  pull_request:
    paths:
      - .github/workflows/reusable_dispatch-input-summary.yml
      - .github/workflows/self-test_dispatch-input-summary.yml
  workflow_dispatch:

permissions: {}

jobs:
  summary:
    permissions:
      contents: read
    uses: $/.github/workflows/reusable_dispatch-input-summary.yml
    with:
      parameters-json: '{"package":"example","dry-run":true,"token":"should-be-hidden"}'
      exclude-inputs: '["excluded"]'
      heading: Contract test · Workflow inputs

  verify-summary:
    name: Dispatch summary self-test result
    needs: summary
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record reusable summary contract
        env:
          RESULT: ${{ needs.summary.result }}
        run: |
          {
            echo "## Dispatch input summary self-test"
            echo
            echo "| Contract | Result |"
            echo "| --- | --- |"
            echo "| Reusable dispatch summary | $RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
