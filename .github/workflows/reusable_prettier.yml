name: "Reusable · Prettier self-heal"

on:
  workflow_dispatch:
    inputs:
      configuration-source:
        description: Choose local Prettier rules or the shared reference rules
        required: true
        default: caller
        type: choice
        options:
          - caller
          - shared
      commit:
        description: Commit Prettier changes
        required: true
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      configuration-source:
        description: Choose local Prettier rules or the shared reference rules
        required: false
        default: caller
        type: string
      commit:
        description: Commit Prettier changes
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: false
        default: "24"
        type: string

permissions:
  contents: write

jobs:
  format:
    name: "Prettier self-heal"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Resolve Prettier version
        id: prettier
        shell: bash
        run: |
          set -euo pipefail

          PRETTIER_VERSION="$(
            node -e '
              const pkg = require("./package.json");
              const version = pkg.devDependencies?.prettier;
              if (!version) {
                console.error("package.json must declare devDependencies.prettier");
                process.exit(1);
              }
              process.stdout.write(version);
            '
          )"

          echo "version=$PRETTIER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve Prettier configuration and ignores
        id: config
        env:
          SOURCE: ${{ inputs.configuration-source }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IGNORE_FILE="$GITHUB_WORKSPACE/.prettier-self-heal.ignore"
          touch "$IGNORE_FILE"
          if [ -f .prettierignore ]; then
            cat .prettierignore > "$IGNORE_FILE"
            printf '\n' >> "$IGNORE_FILE"
          fi
          printf '%s\n' '.github/workflows/' 'dist/' '.prettier-self-heal.ignore' >> "$IGNORE_FILE"
          echo "ignore-file=$IGNORE_FILE" >> "$GITHUB_OUTPUT"
          case "$SOURCE" in
            caller)
              echo "config-file=" >> "$GITHUB_OUTPUT"
              ;;
            shared)
              CONFIG_FILE="$RUNNER_TEMP/shared-prettier.json"
              gh api "repos/moyarich/reusable-workflows/contents/reusable-configurations/.prettierrc.json?ref=main" --jq '.content' | base64 --decode > "$CONFIG_FILE"
              echo "config-file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::configuration-source must be caller or shared"
              exit 1
              ;;
          esac

      - name: Prettier self-heal
        id: format
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="${{ steps.config.outputs.config-file }}"
          CONFIG_ARGS=()
          if [ -n "$CONFIG_FILE" ]; then CONFIG_ARGS+=(--config "$CONFIG_FILE"); fi

          npx --yes "prettier@${{ steps.prettier.outputs.version }}" . \
            --write \
            --ignore-path "${{ steps.config.outputs.ignore-file }}" \
            "${CONFIG_ARGS[@]}"

          git status --short -- . ':!.github/workflows/**' ':!dist/**' ':!.prettier-self-heal.ignore' > /tmp/format-status.txt

          if [ -s /tmp/format-status.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Prettier formatting
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="${{ steps.config.outputs.config-file }}"
          CONFIG_ARGS=()
          if [ -n "$CONFIG_FILE" ]; then CONFIG_ARGS+=(--config "$CONFIG_FILE"); fi
          npx --yes "prettier@${{ steps.prettier.outputs.version }}" . \
            --check \
            --ignore-path "${{ steps.config.outputs.ignore-file }}" \
            "${CONFIG_ARGS[@]}"

      - name: Commit Prettier changes
        if: ${{ inputs.commit && steps.format.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The GitHub token cannot update workflow files. Protect these paths.
          git add --all -- . ':!.github/workflows/**' ':!dist/**' ':!.prettier-self-heal.ignore'
          if git diff --cached --quiet; then
            echo "No permitted formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format repository"
          TARGET_REF="${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:$TARGET_REF"

      - name: Fail if Prettier formatting verification failed
        if: ${{ always() && steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          echo "Prettier --check still fails after Prettier --write." >&2
          exit 1

      - name: Format summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Prettier self-heal"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Node.js | `%s` |\n' "${{ inputs.node-version || '24' }}"
            printf '| Configuration source | %s |\n' "${{ inputs.configuration-source }}"
            printf '| Prettier | `%s` |\n' "${{ steps.prettier.outputs.version || 'unknown' }}"
            printf '| Commit requested | **%s** |\n' "${{ inputs.commit }}"
            printf '| Branch | `%s` |\n' "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
            echo "| Changes detected | **${{ steps.format.outputs.changed || 'unknown' }}** |"
            echo "| Verification | **${{ steps.verify.outcome || 'unknown' }}** |"
            echo "| Result | **${{ job.status }}** |"

            if [ -s /tmp/format-status.txt ]; then
              echo
              echo "## Prettier changes"
              echo
              echo '~~~text'
              cat /tmp/format-status.txt
              echo '~~~'

              if [ "${{ inputs.commit }}" != "true" ]; then
                echo
                echo "> [!NOTE]"
                echo "> Preview only. Prettier changes were written in the runner but not committed."
              fi
            else
              echo
              echo "No Prettier changes were required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
