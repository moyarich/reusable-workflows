name: "Reusable · Prettier self-heal"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check formatting without changes, or fix it in the runner
        required: false
        default: check
        type: string
      prettier-config:
        description: Use this repository's Prettier rules or the reusable-workflows reference rules
        required: true
        default: this-repository
        type: choice
        options:
          - this-repository
          - reusable-workflows
      commit:
        description: Commit Prettier changes
        required: true
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      mode:
        description: Check formatting without changes, or fix it in the runner
        required: false
        default: check
        type: string
      prettier-config:
        description: Use this repository's Prettier rules or the reusable-workflows reference rules
        required: false
        default: this-repository
        type: string
      commit:
        description: Commit Prettier changes
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: false
        default: "24"
        type: string

permissions:
  contents: write

jobs:
  format:
    name: "Prettier self-heal"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Resolve installed Prettier
        id: prettier
        shell: bash
        run: |
          set -euo pipefail
          test -x node_modules/.bin/prettier || { echo "::error::Prettier must be installed by npm ci"; exit 1; }
          echo "version=$(node_modules/.bin/prettier --version)" >> "$GITHUB_OUTPUT"

      - name: Resolve Prettier configuration and ignores
        id: config
        env:
          SOURCE: ${{ inputs.prettier-config }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IGNORE_FILE="$GITHUB_WORKSPACE/.prettier-self-heal.ignore"
          : > "$IGNORE_FILE"
          if [ -f .prettierignore ]; then
            cat .prettierignore > "$IGNORE_FILE"
            printf '\n' >> "$IGNORE_FILE"
          fi
          printf '%s\n' '.github/workflows/' 'dist/' '.prettier-self-heal.ignore' >> "$IGNORE_FILE"
          echo "ignore-file=$IGNORE_FILE" >> "$GITHUB_OUTPUT"
          case "$SOURCE" in
            this-repository)
              echo "config-file=" >> "$GITHUB_OUTPUT"
              ;;
            reusable-workflows)
              CONFIG_FILE="$RUNNER_TEMP/shared-prettier.json"
              gh api "repos/moyarich/reusable-workflows/contents/reusable-configurations/.prettierrc.json?ref=main" --jq '.content' | base64 --decode > "$CONFIG_FILE"
              echo "config-file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::prettier-config must be this-repository or reusable-workflows"
              exit 1
              ;;
          esac

      - name: Run Prettier
        id: format
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="${{ steps.config.outputs.config-file }}"
          CONFIG_ARGS=()
          if [ -n "$CONFIG_FILE" ]; then CONFIG_ARGS+=(--config "$CONFIG_FILE"); fi
          case "$MODE" in
            check) ACTION=--check ;;
            fix) ACTION=--write ;;
            *) echo "::error::mode must be check or fix"; exit 1 ;;
          esac
          node_modules/.bin/prettier . "$ACTION" \
            --ignore-path "${{ steps.config.outputs.ignore-file }}" \
            "${CONFIG_ARGS[@]}"
          git status --short -- . ':!.github/workflows/**' ':!dist/**' ':!.prettier-self-heal.ignore' > /tmp/format-status.txt
          if [ -s /tmp/format-status.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Prettier changes
        if: ${{ inputs.mode == 'fix' && inputs.commit && steps.format.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The GitHub token cannot update workflow files. Protect these paths.
          git add --all -- . ':!.github/workflows/**' ':!dist/**' ':!.prettier-self-heal.ignore'
          if git diff --cached --quiet; then
            echo "No permitted formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format repository"
          TARGET_REF="${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
          git push origin "HEAD:$TARGET_REF"

      - name: Format summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Prettier self-heal"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Node.js | `%s` |\n' "${{ inputs.node-version || '24' }}"
            printf '| Mode | %s |\n' "${{ inputs.mode }}"
            printf '| Configuration source | %s |\n' "${{ inputs.prettier-config }}"
            printf '| Prettier | `%s` |\n' "${{ steps.prettier.outputs.version || 'unknown' }}"
            printf '| Commit requested | **%s** |\n' "${{ inputs.commit }}"
            printf '| Branch | `%s` |\n' "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
            echo "| Changes detected | **${{ steps.format.outputs.changed || 'unknown' }}** |"

            echo "| Result | **${{ job.status }}** |"

            if [ -s /tmp/format-status.txt ]; then
              echo
              echo "## Prettier changes"
              echo
              echo '~~~text'
              cat /tmp/format-status.txt
              echo '~~~'

              if [ "${{ inputs.commit }}" != "true" ]; then
                echo
                echo "> [!NOTE]"
                echo "> Preview only. Prettier changes were written in the runner but not committed."
              fi
            else
              echo
              echo "No Prettier changes were required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
