name: Action CLI build and Vitest

on:
  pull_request:
    paths:
      - "src/**"
      - "packages/cli/**"
      - "tests/**"
      - "actions/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".prettierignore"
      - "tsconfig.json"
      - "tsconfig.tests.json"
      - "playwright.config.*"
      - "**/playwright.config.*"
      - ".github/workflows/action-cli-vitest.yml"
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact healed commit SHA to validate
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  action-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Lint and typecheck action sources and tests
        run: |
          npm run lint
          npm run typecheck --workspaces --if-present
          if [[ -f tsconfig.tests.json ]]; then
            npx --no-install tsc -p tsconfig.tests.json --noEmit
          elif [[ -f tsconfig.json ]]; then
            npx --no-install tsc -p tsconfig.json --noEmit
          fi
      - name: Build action CLI distributions
        id: build
        run: npm run build:cli
      - name: Build npm Commander CLI
        run: npm run build:package
      - name: Verify npm CLI help and package contents
        run: |
          node packages/cli/dist/cli.mjs --help
          node packages/cli/dist/cli.mjs workspace-source --source registry:npm:latest
          npm pack --workspace @moyarich/reusable-workflows-cli --dry-run
      - name: Run Vitest tests
        id: test
        run: npx --no-install vitest run
      - name: Verify tracked action distributions
        run: |
          git diff --exit-code -- actions/dist/
          test -f actions/dist/browser-extension-publish.mjs
          test -f actions/dist/setup-workspace-tools.mjs
          test -f actions/dist/release-draft-sync.mjs
          test -f actions/dist/validate-release-identity.mjs
          test -z "$(git ls-files --others --exclude-standard -- actions/dist/)"
      - name: Detect Playwright changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            playwright:
              - '**/*.spec.*'
              - '**/*.specs.*'
              - '**/playwright.config.*'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/action-cli-vitest.yml'
      - name: Install Chromium
        if: |
          hashFiles('playwright.config.*', '**/playwright.config.*') != '' &&
          (github.event_name != 'pull_request' || steps.changes.outputs.playwright == 'true')
        run: npx --no-install playwright install --with-deps chromium
      - name: Run Playwright
        id: playwright
        if: |
          hashFiles('playwright.config.*', '**/playwright.config.*') != '' &&
          (github.event_name != 'pull_request' || steps.changes.outputs.playwright == 'true')
        run: npx --no-install playwright test
      - name: Upload Playwright traces on failure
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      - name: Write verification summary
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          {
            echo "## Action CLI build and Vitest"
            echo
            echo 'Source: `src/actions/` | Output: `actions/dist/`'
            echo
            echo "Build and tests are run against Node.js 24."
          } >> "$GITHUB_STEP_SUMMARY"
