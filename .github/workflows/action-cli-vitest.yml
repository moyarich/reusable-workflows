name: Action CLI build and Vitest

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "actions/**"
      - "vite.config.ts"
      - "package.json"
      - ".github/workflows/action-cli-vitest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Build action CLI distributions
        id: build
        run: npm run build:cli
      - name: Export generated bundles for committing
        run: |
          for file in actions/dist/*.mjs; do
            echo "BUNDLE-BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "BUNDLE-END:$file"
          done
      - name: Run Vitest tests
        id: test
        run: npm run test:cli
      - name: Verify tracked action distributions
        run: |
          git diff --exit-code -- actions/dist/
          test -f actions/dist/setup-workspace-tools.mjs
      - name: Write verification summary
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          {
            echo "## Action CLI build and Vitest"
            echo
            echo 'Source: `src/` | Output: `actions/*`'
            echo
            echo "Build and tests are run against Node.js 24."
          } >> "$GITHUB_STEP_SUMMARY"
