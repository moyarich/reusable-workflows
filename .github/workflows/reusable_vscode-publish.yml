name: "Reusable · Publish VS Code extensions"

on:
  workflow_call:
    inputs:
      package-directory:
        description: Extension workspace directory containing package.json
        type: string
        default: "."
      node-version:
        description: Node.js version
        type: string
        default: "24"
      install-command:
        description: Dependency installation command executed at repository root
        type: string
        default: npm ci --include=optional
      check-command:
        description: Repository validation command (empty to skip)
        type: string
        default: npm run check
      package-command:
        description: Command creating VSIX artifacts (empty if check-command already packages)
        type: string
        default: ""
      artifact-glob:
        description: Repository-relative path to generated VSIX files (empty uses generated VSIX from vsce package)
        type: string
        default: ""
      artifact-name:
        description: Uploaded artifact name
        type: string
        default: openvsx-vsix
      target-branch:
        description: Branch to package and publish
        type: string
        default: main
      version:
        description: Version to validate against package.json (empty uses package.json)
        type: string
        default: ""
      release-tag-prefix:
        description: Prefix for default GitHub Release tags (for example packages/colorshower@)
        type: string
        default: v
      release-tag:
        description: Existing GitHub Release tag to attach the VSIX to (empty uses release-tag-prefix + version)
        type: string
        default: ""
      attach-release-asset:
        description: Attach the packaged VSIX to the existing GitHub Release
        type: boolean
        default: true
      release-environment:
        description: Environment requiring approval before real publishing
        type: string
        default: release
      marketplace-mode:
        description: "publish or already-published (skip only the marketplace)"
        type: string
        default: publish
      vsce-package-args:
        description: Extra VSIX packaging arguments
        type: string
        default: "--allow-missing-repository --no-rewrite-relative-links"
      registry:
        description: Configured extension registry alias or all
        type: string
        default: openvsx
      registries-file:
        description: Optional caller registry YAML path, extending bundled extension registry defaults
        type: string
        default: ""
      dry-run:
        description: Validate and upload VSIX without publishing
        type: boolean
        default: true
    secrets:
      package-token:
        required: false
    outputs:
      publish-status:
        description: validated, published, or failed
        value: ${{ jobs.outcome.outputs.publish-status }}
      extension-version:
        value: ${{ jobs.extension.outputs.extension-version }}
      extension-name:
        value: ${{ jobs.extension.outputs.extension-name }}
      vsix-name:
        value: ${{ jobs.extension.outputs.vsix-name }}
      release-asset-status:
        value: ${{ jobs.release-asset.outputs.status }}
  workflow_dispatch:
    inputs:
      package-directory:
        type: string
        default: "."
      artifact-glob:
        type: string
        default: ""
      registry:
        type: string
        default: openvsx
      registries-file:
        type: string
        default: ""
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  approval:
    name: "job: Publish approval"
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.release-environment }}
    steps:
      - run: echo "Real extension publish approved" >> "$GITHUB_STEP_SUMMARY"

  extension:
    needs: approval
    if: ${{ always() && (inputs.dry-run || needs.approval.result == 'success') }}
    name: "job: Validate and publish VSIX"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      publish-status: ${{ steps.outcome.outputs.status }}
      targets-json: ${{ steps.registries.outputs.targets-json }}
      extension-version: ${{ steps.identity.outputs.version }}
      extension-name: ${{ steps.identity.outputs.name }}
      vsix-name: ${{ steps.vsix.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-branch || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version || '24' }}
      - name: Validate paths and configuration
        env:
          DIRECTORY: ${{ inputs.package-directory }}
          GLOB: ${{ inputs.artifact-glob }}
          REGISTRY: ${{ inputs.registry || 'openvsx' }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$DIRECTORY"; do
            [ -n "$value" ] || { echo "::error::Package directory and VSIX path are required"; exit 1; }
            case "$value" in /*|..|../*|*/../*|*/..) echo "::error::Invalid path: $value"; exit 1;; esac
          done
          [ -f "$DIRECTORY/package.json" ] || { echo "::error::Missing $DIRECTORY/package.json"; exit 1; }
          [ -n "$REGISTRY" ] || { echo "::error::Registry selector must not be empty"; exit 1; }
      - name: Resolve extension identity and version
        id: identity
        env:
          DIRECTORY: ${{ inputs.package-directory }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./' + process.argv[1] + '/package.json').name" "$DIRECTORY")"
          version="$(node -p "require('./' + process.argv[1] + '/package.json').version" "$DIRECTORY")"
          if [ -n "$REQUESTED_VERSION" ] && [ "$version" != "$REQUESTED_VERSION" ]; then
            echo "::error::Requested version does not match package.json"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Validate VS Code extension manifest
        env:
          DIRECTORY: ${{ inputs.package-directory }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.DIRECTORY, 'package.json');
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const errors = [];
          if (!manifest.publisher || typeof manifest.publisher !== 'string') errors.push('publisher');
          if (!manifest.engines || typeof manifest.engines.vscode !== 'string') errors.push('engines.vscode');
          if (!manifest.name || typeof manifest.name !== 'string' || manifest.name.startsWith('@')) errors.push('unscoped name');
          if (errors.length) {
            console.error('::error title=Not a publishable VS Code extension::' + process.env.DIRECTORY + '/package.json is missing valid ' + errors.join(', ') + '. Select a VS Code extension, not an ordinary npm library.');
            process.exitCode = 1;
          }
          NODE
      - name: Checkout bundled extension registry defaults
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: main
          path: .github/reusable-extension-registry-config
          persist-credentials: false
          sparse-checkout: .github/reusable-configurations/vscode-registries.yml
          sparse-checkout-cone-mode: false
      - name: Resolve extension registry aliases
        id: registries
        shell: bash
        env:
          REGISTRIES_FILE: ${{ inputs.registries-file }}
          REGISTRY_SELECTION: ${{ inputs.registry || 'openvsx' }}
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -ruri <<'RUBY'
          defaults_file = '.github/reusable-extension-registry-config/.github/reusable-configurations/vscode-registries.yml'
          abort "Missing bundled extension registry defaults: #{defaults_file}" unless File.file?(defaults_file)
          requested_file = ENV.fetch('REGISTRIES_FILE', '')
          abort 'Invalid registries-file path' if requested_file.start_with?('/') || requested_file.split('/').include?('..')
          abort "Caller registries-file not found: #{requested_file}" if requested_file != '' && !File.file?(requested_file)
          base = YAML.safe_load_file(defaults_file).fetch('registries')
          abort 'Default extension registries must be a mapping' unless base.is_a?(Hash)
          overrides = if requested_file != '' && File.file?(requested_file)
            YAML.safe_load_file(requested_file).fetch('registries', {})
          else
            {}
          end
          abort 'Caller extension registries must be a mapping' unless overrides.is_a?(Hash)
          configured = base.merge(overrides) do |key, default, override|
            abort "Registry #{key} must be a mapping" unless default.is_a?(Hash) && override.is_a?(Hash)
            default.merge(override)
          end
          configured.each do |alias_name, entry|
            abort "Invalid registry alias: #{alias_name}" unless alias_name.match?(/\A[a-z][a-z0-9_-]*\z/)
            abort "Invalid config for #{alias_name}" unless entry.is_a?(Hash)
            url = URI.parse(entry.fetch('url'))
            abort "Invalid HTTPS registry endpoint for #{alias_name}" unless url.is_a?(URI::HTTPS) && url.host && !url.userinfo && !url.query && !url.fragment
            abort "Invalid enabled flag for #{alias_name}" unless [true, false].include?(entry.fetch('enabled', true))
            abort "Missing backend for #{alias_name}" unless entry.fetch('backend').is_a?(String)
            abort "Missing publish command for #{alias_name}" unless entry.fetch('publish-command').is_a?(String)
            abort "Missing credential source for #{alias_name}" unless entry.fetch('token-source').is_a?(String) && entry.fetch('token-source').match?(/\A[A-Za-z_][A-Za-z0-9_]*\z/)
            abort "Missing token environment variable for #{alias_name}" unless entry.fetch('token-env').match?(/\A[A-Z][A-Z0-9_]*\z/)
          end
          selector = ENV.fetch('REGISTRY_SELECTION')
          selected = if selector == 'all'
            configured.select { |_, entry| entry.fetch('enabled', true) }.keys
          else
            abort "Unknown extension registry alias: #{selector}" unless configured.key?(selector)
            abort "Extension registry disabled: #{selector}" unless configured.fetch(selector).fetch('enabled', true)
            [selector]
          end
          abort 'No enabled extension registries selected' if selected.empty?
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |out|
            out.puts "selected=#{selected.join(',')}"
            out.puts "targets-json=#{JSON.generate(selected.map { |name| { 'alias' => name }.merge(configured.fetch(name)) })}"
          end
          File.open(ENV.fetch('GITHUB_STEP_SUMMARY'), 'a') do |out|
            out.puts "### Resolved extension registries"
            out.puts
            out.puts "| Alias | Selected |"
            out.puts "| --- | --- |"
            configured.each_key { |name| out.puts "| #{name} | #{selected.include?(name)} |" }
            out.puts
            out.puts "Configuration: #{requested_file != '' && File.file?(requested_file) ? requested_file : 'bundled defaults'}"
          end
          RUBY
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
          COMMAND: ${{ inputs.install-command || 'npm ci --include=optional' }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Validate extension
        if: ${{ inputs.check-command != '' }}
        env:
          COMMAND: ${{ inputs.check-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Package VSIX
        if: ${{ inputs.package-command != '' }}
        env:
          COMMAND: ${{ inputs.package-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Package extension with vsce
        if: ${{ inputs.artifact-glob == '' && inputs.package-command == '' }}
        env:
          DIRECTORY: ${{ inputs.package-directory }}
          PACKAGE_ARGS: ${{ inputs.vsce-package-args }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIRECTORY"
          read -r -a flags <<< "$PACKAGE_ARGS"
          npx --yes @vscode/vsce package "${flags[@]}"
      - name: Resolve VSIX artifact path
        id: vsix
        env:
          GLOB: ${{ inputs.artifact-glob }}
          DIRECTORY: ${{ inputs.package-directory }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        shell: bash
        run: |
          if [ -z "$GLOB" ]; then
            echo "glob=$DIRECTORY/*.vsix" >> "$GITHUB_OUTPUT"
          else
            echo "glob=$GLOB" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify VSIX output
        env:
          GLOB: ${{ steps.vsix.outputs.glob }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=( $GLOB )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No VSIX files matched $GLOB"
            exit 1
          fi
          for file in "${files[@]}"; do
            [ -f "$file" ] && [ -s "$file" ] || { echo "::error::Empty or invalid VSIX: $file"; exit 1; }
            [[ "$file" == *.vsix ]] || { echo "::error::Expected .vsix artifact: $file"; exit 1; }
          done
          [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected one VSIX, found ${#files[@]}"; exit 1; }
          printf 'Validated %s VSIX file(s)\n' "${#files[@]}"
      - name: Upload validated VSIX
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name || 'open-vsx-vsix' }}
          path: ${{ steps.vsix.outputs.glob }}
          if-no-files-found: error
      - name: Report outcome
        id: outcome
        if: ${{ success() }}
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "status=validated" >> "$GITHUB_OUTPUT"
          else
            echo "status=validated" >> "$GITHUB_OUTPUT"
          fi
      - name: Workflow summary
        if: ${{ always() }}
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          DIRECTORY: ${{ inputs.package-directory }}
          VERSION: ${{ steps.identity.outputs.version }}
          EXTENSION: ${{ steps.identity.outputs.name }}
          VSIX: ${{ steps.vsix.outputs.glob }}
          REGISTRY: ${{ steps.registries.outputs.selected }}
          STATUS: ${{ job.status }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          TAG_PREFIX: ${{ inputs.release-tag-prefix }}
          ATTACH_RELEASE_ASSET: ${{ inputs.attach-release-asset }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## VS Code extension · Packaging"
            echo
            if [[ "$STATUS" == success ]]; then
              echo "✅ **Packaging and validation succeeded**"
            else
              echo "❌ **Packaging or validation failed** — no extension was published by this job."
            fi
            echo
            echo "| Setting | Value |"
            echo "| :--- | :--- |"
            printf '| Extension | `%s` |\n' "${EXTENSION:-not resolved}"
            printf '| Directory | `%s` |\n' "$DIRECTORY"
            printf '| Version | `%s` |\n' "${VERSION:-not resolved}"
            printf '| Registry targets | %s |\n' "${REGISTRY:-not resolved}"
            printf '| Mode | %s |\n' "$([[ "$DRY_RUN" == true ]] && echo 'Dry run (no publishing)' || echo 'Live publishing requested')"
            printf '| VSIX path | `%s` |\n' "${VSIX:-not generated}"
            printf '| Release asset | %s |\n' "$([[ "$DRY_RUN" == true ]] && echo 'Not attached (dry run)' || [[ "$ATTACH_RELEASE_ASSET" == true ]] && echo 'Requested after successful publishing' || echo 'Disabled')"
            printf '| Release tag | `%s` |\n' "${RELEASE_TAG:-${TAG_PREFIX}${VERSION:-<version>}}"
            echo
            if [[ "$STATUS" != success ]]; then
              echo "### Troubleshooting"
              echo
              echo 'Check the first failed step above. The selected directory must contain a real VS Code extension manifest (`publisher`, `engines.vscode`, and an unscoped extension `name`).'
              echo 'For custom packaging, set `package-command` and `artifact-glob` to produce exactly one .vsix.'
              echo
            elif [[ "$DRY_RUN" == true ]]; then
              echo "### Next step"
              echo
              echo "The validated VSIX is available as a workflow artifact. Live registry publishing remains disabled."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: "job: Publish ${{ matrix.target.alias }}"
    needs: extension
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.extension.outputs.targets-json) }}
    steps:
      - name: Download validated VSIX
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name || 'open-vsx-vsix' }}
          path: ${{ runner.temp }}/vsix
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version || '24' }}
      - name: Publish selected registry
        if: ${{ !(inputs.marketplace-mode == 'already-published' && matrix.target.alias == 'marketplace') }}
        env:
          REGISTRY_TOKEN: ${{ matrix.target.token-source == 'github-token' && github.token || secrets[matrix.target.token-source] }}
          TOKEN_ENV: ${{ matrix.target.token-env }}
          PUBLISH_COMMAND: ${{ matrix.target.publish-command }}
          REGISTRY_ALIAS: ${{ matrix.target.alias }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$REGISTRY_TOKEN" ] || { echo "::error::Missing secret for registry $REGISTRY_ALIAS"; exit 1; }
          [[ "$TOKEN_ENV" =~ ^[A-Z][A-Z0-9_]*$ ]] || { echo "::error::Invalid token-env"; exit 1; }
          mapfile -d '' -t files < <(find "$RUNNER_TEMP/vsix" -type f -name '*.vsix' -print0)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected exactly one VSIX"; exit 1; }
          VSIX_FILE="${files[0]}"
          export VSIX_FILE
          export "$TOKEN_ENV=$REGISTRY_TOKEN"
          bash -euo pipefail -c "$PUBLISH_COMMAND"
          echo "Published $REGISTRY_ALIAS" >> "$GITHUB_STEP_SUMMARY"

  outcome:
    name: "job: Aggregate extension publishing"
    if: ${{ always() && needs.extension.result == 'success' }}
    needs: [extension, publish, release-asset]
    runs-on: ubuntu-latest
    outputs:
      publish-status: ${{ steps.aggregate.outputs.status }}
    steps:
      - name: Report publishing result
        id: aggregate
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_ASSET_RESULT: ${{ needs.release-asset.result }}
          ATTACH_RELEASE_ASSET: ${{ inputs.attach-release-asset }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            echo "status=validated" >> "$GITHUB_OUTPUT"
            echo "VSIX packaged and validated (dry run; no registry publication)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH_RESULT" = success ] && { [ "$ATTACH_RELEASE_ASSET" != true ] || [ "$RELEASE_ASSET_RESULT" = success ]; }; then
            echo "status=published" >> "$GITHUB_OUTPUT"
            echo "VSIX published to configured registries." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::One or more extension registry publications failed"
            exit 1
          fi

  release-asset:
    name: "job: Attach VSIX to existing GitHub Release"
    needs: [extension, publish]
    if: ${{ !inputs.dry-run && inputs.attach-release-asset && needs.extension.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      status: ${{ steps.attach.outputs.status }}
    steps:
      - name: Download packaged VSIX
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name || 'open-vsx-vsix' }}
          path: ${{ runner.temp }}/vsix
      - name: Attach VSIX asset to existing release
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release-tag }}
          TAG_PREFIX: ${{ inputs.release-tag-prefix }}
          VERSION: ${{ needs.extension.outputs.extension-version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${TAG_PREFIX}${VERSION}}"
          mapfile -d '' -t files < <(find "$RUNNER_TEMP/vsix" -type f -name '*.vsix' -print0)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packaged VSIX"
            exit 1
          fi
          # Find drafts as well as published releases by tag.
          release="$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | first // empty')"
          if [ -z "$release" ]; then
            echo "::error::No GitHub Release (draft or published) exists for $tag"
            exit 1
          fi
          filename="$(basename "${files[0]}")"
          if jq -e --arg name "$filename" '.assets[]? | select(.name == $name)' <<< "$release" >/dev/null; then
            echo "::warning title=VSIX already attached::$filename already exists on release $tag"
            echo "status=already-attached" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.immutable // false' <<< "$release")" = true ]; then
            echo "::error::Release $tag is immutable; attach VSIX before finalizing the release"
            exit 1
          fi
          gh release upload "$tag" "${files[0]}" --repo "$GH_REPO"
          echo "status=attached" >> "$GITHUB_OUTPUT"
          echo "Attached `$filename` to release `$tag`." >> "$GITHUB_STEP_SUMMARY"
