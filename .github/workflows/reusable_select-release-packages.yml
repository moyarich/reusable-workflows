name: "Reusable · Select release packages"

on:
  workflow_call:
    inputs:
      packages-json:
        required: true
        type: string
      ignored-paths-json:
        description: JSON array of changed file paths to ignore for root-package selection
        required: false
        default: '[]'
        type: string
      package:
        required: false
        default: all
        type: string
      changed-packages-only:
        description: For all-package manual drafts, skip tagged packages without implementation changes
        required: false
        default: false
        type: boolean
      event-name:
        required: true
        type: string
      before-sha:
        required: false
        default: ""
        type: string
      after-sha:
        required: true
        type: string
      target-branch:
        required: false
        default: main
        type: string
      version-mode:
        required: false
        default: bump
        type: string
      version-bump:
        required: false
        default: patch
        type: string
      exact-version:
        required: false
        default: ""
        type: string
    outputs:
      matrix:
        value: ${{ jobs.select-packages.outputs.matrix }}
      has-packages:
        value: ${{ jobs.select-packages.outputs.has-packages }}
      count:
        value: ${{ jobs.select-packages.outputs.count }}
      version-mode:
        value: ${{ jobs.select-packages.outputs.version-mode }}
      version-bump:
        value: ${{ jobs.select-packages.outputs.version-bump }}
      exact-version:
        value: ${{ jobs.select-packages.outputs.exact-version }}

permissions: {}

jobs:
  select-packages:
    name: Select packages for drafting
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-packages: ${{ steps.select.outputs.has-packages }}
      count: ${{ steps.select.outputs.count }}
      version-mode: ${{ steps.select.outputs.version-mode }}
      version-bump: ${{ steps.select.outputs.version-bump }}
      exact-version: ${{ steps.select.outputs.exact-version }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected packages
        id: select
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          CHANGED_PACKAGES_ONLY: ${{ inputs.changed-packages-only }}
          BEFORE_SHA: ${{ inputs.before-sha }}
          AFTER_SHA: ${{ inputs.after-sha }}
          PACKAGES_JSON: ${{ inputs.packages-json }}
          IGNORED_PATHS_JSON: ${{ inputs.ignored-paths-json }}
          VERSION_MODE: ${{ inputs.event-name == 'workflow_dispatch' && inputs.version-mode || '' }}
          VERSION_BUMP: ${{ inputs.event-name == 'workflow_dispatch' && inputs.version-bump || '' }}
          EXACT_VERSION: ${{ inputs.event-name == 'workflow_dispatch' && inputs.exact-version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGES_JSON="$(jq -c '.included' <<< "$PACKAGES_JSON")"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_PACKAGE" = "all" ]; then
              if [ "$CHANGED_PACKAGES_ONLY" = "true" ]; then
                SELECTED="$(
                  PACKAGES_JSON="$PACKAGES_JSON" VERSION_BUMP="$VERSION_BUMP" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const packages = JSON.parse(process.env.PACKAGES_JSON || "[]");
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const selected = packages.filter((pkg) => {
            const prefix = pkg.directory === "." ? pkg.name : pkg.directory;
            const tags = git("tag", "--sort=-version:refname", "--list",
              prefix + "@*", pkg.name + "@*").split("\n").filter(Boolean);
            if (!tags.length) return true;
            const files = git("diff", "--name-only", tags[0], "HEAD", "--", pkg.directory)
              .split("\n").filter(Boolean);
            const directory = pkg.directory === "." ? "" : pkg.directory + "/";
            return files.some((file) => {
              const local = file.startsWith(directory) ? file.slice(directory.length) : file;
              if (local === "package.json") {
                const previous = JSON.parse(git("show", tags[0] + ":" + file));
                const current = JSON.parse(readFileSync(file, "utf8"));
                return ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]
                  .some((field) => JSON.stringify(Object.entries(previous[field] ?? {}).sort()) !==
                    JSON.stringify(Object.entries(current[field] ?? {}).sort()));
              }
              return !["package-lock.json", "CHANGELOG.md"].includes(local);
            });
          });
          // A changed host may require a new addon release even when the addon
          // has no direct file changes. Expand until dependent ranges are valid.
          const selectedNames = new Set(selected.map((pkg) => pkg.name));
          const fields = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"];
          const parseVersion = (value) => {
            const match = /^(\\d+)\\.(\\d+)\\.(\\d+)/.exec(value || "");
            return match ? match.slice(1).map(Number) : null;
          };
          const satisfies = (version, range) => {
            const target = parseVersion(version);
            if (!target) return true;
            const clauses = String(range).split("||").map((part) => part.trim());
            return clauses.some((clause) => {
              if (clause === "*" || !clause) return true;
              const comparators = clause.match(/(?:\\^|~|>=|<=|>|<|=)?\\s*\\d+\\.\\d+\\.\\d+/g);
              if (!comparators || comparators.join(" ").replace(/\\s/g, "") !== clause.replace(/\\s/g, "")) return true;
              const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              return comparators.every((raw) => {
                const m = /^(\\^|~|>=|<=|>|<|=)?\\s*(\\d+\\.\\d+\\.\\d+)$/.exec(raw.trim());
                if (!m) return true;
                const base = parseVersion(m[2]);
                const relation = cmp(target, base);
                switch (m[1] || "=") {
                  case "^": {
                    const upper = base[0] > 0 ? [base[0] + 1, 0, 0]
                      : base[1] > 0 ? [0, base[1] + 1, 0] : [0, 0, base[2] + 1];
                    return relation >= 0 && cmp(target, upper) < 0;
                  }
                  case "~": return relation >= 0 && cmp(target, [base[0], base[1] + 1, 0]) < 0;
                  case ">=": return relation >= 0;
                  case ">": return relation > 0;
                  case "<=": return relation <= 0;
                  case "<": return relation < 0;
                  default: return relation === 0;
                }
              });
            });
          };
          let expanded = true;
          while (expanded) {
            expanded = false;
            for (const pkg of packages) {
              if (selectedNames.has(pkg.name)) continue;
              const manifest = JSON.parse(readFileSync(
                pkg.directory === "." ? "package.json" : pkg.directory + "/package.json", "utf8"));
              const incompatible = fields.some((field) => Object.entries(manifest[field] ?? {})
                .some(([name, range]) => {
                  if (!selectedNames.has(name) || typeof range !== "string") return false;
                  const dependency = packages.find((candidate) => candidate.name === name);
                  if (!dependency) return false;
                  const oldVersion = JSON.parse(readFileSync(
                    dependency.directory === "." ? "package.json" : dependency.directory + "/package.json",
                    "utf8")).version;
                  const parts = parseVersion(oldVersion);
                  if (!parts) return false;
                  // The manual bump selection has a predictable next version.
                  const bump = process.env.VERSION_BUMP || "patch";
                  if (bump === "major") { parts[0]++; parts[1] = 0; parts[2] = 0; }
                  else if (bump === "minor") { parts[1]++; parts[2] = 0; }
                  else if (bump === "patch") parts[2]++;
                  else return false;
                  return !satisfies(parts.join("."), range);
                }));
              if (incompatible) { selectedNames.add(pkg.name); expanded = true; }
            }
          }
          const expandedSelection = packages.filter((pkg) => selectedNames.has(pkg.name));
          process.stdout.write(JSON.stringify(expandedSelection));
          NODE
                )"
              else
                SELECTED="$PACKAGES_JSON"
              fi
            else
              SELECTED="$(
                jq -c --arg selector "$INPUT_PACKAGE" '
                  [
                    .[] |
                    select(.name == $selector or .directory == $selector)
                  ]
                ' <<< "$PACKAGES_JSON"
              )"
            fi
          else
            if [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            else
              CHANGED_FILES="$(git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA")"
            fi

            SELECTED="$(
              PACKAGES_JSON="$PACKAGES_JSON" CHANGED_FILES="$CHANGED_FILES" IGNORED_PATHS_JSON="$IGNORED_PATHS_JSON" node --input-type=module <<'NODE'
          const packages = JSON.parse(process.env.PACKAGES_JSON || "[]");
          const files = (process.env.CHANGED_FILES || "")
            .split("\n")
            .map((file) => file.trim())
            .filter(Boolean);

          const ignored = new Set(JSON.parse(process.env.IGNORED_PATHS_JSON || "[]"));
          const selected = packages.filter((pkg) => {
            if (pkg.directory === ".") {
              return files.some(
                (file) =>
                  !packages.some(
                    (candidate) =>
                      candidate.directory !== "." &&
                      (file === candidate.directory ||
                        file.startsWith(`${candidate.directory}/`)),
                  ) &&
                  !ignored.has(file),
              );
            }

            return files.some(
              (file) =>
                file === pkg.directory || file.startsWith(`${pkg.directory}/`),
            );
          });

          process.stdout.write(JSON.stringify(selected));
          NODE
            )"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$VERSION_MODE" in
              auto|bump|package-json|exact)
                ;;
              *)
                echo "::error::Version mode must be auto, bump, package-json, or exact."
                exit 1
                ;;
            esac

            case "$VERSION_BUMP" in
              patch|minor|major|prepatch|preminor|premajor|prerelease)
                ;;
              *)
                echo "::error::Invalid version bump: $VERSION_BUMP"
                exit 1
                ;;
            esac

            if [ "$VERSION_MODE" = "exact" ] && [ -z "$EXACT_VERSION" ]; then
              echo "::error::Exact version is required when version-mode is exact."
              exit 1
            fi

          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PACKAGE" != "all" ] && [ "$(jq 'length' <<< "$SELECTED")" -eq 0 ]; then
            echo "::error::Unknown package selector: $INPUT_PACKAGE"
            exit 1
          fi

          COUNT="$(jq 'length' <<< "$SELECTED")"
          MATRIX="$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')"

          {
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "has-packages=true"
            else
              echo "has-packages=false"
            fi
            echo "version-mode=$VERSION_MODE"
            echo "version-bump=$VERSION_BUMP"
            echo "exact-version=$EXACT_VERSION"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Package draft selection"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Selected packages | **$COUNT** |"
            echo "| Changed packages only | $CHANGED_PACKAGES_ONLY |"
            echo
            echo '~~~json'
            jq . <<< "$SELECTED"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

