name: "Reusable · Select release packages"

on:
  workflow_call:
    inputs:
      packages-json:
        required: true
        type: string
      package:
        required: false
        default: all
        type: string
      event-name:
        required: true
        type: string
      before-sha:
        required: false
        default: ""
        type: string
      after-sha:
        required: true
        type: string
      target-branch:
        required: false
        default: main
        type: string
      version-mode:
        required: false
        default: bump
        type: string
      version-bump:
        required: false
        default: patch
        type: string
      exact-version:
        required: false
        default: ""
        type: string
    outputs:
      matrix:
        value: ${{ jobs.select-packages.outputs.matrix }}
      has-packages:
        value: ${{ jobs.select-packages.outputs.has-packages }}
      count:
        value: ${{ jobs.select-packages.outputs.count }}
      version-mode:
        value: ${{ jobs.select-packages.outputs.version-mode }}
      version-bump:
        value: ${{ jobs.select-packages.outputs.version-bump }}
      exact-version:
        value: ${{ jobs.select-packages.outputs.exact-version }}

permissions: {}

jobs:
  select-packages:
    name: Select packages for drafting
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-packages: ${{ steps.select.outputs.has-packages }}
      count: ${{ steps.select.outputs.count }}
      version-mode: ${{ steps.select.outputs.version-mode }}
      version-bump: ${{ steps.select.outputs.version-bump }}
      exact-version: ${{ steps.select.outputs.exact-version }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected packages
        id: select
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          BEFORE_SHA: ${{ inputs.before-sha }}
          AFTER_SHA: ${{ inputs.after-sha }}
          PACKAGES_JSON: ${{ inputs.packages-json }}
          VERSION_MODE: ${{ inputs.event-name == 'workflow_dispatch' && inputs.version-mode || '' }}
          VERSION_BUMP: ${{ inputs.event-name == 'workflow_dispatch' && inputs.version-bump || '' }}
          EXACT_VERSION: ${{ inputs.event-name == 'workflow_dispatch' && inputs.exact-version || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_PACKAGE" = "all" ]; then
              SELECTED="$PACKAGES_JSON"
            else
              SELECTED="$(
                jq -c --arg selector "$INPUT_PACKAGE" '
                  [
                    .[] |
                    select(.name == $selector or .directory == $selector)
                  ]
                ' <<< "$PACKAGES_JSON"
              )"
            fi
          else
            if [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            else
              CHANGED_FILES="$(git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA")"
            fi

            SELECTED="$(
              PACKAGES_JSON="$PACKAGES_JSON" CHANGED_FILES="$CHANGED_FILES" node --input-type=module <<'NODE'
          const packages = JSON.parse(process.env.PACKAGES_JSON || "[]");
          const files = (process.env.CHANGED_FILES || "")
            .split("\n")
            .map((file) => file.trim())
            .filter(Boolean);

          const selected = packages.filter((pkg) => {
            if (pkg.directory === ".") {
              return files.some(
                (file) =>
                  !packages.some(
                    (candidate) =>
                      candidate.directory !== "." &&
                      (file === candidate.directory ||
                        file.startsWith(`${candidate.directory}/`)),
                  ) &&
                  true,
              );
            }

            return files.some(
              (file) =>
                file === pkg.directory || file.startsWith(`${pkg.directory}/`),
            );
          });

          process.stdout.write(JSON.stringify(selected));
          NODE
            )"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$VERSION_MODE" in
              bump|package-json|exact)
                ;;
              *)
                echo "::error::Version mode must be bump, package-json, or exact."
                exit 1
                ;;
            esac

            case "$VERSION_BUMP" in
              patch|minor|major|prepatch|preminor|premajor|prerelease)
                ;;
              *)
                echo "::error::Invalid version bump: $VERSION_BUMP"
                exit 1
                ;;
            esac

            if [ "$VERSION_MODE" = "exact" ] && [ -z "$EXACT_VERSION" ]; then
              echo "::error::Exact version is required when version-mode is exact."
              exit 1
            fi

          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PACKAGE" != "all" ] && [ "$(jq 'length' <<< "$SELECTED")" -eq 0 ]; then
            echo "::error::Unknown package selector: $INPUT_PACKAGE"
            exit 1
          fi

          COUNT="$(jq 'length' <<< "$SELECTED")"
          MATRIX="$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')"

          {
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "has-packages=true"
            else
              echo "has-packages=false"
            fi
            echo "version-mode=$VERSION_MODE"
            echo "version-bump=$VERSION_BUMP"
            echo "exact-version=$EXACT_VERSION"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Package draft selection"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Selected packages | **$COUNT** |"
            echo
            echo '~~~json'
            jq . <<< "$SELECTED"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

