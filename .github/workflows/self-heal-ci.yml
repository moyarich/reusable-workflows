name: "Self-heal · Action distribution"

on:
  push:
    paths:
      - "packages/cli/src/**"
      - "packages/actions/actions/**"
      - "packages/actions/scripts/**"
      - "packages/actions/plugins/**"
      - "packages/cli/src/workflow-dispatch/**"
      - "packages/cli/src/verify-workflow-runs/**"
      - "packages/actions/vite.config.ts"
      - ".github/workflows/ci_cli.yml"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - "tests/**"
      - "actions/**"
      - ".github/workflows/self-heal-ci.yml"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit regenerated action bundles
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  action-dist:
    name: Rebuild and repair action distribution
    if: ${{ !contains(github.event.head_commit.message, '[skip action-dist self-heal]') }}
    permissions:
      contents: write
    uses: $/.github/workflows/reusable_self-heal-dist.yml
    with:
      checkout-sha: ${{ github.sha }}
      expected-sha: ${{ github.sha }}
      target-branch: ${{ github.ref_name }}
      dist-path: actions/
      build-command: npm run build:actions
      install-command: npm install --no-package-lock --no-audit --no-fund
      validation-command: "test -f actions/setup-workspace-tools/action.yml && test -f actions/setup-workspace-tools/index.mjs && test -f actions/release-draft-sync/action.yml && test -f actions/parse-typed-inputs/action.yml && test -f actions/validate-package-changelogs/action.yml"
      artifact-name: github-actions-distribution
      node-version: "24"
      repair: true
      commit: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
