name: "Reusable · Prepare release PR"
on:
  workflow_call:
    inputs:
      package:
        type: string
        default: all
      version-mode:
        type: string
        default: auto
      initial-version:
        type: string
        default: '0.1.0'
      version-bump:
        type: string
        default: patch
      exact-version:
        type: string
        default: ''
      target-branch:
        type: string
        default: main
      dry-run:
        type: boolean
        default: true
    secrets:
      workflow-token:
        required: false
    outputs:
      pr-number:
        value: ${{ jobs.prepare.outputs.pr-number }}
permissions: {}
concurrency:
  group: prepare-release-${{ github.repository }}-${{ inputs.target-branch }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Checkout workspace-tools release tooling
        uses: actions/checkout@v7
        with:
          repository: moyarich/workspace-tools
          ref: main
          path: .release-tools
          persist-credentials: false
          fetch-depth: 1
      - name: Build workspace preparation CLI
        run: |
          npm ci --prefix .release-tools --include=optional --no-audit --no-fund
          npm run build --prefix .release-tools --workspace @moyarich/workspace-tools
      - name: Prepare versions and release manifest
        shell: bash
        env:
          SELECTOR: ${{ inputs.package }}
          MODE: ${{ inputs.version-mode }}
          BUMP: ${{ inputs.version-bump }}
          INITIAL: ${{ inputs.initial-version }}
          EXACT: ${{ inputs.exact-version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-preparation"
          node .release-tools/packages/workspace-tools/dist/bin/workspace-prepare-release.mjs \
            --package "$SELECTOR" \
            --version-mode "$MODE" \
            --version-bump "$BUMP" \
            --initial-version "$INITIAL" \
            --exact-version "$EXACT" \
            --write \
            --manifest "$RUNNER_TEMP/release-preparation/manifest.json"
          git diff --check
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { packages } = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/release-preparation/manifest.json", "utf8"));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "## Release preparation\n\n| Package | Previous version | Prepared version |\n| --- | --- | --- |\n" +
            packages.map(p => `| \`${p.name}\` | \`${p.currentVersion}\` | \`${p.version}\` |`).join("\n") + "\n");
          NODE
      - name: Upload proposed release manifest
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-manifest
          path: ${{ runner.temp }}/release-preparation/manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Open preparation pull request
        if: ${{ !inputs.dry-run }}
        id: pr
        env:
          GH_TOKEN: ${{ secrets.workflow-token || github.token }}
          BASE: ${{ inputs.target-branch }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/prepare-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Checkout is clean; stage only tracked version/lockfile edits.
          git add -u
          git diff --cached --quiet && { echo "No version changes needed; package.json already defines the selected release version."; exit 0; }
          git commit -m "release: prepare selected workspace versions"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          gh pr create --base "$BASE" --head "$branch" --title "release: prepare packages" --body "Review workspace versions, dependency ranges and lockfile. The proposed manifest is attached to the preparation workflow run; merge only after CI passes."
          pr="$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number')"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
