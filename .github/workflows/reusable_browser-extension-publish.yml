name: "Reusable · Publish browser extensions"

on:
  workflow_call:
    inputs:
      package-directory:
        description: Workspace containing the browser extension
        type: string
        default: "."
      build-directory:
        description: Built extension folder relative to repository root
        type: string
        default: dist
      install-command:
        type: string
        default: npm ci --include=optional
      build-command:
        type: string
        default: npm run build --if-present
      node-version:
        type: string
        default: "24"
      registry:
        description: chrome, firefox, or all
        type: string
        default: all
      chrome-publisher-id:
        description: Chrome Web Store publisher ID for API V2
        type: string
        default: ""
      chrome-extension-id:
        description: Chrome Web Store extension ID
        type: string
        default: ""
      firefox-addon-id:
        description: Firefox Add-on ID (checked against manifest browser_specific_settings.gecko.id)
        type: string
        default: ""
      release-environment:
        type: string
        default: release
      dry-run:
        type: boolean
        default: true
    secrets:
      chrome-client-id:
        required: false
      chrome-client-secret:
        required: false
      chrome-refresh-token:
        required: false
      firefox-api-key:
        required: false
      firefox-api-secret:
        required: false
    outputs:
      extension-version:
        value: ${{ jobs.package.outputs.version }}
  workflow_dispatch:
    inputs:
      registry:
        description: Destination
        type: choice
        options: [chrome, firefox, all]
        default: all
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  approval:
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment || 'release' }}
    steps:
      - run: echo "Browser extension store submission authorized" >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: approval
    if: ${{ always() && (inputs.dry-run || needs.approval.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: npm
      - name: Checkout typed browser publisher
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: main
          path: .github/browser-publisher
          persist-credentials: false
      - name: Build typed publisher CLI
        run: |
          npm --prefix .github/browser-publisher ci --include=optional
          npm --prefix .github/browser-publisher run build:cli
      - name: Validate extension workspace
        env:
          PACKAGE_DIR: ${{ inputs.package-directory || '.' }}
        run: test -f "$PACKAGE_DIR/package.json"
      - name: Install
        env:
          COMMAND: ${{ inputs.install-command || 'npm ci --include=optional' }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: ${{ inputs.build-command != '' }}
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Validate extension manifest
        id: identity
        env:
          BUILD_DIR: ${{ inputs.build-directory || 'dist' }}
          REGISTRY: ${{ inputs.registry || 'all' }}
          FIREFOX_ID: ${{ inputs.firefox-addon-id }}
        run: node .github/browser-publisher/actions/browser-extension-publish/index.mjs validate --build-directory "$BUILD_DIR" --registry "$REGISTRY" --firefox-addon-id "$FIREFOX_ID"
      - name: Package extension ZIP
        env:
          BUILD_DIR: ${{ inputs.build-directory || 'dist' }}
        run: node .github/browser-publisher/actions/browser-extension-publish/index.mjs package --build-directory "$BUILD_DIR" --output extension.zip
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension-zip
          path: extension.zip
          if-no-files-found: error
      - name: Publish Chrome Web Store
        if: ${{ !inputs.dry-run && (inputs.registry == 'chrome' || inputs.registry == 'all') }}
        env:
          PUBLISHER_ID: ${{ inputs.chrome-publisher-id }}
          EXTENSION_ID: ${{ inputs.chrome-extension-id }}
          CHROME_CLIENT_ID: ${{ secrets.chrome-client-id }}
          CHROME_CLIENT_SECRET: ${{ secrets.chrome-client-secret }}
          CHROME_REFRESH_TOKEN: ${{ secrets.chrome-refresh-token }}
        run: node .github/browser-publisher/actions/browser-extension-publish/index.mjs publish-chrome --archive extension.zip --publisher-id "$PUBLISHER_ID" --extension-id "$EXTENSION_ID"
      - name: Submit Firefox Add-ons listing
        if: ${{ !inputs.dry-run && (inputs.registry == 'firefox' || inputs.registry == 'all') }}
        env:
          BUILD_DIR: ${{ inputs.build-directory || 'dist' }}
          FIREFOX_API_KEY: ${{ secrets.firefox-api-key }}
          FIREFOX_API_SECRET: ${{ secrets.firefox-api-secret }}
        run: node .github/browser-publisher/actions/browser-extension-publish/index.mjs publish-firefox --build-directory "$BUILD_DIR" --output-directory firefox-signed
      - name: Upload Firefox signed artifacts
        if: ${{ !inputs.dry-run && (inputs.registry == 'firefox' || inputs.registry == 'all') }}
        uses: actions/upload-artifact@v7
        with:
          name: firefox-signed-extension
          path: firefox-signed/
          if-no-files-found: warn
