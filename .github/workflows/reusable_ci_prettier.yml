name: Reusable CI / Prettier
on:
  workflow_call:
    inputs:
      checkout-sha:
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Check formatting without modifications
        run: npx --no-install prettier --check .
