name: "Reusable · npm lockfile self-heal"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check lockfile consistency or repair it
        type: choice
        options: [check, fix]
        default: fix
      commit:
        description: Commit recreated package-lock.json
        required: true
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      checkout-sha:
        description: Commit SHA to validate in check mode
        type: string
        default: ""
      mode:
        description: Check lockfile consistency or repair it
        type: string
        default: fix
      commit:
        description: Commit recreated package-lock.json
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: false
        default: "24"
        type: string
    outputs:
      healed-sha:
        description: Checked-out or committed branch SHA at end of repair
        value: ${{ jobs.recreate-lockfile.outputs.healed-sha }}
    secrets:
      package-token:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  recreate-lockfile:
    outputs:
      healed-sha: ${{ steps.head.outputs.sha }}
    name: "npm lockfile self-heal"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.mode == 'check' && inputs.checkout-sha || (github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name) }}
          persist-credentials: ${{ inputs.mode == 'fix' && inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Check lockfile consistency and prepare repair
        id: recreate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            cp package-lock.json /tmp/package-lock.before.json
          else
            : > /tmp/package-lock.before.json
          fi

          test "${{ inputs.mode }}" = check -o "${{ inputs.mode }}" = fix
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

          if [ -f package-lock.json ] && git diff --quiet -- package-lock.json && ! git ls-files --others --exclude-standard -- package-lock.json | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"operation":"package-lock","status":"unchanged"}' \
              | tee /tmp/package-lock-result.json
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json | tee /tmp/package-lock-stat.txt
            git diff -- package-lock.json > /tmp/package-lock.diff
            printf '%s\n' '{"operation":"package-lock","status":"updated"}' \
              | tee /tmp/package-lock-result.json
          fi

      - name: Validate checked or repaired lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail when lockfile check detects drift
        if: ${{ inputs.mode == 'check' && steps.recreate.outputs.changed == 'true' }}
        run: |
          echo "::error::package-lock.json is out of sync with package manifests; run self-heal in fix mode."
          exit 1

      - name: Self-heal changed package-lock.json
        if: ${{ inputs.mode == 'fix' && inputs.commit && steps.recreate.outputs.changed == 'true' }}
        shell: bash
        env:
          TARGET_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json
          git commit -m "chore: self-heal package-lock.json"
          TARGET_REF="$TARGET_REF"
          # Preserve new commits when the branch advances during lockfile generation.
          # Recompute the lockfile if package manifests changed upstream.
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/$TARGET_REF"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Lockfile changes conflict with newer commits on $TARGET_REF. Rerun self-heal on the latest branch state."
              exit 1
            fi

            if git push origin "HEAD:refs/heads/$TARGET_REF"; then
              echo "Lockfile changes pushed on attempt $attempt."
              exit 0
            fi

            echo "::warning::Branch moved during push (attempt $attempt/3); retrying."
          done

          echo "::error::Could not push the lockfile after 3 attempts."
          exit 1

      - name: Record final commit SHA
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package-lock summary
        if: ${{ always() }}
        shell: bash
        env:
          SUMMARY_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          {
            echo "# npm lockfile self-heal"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Changed | **${{ steps.recreate.outputs.changed || 'unknown' }}** |"
            echo "| Commit requested | **${{ inputs.commit }}** |"
            echo "| Branch | \`$SUMMARY_REF\` |"
            echo "| Result | **${{ job.status }}** |"

            if [ -s /tmp/package-lock-stat.txt ]; then
              echo
              echo "## Lockfile changes"
              echo
              echo '\`\`\`text'
              cat /tmp/package-lock-stat.txt
              echo '\`\`\`'
            fi

            if [ -s /tmp/package-lock-result.json ]; then
              echo
              echo "## Result"
              echo
              echo '\`\`\`json'
              cat /tmp/package-lock-result.json
              echo '\`\`\`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

