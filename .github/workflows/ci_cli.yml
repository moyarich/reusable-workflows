name: CI / CLI build and tests
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "tests/**"
      - "vitest.config.*"
      - "**/vitest.config.*"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.*"
      - "tsconfig*.json"
      - ".github/workflows/ci_cli.yml"
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  cli:
    uses: $/.github/workflows/reusable_ci_cli.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha }}
