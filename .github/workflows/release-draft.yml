name: Release Draft

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit semantic version
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview without writing the draft
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  draft:
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/reusable_release-drafter.yml
    with:
      target-branch: main
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      initial-version: "0.1.0"
      tag-prefix: "v"
      release-name: "Reusable Workflows v$RESOLVED_VERSION"
      changelog-path: CHANGELOG.md
      template-path: .github/release-drafter-template.yml
      target-key: reusable-workflows
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

  draft-summary:
    name: Release draft summary
    needs: draft
    if: ${{ always() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Release draft content
        env:
          RELEASE_BODY: ${{ needs.draft.outputs.release-body }}
          RELEASE_VERSION: ${{ needs.draft.outputs.version }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
          RELEASE_URL: ${{ needs.draft.outputs.release-url }}
          DRAFT_ACTION: ${{ needs.draft.outputs.draft-action }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# GitHub Release Draft"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Version | `%s` |\n' "${RELEASE_VERSION:-unresolved}"
            printf '| Tag | `%s` |\n' "${RELEASE_TAG:-unresolved}"
            printf '| Result | **%s** |\n' "${DRAFT_ACTION:-unresolved}"
            printf '| Dry run | **%s** |\n' "$DRY_RUN"

            if [ -n "$RELEASE_URL" ]; then
              printf '| Draft | [Open draft](%s) |\n' "$RELEASE_URL"
            elif [ "$DRY_RUN" = "true" ]; then
              echo "| Draft | _preview only; no release mutated_ |"
            else
              echo "| Draft | unavailable |"
            fi

            echo
            echo "## Draft content"
            echo
            if [ -n "$RELEASE_BODY" ]; then
              printf '%s\n' "$RELEASE_BODY"
            else
              echo "> No reconciled draft content was returned."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
