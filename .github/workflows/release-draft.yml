name: Release Draft

run-name: >-
  Release draft · ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'changed' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Package selector (all, package name, ".", or any workspace directory)
        required: true
        default: all
        type: string
      draft-target:
        description: Repository release or an individual workspace package
        required: true
        default: repository
        type: choice
        options: [repository, package]
      package-name:
        description: Full npm package name (required for package drafts)
        required: false
        default: ""
        type: string
      package-directory:
        description: Workspace directory (required for package drafts, e.g. packages/foo)
        required: false
        default: ""
        type: string
      version-mode:
        description: Version mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - bump
          - package-json
          - exact
      version-bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      exact-version:
        description: Exact version when version-mode is exact
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview without creating or modifying release drafts
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  # This repository releases reusable workflows as a single product; its
  # playground workspace is private and has no independent release draft.
  # Reject unsupported selectors instead of silently drafting the root release.
  select-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository release target
        env:
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        shell: bash
        run: |
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.draft-target || 'repository' }}" == "package" ]]; then
            [[ -n "$PACKAGE_NAME" && "$PACKAGE_DIRECTORY" =~ ^(packages|apps)/[a-zA-Z0-9_./-]+$ && "$PACKAGE_DIRECTORY" != *..* ]] || {
              echo "::error::Package drafts require package-name and a valid package-directory."
              exit 1
            }
            node -e 'const p=require("./"+process.argv[1]+"/package.json");if(p.private || p.name!==process.argv[2])process.exit(1)' "$PACKAGE_DIRECTORY" "$PACKAGE_NAME" || {
              echo "::error::Selected package must exist, be public, and match package-name."
              exit 1
            }
          else
            case "$PACKAGE" in
              all|.|reusable-workflows-workspace) ;;
              *)
                echo "::error::Repository drafts accept all, ., or reusable-workflows-workspace; received: $PACKAGE"
                exit 1
                ;;
            esac
          fi

  draft:
    needs: select-target
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: read
    uses: $/.github/workflows/reusable_release-drafter.yml
    with:
      target-branch: ${{ github.ref_name }}
      initial-version: "0.1.0"
      version-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.version-mode || 'auto' }}
      version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version-bump || '' }}
      exact-version: ${{ github.event_name == 'workflow_dispatch' && inputs.exact-version || '' }}
      tag-prefix: ${{ inputs.draft-target == 'package' && format('{0}@', inputs.package-name) || 'v' }}
      package-name: ${{ inputs.draft-target == 'package' && inputs.package-name || '' }}
      package-directory: ${{ inputs.draft-target == 'package' && inputs.package-directory || '' }}
      release-name: ${{ inputs.draft-target == 'package' && format('{0} v{1}', inputs.package-name, '{{VERSION}}') || 'Reusable Workflows v{{VERSION}}' }}
      changelog-path: ${{ inputs.draft-target == 'package' && format('{0}/CHANGELOG.md', inputs.package-directory) || 'CHANGELOG.md' }}
      template-path: .github/release-drafter-template.yml
      target-key: ${{ inputs.draft-target == 'package' && inputs.package-name || 'reusable-workflows' }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == true }}
