name: "Reusable · Publish npm package"

on:
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show effective workflow inputs in the job summary
        required: false
        default: true
        type: boolean
      target-branch:
        description: Optional target branch; defaults to the selected workflow run ref
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview publishing without registry mutation
        required: true
        default: true
        type: boolean
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        default: "."
        type: string
      version-mode:
        description: Version mode
        required: true
        default: package-json
        type: choice
        options:
          - package-json
          - exact
      exact-version:
        description: Exact version when version-mode is exact
        required: false
        default: ""
        type: string
      registry:
        description: Package registry
        required: true
        default: github
        type: string
      registries-file:
        description: Optional caller repository registry YAML location
        type: string
        required: false
        default: ""
      registry-url:
        description: Optional URL override for one configured registry
        type: string
        required: false
        default: ""
      tag:
        description: Distribution tag; leave empty to use the suggested tag.
        required: false
        default: ""
        type: string
      verify-git-tag:
        description: Verify matching package release Git tag before publishing
        required: true
        default: true
        type: boolean
      workspace-tools-source:
        description: Workspace Tools source — published package or current caller checkout
        required: true
        default: registry:npm:0.2.0
        type: string
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      show-input-summary:
        description: Report effective reusable workflow inputs; enable when the caller does not report them
        required: false
        default: false
        type: boolean
      target-branch:
        description: Branch containing the package version to publish
        required: false
        default: main
        type: string
      dry-run:
        description: Preview publishing without registry mutation
        required: false
        default: true
        type: boolean
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        type: string
      version-mode:
        description: package-json or exact
        required: false
        default: package-json
        type: string
      exact-version:
        description: Exact version when version-mode is exact
        required: false
        default: ""
        type: string
      registry:
        description: github, npm, or all
        required: false
        default: github
        type: string
      registries-file:
        description: Optional caller repository registry YAML location
        type: string
        required: false
        default: ""
      registry-url:
        description: Optional URL override for one configured registry
        type: string
        required: false
        default: ""
      tag:
        description: npm distribution tag; leave empty to use the suggested tag.
        required: false
        default: ""
        type: string
      verify-git-tag:
        description: Verify matching package release Git tag before publishing
        required: false
        default: true
        type: boolean
      workspace-tools-source:
        description: Workspace Tools source — published package or current caller checkout
        required: false
        default: registry:npm:0.2.0
        type: string
      node-version:
        required: false
        default: "24"
        type: string
    outputs:
      package-name:
        description: Resolved package name
        value: ${{ jobs.publish-package.outputs.package-name }}
      package-version:
        description: Resolved package version
        value: ${{ jobs.publish-package.outputs.package-version }}
      publish-status:
        description: Publish result status
        value: ${{ jobs.publish-package.outputs.publish-status }}
      can-publish:
        description: Whether publish readiness checks passed
        value: ${{ jobs.publish-package.outputs.can-publish }}
      result-json:
        description: Complete workspace-publish JSON result
        value: ${{ jobs.publish-package.outputs.result-json }}
    secrets:
      npm-token:
        required: false
      custom-registry-token:
        required: false
      registry-tokens-json:
        required: false

permissions: {}

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_dispatch-input-summary.yml
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "npm publish · Reusable workflow inputs"

  publish-package:
    name: "job: Publish"
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.plan.outputs.name }}
      package-version: ${{ steps.plan.outputs.version }}
      publish-status: ${{ steps.publish.outputs.status }}
      can-publish: ${{ steps.preflight.outputs.can-publish }}
      result-json: ${{ steps.publish.outputs.result-json }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ inputs.target-branch || github.ref_name }}
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Reusable · Publish npm package"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Workflow | \`Reusable · Publish npm package\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Ensure staged publishing CLI support
        run: npm install --global npm@">=11.15.0 <12"
      - name: Validate release package
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PACKAGE_SELECTOR" = "." ]; then
            MANIFEST=package.json
          elif [ -f "$PACKAGE_SELECTOR/package.json" ]; then
            MANIFEST="$PACKAGE_SELECTOR/package.json"
          else
            MANIFEST="$(find . -name package.json -not -path '*/node_modules/*' -print0 | xargs -0 -r jq -r --arg name "$PACKAGE_SELECTOR" 'select(.name == $name) | input_filename' | head -n 1)"
          fi
          if [ -z "${MANIFEST:-}" ] || [ ! -f "$MANIFEST" ]; then
            echo "::error::Package selector '$PACKAGE_SELECTOR' does not resolve to a package.json."
            exit 1
          fi
          if [ "$(jq -r '.private // false' "$MANIFEST")" = true ]; then
            echo "::error::Cannot release or publish private package '$PACKAGE_SELECTOR' ($MANIFEST). Select a publishable package."
            exit 1
          fi

      - name: Checkout shared registry defaults
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/reusable-registry-config
          persist-credentials: false
          sparse-checkout: config/package-registries.yml
          sparse-checkout-cone-mode: false

      - name: Resolve registry configuration
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.registries-file }}
          SELECTION: ${{ inputs.registry }}
          URL_OVERRIDE: ${{ inputs.registry-url }}
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -ruri <<'RUBY'
          fallback = '.github/reusable-registry-config/config/package-registries.yml'
          requested = ENV.fetch('CONFIG_FILE', '').strip
          defaults = YAML.safe_load_file(fallback).fetch('registries')
          abort 'Default registries must be a mapping' unless defaults.is_a?(Hash)
          overrides = !requested.empty? && File.file?(requested) ? YAML.safe_load_file(requested).fetch('registries', {}) : {}
          abort 'Caller registries must be a mapping' unless overrides.is_a?(Hash)
          aliases = defaults.merge(overrides) do |name, base, override|
            abort "Invalid registry entry: #{name}" unless base.is_a?(Hash) && override.is_a?(Hash)
            base.merge(override)
          end
          aliases.each do |name, entry|
            abort "Invalid registry: #{name}" unless entry.is_a?(Hash)
            abort "Invalid registry name: #{name}" unless name.to_s.match?(/^[a-zA-Z][a-zA-Z0-9_-]*$/) && name != 'all'
          end
          selection = ENV.fetch('SELECTION')
          url_override = ENV.fetch('URL_OVERRIDE', '')
          selected = selection == 'all' ? aliases.select { |_, entry| entry['enabled'] != false } : aliases.select { |name, _| name == selection }
          abort "Unknown registry selection: #{selection}" if selected.empty?
          abort 'URL override requires a single registry' unless url_override.empty? || selected.size == 1
          targets = selected.map do |name, entry|
            abort "Disabled registry: #{name}" if entry['enabled'] == false
            url = url_override.empty? ? entry.fetch('url', '').to_s : url_override
            uri = URI.parse(url)
            abort "Invalid HTTPS registry URL for #{name}" unless uri.is_a?(URI::HTTPS) && uri.host && uri.userinfo.nil? && uri.query.nil? && uri.fragment.nil?
            abort "Invalid publish mode for #{name}" unless %w[staged direct].include?(entry.fetch('publish-mode', 'direct'))
            backend = entry.fetch('backend', 'custom')
            abort "Invalid backend for #{name}" unless backend.is_a?(String) && backend.match?(/^[a-z][a-z0-9_-]*$/)
            {'alias' => name, 'registry' => backend, 'url' => url, 'publishGithubRelease' => entry.fetch('publish-github-release', false), 'query' => entry.fetch('query', {}), 'tokenSecret' => entry.fetch('token-secret', ''), 'tokenSource' => entry.fetch('token-source', 'custom-registry-token')}
          end
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |file|
            file.puts "REGISTRIES_JSON=#{JSON.generate(targets)}"
            file.puts "EFFECTIVE_REGISTRY=#{targets.size == 1 ? targets.first['registry'] : 'all'}"
            file.puts "EFFECTIVE_REGISTRY_URL=#{targets.size == 1 ? targets.first['url'] : ''}"
            file.puts "PUBLISH_GITHUB_RELEASE=#{targets.any? { |target| target['publishGithubRelease'] }}"
          end
          puts "Registry config: #{!requested.empty? && File.file?(requested) ? requested : fallback}; selected: #{targets.map { |target| target['alias'] }.join(', ')}"
          RUBY

      - name: Install workspace dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=optional

      - name: Checkout version-matched reusable workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/reusable-workflows-runtime
          persist-credentials: false
          sparse-checkout: actions
          sparse-checkout-cone-mode: false
      - name: Resolve workspace tools CLI
        id: workspace-tools
        uses: ./.github/reusable-workflows-runtime/actions/setup-workspace-tools
        with:
          source: ${{ inputs.workspace-tools-source }}

      - name: Export workspace tools CLI path
        shell: bash
        run: echo "WORKSPACE_TOOLS_BIN=${{ steps.workspace-tools.outputs.bin-dir }}" >> "$GITHUB_ENV"

      - name: Resolve publish plan
        id: plan
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          CUSTOM_REGISTRY_URL: ${{ env.EFFECTIVE_REGISTRY_URL }}
          _CUSTOM_REGISTRY_TOKEN: ${{ secrets.custom-registry-token }}
          VERSION_MODE: ${{ inputs.version-mode }}
          EXACT_VERSION: ${{ inputs.exact-version }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          case "$VERSION_MODE" in
            package-json|exact)
              ;;
            *)
              echo "::error::Version mode must be package-json or exact."
              exit 1
              ;;
          esac

          if [ "$VERSION_MODE" = "exact" ] && [ -z "$EXACT_VERSION" ]; then
            echo "::error::Exact version is required when version-mode is exact."
            exit 1
          fi

          REQUESTED_VERSION=""
          if [ "$VERSION_MODE" = "exact" ]; then
            REQUESTED_VERSION="$EXACT_VERSION"
          fi

          PLAN_REGISTRY="$EFFECTIVE_REGISTRY"
          if [ "$PLAN_REGISTRY" = all ]; then PLAN_REGISTRY="$(jq -r '.[0].registry' <<< "$REGISTRIES_JSON")"; fi
          PLAN_URL="$CUSTOM_REGISTRY_URL"
          if [ "$PLAN_REGISTRY" = custom ]; then PLAN_URL="$(jq -r '.[0].url' <<< "$REGISTRIES_JSON")"; fi
          PLAN_ARGS=(
            "--package=$PACKAGE_SELECTOR"
            --registry="$PLAN_REGISTRY"
            --list
            --json
          )

          if [ "$PLAN_REGISTRY" = custom ]; then PLAN_ARGS+=(--registry-url="$PLAN_URL"); fi
          if [ -n "${{ inputs.tag }}" ]; then
            PLAN_ARGS+=(--tag="${{ inputs.tag }}")
          fi

          PLAN_ROOT="$GITHUB_WORKSPACE"
          PLAN_WORKTREE=""

          if [ -n "$REQUESTED_VERSION" ]; then
            if [ "$PACKAGE_SELECTOR" = "." ]; then
              MANIFEST="package.json"
            elif [ -f "$PACKAGE_SELECTOR/package.json" ]; then
              MANIFEST="${PACKAGE_SELECTOR%/}/package.json"
            else
              MANIFEST="$(
                find . -name package.json -not -path './node_modules/*' -print0 |
                  xargs -0 -r jq -r --arg selector "$PACKAGE_SELECTOR" '
                    select(.name == $selector) | input_filename
                  ' |
                  head -n 1
              )"
              MANIFEST="${MANIFEST#./}"
            fi

            if [ -z "${MANIFEST:-}" ] || [ ! -f "$MANIFEST" ]; then
              echo "::error::Unable to resolve package selector: $PACKAGE_SELECTOR"
              exit 1
            fi

            PACKAGE_NAME="$(jq -r '.name // empty' "$MANIFEST")"
            PACKAGE_DIRECTORY="${MANIFEST%/package.json}"

            if [ "$PACKAGE_DIRECTORY" = "$MANIFEST" ]; then
              PACKAGE_DIRECTORY="."
            fi

            if [ "$PACKAGE_DIRECTORY" = "." ]; then
              REQUESTED_RELEASE_TAG="$PACKAGE_NAME@$REQUESTED_VERSION"
            else
              REQUESTED_RELEASE_TAG="$PACKAGE_DIRECTORY@$REQUESTED_VERSION"
            fi

            RELEASE_COMMIT="$(git rev-list -n 1 "$REQUESTED_RELEASE_TAG" 2>/dev/null || true)"
            if [ -z "$RELEASE_COMMIT" ]; then
              if [ "${{ inputs.dry-run }}" != "true" ]; then
                echo "::error::Requested release tag does not exist: $REQUESTED_RELEASE_TAG"
                exit 1
              fi
              echo "::notice::Release tag $REQUESTED_RELEASE_TAG is missing; using checked-out source for the dry-run plan."
            fi

            if [ -n "$RELEASE_COMMIT" ]; then
              PLAN_WORKTREE="$RUNNER_TEMP/npm-publish-plan-source"
              rm -rf "$PLAN_WORKTREE"
              git worktree add --detach "$PLAN_WORKTREE" "$RELEASE_COMMIT"
              PLAN_ROOT="$PLAN_WORKTREE"
            fi
          fi

          cleanup_plan_worktree() {
            if [ -n "$PLAN_WORKTREE" ]; then
              git worktree remove --force "$PLAN_WORKTREE" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_plan_worktree EXIT

          PLAN="$(
            cd "$PLAN_ROOT"
            node "$WORKSPACE_TOOLS_BIN/workspace-publish.mjs" "${PLAN_ARGS[@]}"
          )"

          cleanup_plan_worktree
          trap - EXIT

          echo "$PLAN" | jq -e '
            type == "object" and
            (.packages | type == "array" and length >= 1) and
            (.packages[0].name | type == "string" and length > 0) and
            (.packages[0].version | type == "string" and length > 0) and
            (.packages[0].releaseIdentity.tagName | type == "string" and length > 0) and
            (.packages[0].releaseIdentity.releaseName | type == "string" and length > 0)
          ' >/dev/null

          PACKAGE_VERSION="$(jq -r '.packages[0].version' <<< "$PLAN")"
          REQUESTED_DIST_TAG="${{ inputs.tag }}"
          SUGGESTED_DIST_TAG="$(jq -r '.suggestedTag // .packages[0].suggestedTag // "latest"' <<< "$PLAN")"
          RESOLVED_DIST_TAG="${REQUESTED_DIST_TAG:-$SUGGESTED_DIST_TAG}"

          if [ -n "$RESOLVED_DIST_TAG" ] && ! [[ "$RESOLVED_DIST_TAG" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid npm distribution tag: $RESOLVED_DIST_TAG"
            exit 1
          fi

          if [ -z "$RESOLVED_DIST_TAG" ]; then
            echo "::error::Unable to resolve an npm distribution tag."
            exit 1
          fi

          {
            echo "name=$(jq -r '.packages[0].name' <<< "$PLAN")"
            echo "version=$PACKAGE_VERSION"
            echo "release-tag=$(jq -r '.packages[0].releaseIdentity.tagName' <<< "$PLAN")"
            echo "release-name=$(jq -r '.packages[0].releaseIdentity.releaseName' <<< "$PLAN")"
            RELEASE_TAG="$(jq -r '.packages[0].releaseIdentity.tagName' <<< "$PLAN")"
            RELEASE_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            echo "release-commit=$RELEASE_COMMIT"
            echo "distribution-tag=$RESOLVED_DIST_TAG"
            echo "suggested-distribution-tag=$SUGGESTED_DIST_TAG"
            echo "plan-json<<EOF"
            echo "$PLAN" | jq -c .
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check published versions across configured registries
        id: registry-status
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.plan.outputs.name }}
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
          REGISTRY_TOKENS_JSON: ${{ secrets.registry-tokens-json }}
          CUSTOM_REGISTRY_TOKEN: ${{ secrets.custom-registry-token }}
          NPM_TOKEN: ${{ secrets.npm-token }}
          GH_PACKAGE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const targets = JSON.parse(process.env.REGISTRIES_JSON);
          const tokens = process.env.REGISTRY_TOKENS_JSON ? JSON.parse(process.env.REGISTRY_TOKENS_JSON) : {};
          const packageName = process.env.PACKAGE_NAME;
          const version = process.env.PACKAGE_VERSION;
          const credentials = {
            'npm-token': process.env.NPM_TOKEN,
            'github-token': process.env.GH_PACKAGE_TOKEN,
            'custom-registry-token': process.env.CUSTOM_REGISTRY_TOKEN
          };
          const results = [];
          for (const target of targets) {
            const type = target.query?.type ?? 'npm';
            if (type !== 'npm') throw new Error('Unsupported registry query adapter: ' + type);
            const token = tokens[target.alias] ?? credentials[target.tokenSource];
            const url = new URL(target.url);
            const tmp = fs.mkdtempSync(require('node:os').tmpdir() + '/registry-query-');
            try {
              const npmrc = require('node:path').join(tmp, '.npmrc');
              if (token) fs.writeFileSync(npmrc, '//' + url.host + url.pathname.replace(/\/$/, '') + '/:_authToken=' + token + '\n', {mode: 0o600});
              const args = ['view', packageName + '@' + version, 'version', '--json', '--registry=' + target.url, '--userconfig=' + npmrc];
              let published = false, error = null;
              try {
                const output = execFileSync('npm', args, {encoding:'utf8', stdio:['ignore','pipe','pipe'], timeout:30000});
                published = JSON.parse(output.trim() || 'null') === version;
              } catch (e) {
                const details = String(e.stderr || e.message);
                if (!/E404|404 Not Found|is not in this registry/i.test(details)) error = details.split('\n').filter(Boolean).slice(0,2).join('; ');
              }
              results.push({alias:target.alias, url:target.url, published, error});
            } finally {
              fs.rmSync(tmp, {recursive:true, force:true});
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'result-json=' + JSON.stringify(results) + '\n');
          const summary = ['### Package registry publication status', '', '| Registry | Version | State |', '| --- | --- | --- |'];
          for (const item of results) summary.push('| ' + item.alias + ' | `' + version + '` | ' + (item.error ? 'query failed' : item.published ? 'published' : 'not published') + ' |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          if (results.some(item => item.error)) throw new Error('One or more registry publication checks failed');
          NODE

      - name: Validate requested version
        if: ${{ inputs.version-mode == 'exact' }}
        env:
          RESOLVED_VERSION: ${{ steps.plan.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.exact-version }}
        run: |
          if [ "$REQUESTED_VERSION" != "$RESOLVED_VERSION" ]; then
            echo "Exact publish version $REQUESTED_VERSION does not match canonical tag package version $RESOLVED_VERSION."
            exit 1
          fi
      - name: Verify matching GitHub Release
        id: release-state
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.plan.outputs.release-tag }}
          RELEASE_NAME: ${{ steps.plan.outputs.release-name }}
          DRY_RUN: ${{ inputs.dry-run }}
          REGISTRY_SELECTION: ${{ inputs.registry }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="$(
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '
                [.[][] | select(.tag_name == $tag)]
                | sort_by(.updated_at // .created_at)
                | last // empty
              '
          )"

          VALID=true
          REASON=""
          RELEASE_STATE="missing"

          if [ -z "$RELEASE" ]; then
            VALID=false
            REASON="No matching GitHub Release exists for $RELEASE_TAG."
            RELEASE_ID=""
            RELEASE_URL=""
            RELEASE_DRAFT=false
            RELEASE_IMMUTABLE=false
            ACTUAL_NAME=""
          else
            RELEASE_ID="$(jq -r '.id' <<< "$RELEASE")"
            RELEASE_URL="$(jq -r '.html_url' <<< "$RELEASE")"
            RELEASE_DRAFT="$(jq -r '.draft' <<< "$RELEASE")"
            RELEASE_IMMUTABLE="$(jq -r '.immutable // false' <<< "$RELEASE")"
            ACTUAL_NAME="$(jq -r '.name // ""' <<< "$RELEASE")"
            RELEASE_STATE="$([ "$RELEASE_DRAFT" = "true" ] && echo draft || echo published)"

            if [ "$ACTUAL_NAME" != "$RELEASE_NAME" ]; then
              VALID=false
              REASON="GitHub Release name does not match the canonical release identity."
            fi
          fi

          {
            echo "valid=$VALID"
            echo "id=$RELEASE_ID"
            echo "url=$RELEASE_URL"
            echo "draft=$RELEASE_DRAFT"
            echo "immutable=$RELEASE_IMMUTABLE"
            echo "state=$RELEASE_STATE"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## GitHub Release"
            echo
            echo "| Check | Value |"
            echo "| --- | --- |"
            printf '| Release tag | `%s` |\n' "$RELEASE_TAG"
            printf '| Release name | `%s` |\n' "$RELEASE_NAME"
            echo "| Release state | **$RELEASE_STATE** |"
            echo "| Immutable | **$RELEASE_IMMUTABLE** |"
            echo "| Matching release identity | **$VALID** |"
            printf '| Release URL | %s |\n' "${RELEASE_URL:-unavailable}"
            if [ -n "$REASON" ]; then
              printf '| Reason | %s |\n' "$REASON"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VALID" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::$REASON"
            echo "::error::This release-oriented publish workflow requires a matching GitHub Release identity."
            exit 1
          fi
      - name: Validate release identity marker
        if: ${{ steps.release-state.outputs.id != '' }}
        uses: ./.github/reusable-workflows-runtime/actions/validate-release-identity
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ steps.plan.outputs.release-tag }}
          version: ${{ steps.plan.outputs.version }}
          package-name: ${{ steps.plan.outputs.package-name }}
          required: "true"

      - name: Prepare package artifact directory
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/npm-package-artifacts"
          mkdir -p "$RUNNER_TEMP/npm-package-artifacts"

      - name: Resolve canonical package artifact
        id: canonical-artifact
        env:
          PACKAGE_NAME: ${{ steps.plan.outputs.name }}
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          RELEASE_COMMIT: ${{ steps.plan.outputs.release-commit }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIRECTORY="$RUNNER_TEMP/npm-package-artifacts"

          ARTIFACT_SOURCE="canonical-tag"
          if [ -z "$RELEASE_COMMIT" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::Cannot resolve the canonical Git tag commit for ${{ steps.plan.outputs.release-tag }}."
              exit 1
            fi
            RELEASE_COMMIT="$GITHUB_SHA"
            ARTIFACT_SOURCE="checkout-preview"
            echo "::notice::Release tag is missing; packaging the checked-out commit as a dry-run preview, not a canonical release artifact."
          fi

          WORKTREE="$RUNNER_TEMP/npm-release-source"
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "$RELEASE_COMMIT"

          cleanup() {
            git worktree remove --force "$WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          (
            cd "$WORKTREE"
            npm install --include=optional

            if [ "$PACKAGE_SELECTOR" = "." ]; then
              npm run typecheck --if-present
              npm run test --if-present
              npm run build --if-present
              npm pack --json --pack-destination "$ARTIFACT_DIRECTORY" > "$RUNNER_TEMP/release-pack.json"
            else
              # Build transitive local workspace dependencies before checking the selected
              # package. This runs against the canonical release worktree, not the caller checkout.
              PACKAGE_NAME="$PACKAGE_NAME" node <<'NODE' > "$RUNNER_TEMP/release-workspace-dependencies"
              const fs = require('node:fs');
              const path = require('node:path');
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              const workspaces = new Map();
              for (const [directory, entry] of Object.entries(lock.packages ?? {})) {
                if (!directory || directory.startsWith('node_modules/') || !entry.name) continue;
                const manifestPath = path.join(directory, 'package.json');
                if (!fs.existsSync(manifestPath)) continue;
                const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                if (manifest.name === entry.name) workspaces.set(entry.name, manifest);
              }
              const selected = process.env.PACKAGE_NAME;
              if (!workspaces.has(selected)) {
                console.error(`Selected workspace not found in lockfile: ${selected}`);
                process.exit(1);
              }
              const visiting = new Set();
              const visited = new Set();
              const ordered = [];
              function visit(name) {
                if (visited.has(name)) return;
                if (visiting.has(name)) throw new Error(`Workspace dependency cycle involving ${name}`);
                visiting.add(name);
                const manifest = workspaces.get(name);
                for (const dependency of Object.keys({
                  ...manifest.dependencies,
                  ...manifest.devDependencies,
                  ...manifest.optionalDependencies,
                  ...manifest.peerDependencies,
                }).sort()) {
                  if (workspaces.has(dependency)) visit(dependency);
                }
                visiting.delete(name);
                visited.add(name);
                if (name !== selected) ordered.push(name);
              }
              visit(selected);
              for (const name of ordered) process.stdout.write(name + '\n');
          NODE
              while IFS= read -r dependency; do
                echo "::group::Build workspace dependency $dependency"
                npm run build --workspace "$dependency" --if-present
                echo "::endgroup::"
              done < "$RUNNER_TEMP/release-workspace-dependencies"
              npm run typecheck --workspace "$PACKAGE_NAME" --if-present
              npm run test --workspace "$PACKAGE_NAME" --if-present
              npm run build --workspace "$PACKAGE_NAME" --if-present
              npm pack \
                --workspace "$PACKAGE_NAME" \
                --json \
                --pack-destination "$ARTIFACT_DIRECTORY" > "$RUNNER_TEMP/release-pack.json"
            fi
          )

          PACK_JSON="$(cat "$RUNNER_TEMP/release-pack.json")"
          ARTIFACT_PATH="$ARTIFACT_DIRECTORY/$(jq -r '.[0].filename' <<< "$PACK_JSON")"
          cleanup
          trap - EXIT

          if [ ! -f "$ARTIFACT_PATH" ]; then
            echo "::error::Package artifact was not created."
            exit 1
          fi

          {
            echo "source=$ARTIFACT_SOURCE"
            echo "path=$ARTIFACT_PATH"
            echo "filename=$(basename "$ARTIFACT_PATH")"
            echo "sha1=$(shasum -a 1 "$ARTIFACT_PATH" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## npm package artifact"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Source | **%s** |\n' "$ARTIFACT_SOURCE"
            printf '| Release tag | `%s` |\n' "${{ steps.plan.outputs.release-tag }}"
            printf '| Source commit | `%s` |\n' "$RELEASE_COMMIT"
            printf '| Artifact | `%s` |\n' "$(basename "$ARTIFACT_PATH")"
            printf '| SHA-1 | `%s` |\n' "$(shasum -a 1 "$ARTIFACT_PATH" | awk '{print $1}')"
            echo
            if [ "$ARTIFACT_SOURCE" = "checkout-preview" ]; then
              echo "> Dry-run preview only: no canonical Git tag exists. Actual publication requires the canonical tag and matching release."
            else
              echo "> Registry publication is authoritative from the canonical Git tag commit. Release assets are updated when the matching GitHub Release is mutable; immutable releases are left unchanged."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate packaged CLI entry points
        env:
          CANONICAL_ARTIFACT_PATH: ${{ steps.canonical-artifact.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CANONICAL_ARTIFACT_PATH" ] || [ ! -f "$CANONICAL_ARTIFACT_PATH" ]; then
            echo "::error::Canonical package artifact is unavailable for CLI validation."
            exit 1
          fi

          PACKAGE_JSON="$RUNNER_TEMP/packed-package.json"
          tar -xOf "$CANONICAL_ARTIFACT_PATH" package/package.json > "$PACKAGE_JSON"

          BIN_ENTRIES="$(
            jq -c '
              if (.bin | type) == "object" then
                .bin | to_entries
              elif (.bin | type) == "string" then
                [{key: .name, value: .bin}]
              else
                []
              end
            ' "$PACKAGE_JSON"
          )"

          if [ "$(jq 'length' <<< "$BIN_ENTRIES")" -eq 0 ]; then
            echo "Packed package declares no CLI bin entries; CLI validation is not required."

            {
              echo "## Packaged CLI validation"
              echo
              echo '_Skipped: the packed package does not declare any `package.json#bin` entries._'
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          EXTRACT_DIR="$RUNNER_TEMP/npm-package-contents"
          TEST_DIR="$RUNNER_TEMP/npm-package-consumer"
          rm -rf "$EXTRACT_DIR" "$TEST_DIR"
          mkdir -p "$EXTRACT_DIR" "$TEST_DIR"
          tar -xzf "$CANONICAL_ARTIFACT_PATH" -C "$EXTRACT_DIR"

          while IFS=$'\t' read -r BIN_NAME BIN_TARGET; do
            if [ ! -f "$EXTRACT_DIR/package/$BIN_TARGET" ]; then
              echo "::error::Packed CLI target is missing: $BIN_NAME -> $BIN_TARGET"
              exit 1
            fi
          done < <(jq -r '.[] | [.key, .value] | @tsv' <<< "$BIN_ENTRIES")

          (
            cd "$TEST_DIR"
            npm init --yes >/dev/null
            npm install \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              "$CANONICAL_ARTIFACT_PATH" >/dev/null

            while IFS=$'\t' read -r BIN_NAME BIN_TARGET; do
              BIN_PATH="$TEST_DIR/node_modules/.bin/$BIN_NAME"

              if [ ! -x "$BIN_PATH" ]; then
                echo "::error::npm did not create an executable CLI shim: $BIN_NAME"
                exit 1
              fi

              echo "Validated $BIN_NAME -> $BIN_TARGET"
            done < <(jq -r '.[] | [.key, .value] | @tsv' <<< "$BIN_ENTRIES")
          )

          {
            echo "## Packaged CLI validation"
            echo
            echo 'Installed the canonical `.tgz` into an isolated consumer project and verified every declared `bin` target and npm-created executable shim.'
            echo
            while IFS=$'\t' read -r BIN_NAME BIN_TARGET; do
              printf -- '- `%s` → `%s`\n' "$BIN_NAME" "$BIN_TARGET"
            done < <(jq -r '.[] | [.key, .value] | @tsv' <<< "$BIN_ENTRIES")
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach package assets to GitHub Release
        id: release-assets
        if: ${{ !inputs.dry-run && steps.release-state.outputs.valid == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.plan.outputs.release-tag }}
          PACKAGE_NAME: ${{ steps.plan.outputs.name }}
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
          CANONICAL_ARTIFACT_PATH: ${{ steps.canonical-artifact.outputs.path }}
          RELEASE_IMMUTABLE: ${{ steps.release-state.outputs.immutable }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RELEASE_IMMUTABLE" = "true" ]; then
            echo "status=skipped-immutable" >> "$GITHUB_OUTPUT"
            echo "GitHub Release is immutable; package assets cannot be added or replaced."
            echo "Registry publication will continue from the canonical Git tag commit."
            exit 0
          fi

          TARBALL="$CANONICAL_ARTIFACT_PATH"
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::Canonical npm artifact is unavailable for GitHub Release assets."
            exit 1
          fi

          SAFE_NAME="${PACKAGE_NAME#@}"
          SAFE_NAME="${SAFE_NAME//\//-}"
          ZIP_NAME="${SAFE_NAME}-${PACKAGE_VERSION}.zip"
          ZIP_PATH="$RUNNER_TEMP/npm-package-artifacts/$ZIP_NAME"
          EXTRACT_DIR="$RUNNER_TEMP/npm-release-package"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
          (
            cd "$EXTRACT_DIR/package"
            zip -qr "$ZIP_PATH" .
          )

          gh release upload "$RELEASE_TAG" "$TARBALL" "$ZIP_PATH" --clobber --repo "$GH_REPO"

          {
            echo "status=attached"
            echo "tarball=$(basename "$TARBALL")"
            echo "zip=$ZIP_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Publish package
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          VERIFY_GIT_TAG: ${{ inputs.verify-git-tag }}
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          _GITHUB_TOKEN: ${{ github.token }}
          _NPM_TOKEN: ${{ secrets.npm-token }}
          _CUSTOM_REGISTRY_TOKEN: ${{ secrets.custom-registry-token }}
          REGISTRY_TOKENS_JSON: ${{ secrets.registry-tokens-json }}
          CUSTOM_REGISTRY_URL: ${{ env.EFFECTIVE_REGISTRY_URL }}
          CANONICAL_ARTIFACT_PATH: ${{ steps.canonical-artifact.outputs.path }}
        run: |
          set -euo pipefail

          ARTIFACT_DIRECTORY="$RUNNER_TEMP/npm-package-artifacts"
          mkdir -p "$ARTIFACT_DIRECTORY"

          PUBLISH_ARGS=(
            "--package=$PACKAGE_SELECTOR"
            --registry="$EFFECTIVE_REGISTRY"
            --artifact-directory="$ARTIFACT_DIRECTORY"
            --json
          )

          if [ "$EFFECTIVE_REGISTRY" = custom ]; then PUBLISH_ARGS+=(--registry-url="$CUSTOM_REGISTRY_URL"); fi
          if [ -n "${{ steps.plan.outputs.distribution-tag }}" ]; then
            PUBLISH_ARGS+=(--tag="${{ steps.plan.outputs.distribution-tag }}")
          fi

          if [ -n "$CANONICAL_ARTIFACT_PATH" ]; then
            PUBLISH_ARGS+=(--artifact-file="$CANONICAL_ARTIFACT_PATH")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            PUBLISH_ARGS+=(--dry-run)
          fi

          if [ "$VERIFY_GIT_TAG" != "true" ]; then
            PUBLISH_ARGS+=(--no-verify-git-tag)
          fi

          RESULTS=()
          DEFAULT_CUSTOM_TOKEN="${_CUSTOM_REGISTRY_TOKEN:-}"
          while IFS= read -r target; do
            backend="$(jq -r '.registry' <<< "$target")"
            url="$(jq -r '.url' <<< "$target")"
            alias="$(jq -r '.alias' <<< "$target")"
            args=()
            for arg in "${PUBLISH_ARGS[@]}"; do
              case "$arg" in
                --registry=*) args+=("--registry=$backend") ;;
                --registry-url=*) ;;
                *) args+=("$arg") ;;
              esac
            done
            if [ "$backend" = custom ]; then args+=("--registry-url=$url"); fi
            echo "::group::Registry $alias"
            if [ "$backend" = custom ]; then
              export _CUSTOM_REGISTRY_TOKEN="$DEFAULT_CUSTOM_TOKEN"
              if [ -n "${REGISTRY_TOKENS_JSON:-}" ] && [ "$DRY_RUN" != "true" ]; then
                token="$(jq -er --arg alias "$alias" '.[$alias] // empty' <<< "$REGISTRY_TOKENS_JSON")" || {
                  echo "::error::Missing registry token for $alias in registry-tokens-json"
                  exit 1
                }
                export _CUSTOM_REGISTRY_TOKEN="$token"
              elif [ "$DRY_RUN" != "true" ] && [ -z "${_CUSTOM_REGISTRY_TOKEN:-}" ]; then
                echo "::error::Custom registry $alias requires registry-tokens-json or custom-registry-token"
                exit 1
              fi
            fi
            result="$(node "$WORKSPACE_TOOLS_BIN/workspace-publish.mjs" "${args[@]}")"
            unset token
            if [ "$backend" = custom ]; then unset _CUSTOM_REGISTRY_TOKEN; fi
            echo "$result" | jq .
            RESULTS+=("$(jq -c --arg alias "$alias" '. + {registryAlias:$alias}' <<< "$result")")
            echo "::endgroup::"
          done < <(jq -c '.[]' <<< "$REGISTRIES_JSON")
          RESULT="$(printf '%s\n' "${RESULTS[@]}" | jq -sc 'if length == 1 then .[0] else {operation:"publish",dryRun:.[0].dryRun,status:(if all(.[]; .status == "success") then "success" elif all(.[]; .status == "preview" or .status == "warning") then "preview" else "failed" end),canPublish:all(.[]; .canPublish != false),registries:.} end')"

          echo "$RESULT" | jq -e --argjson dryRun "$DRY_RUN" '
            type == "object" and
            .operation == "publish" and
            .dryRun == $dryRun and
            (
              if $dryRun
              then (.status == "preview" or .status == "warning")
              else .status == "success"
              end
            )
          ' >/dev/null

          {
            echo "status=$(jq -r '.status' <<< "$RESULT")"
            echo "can-publish=$(jq -r 'if has("canPublish") then .canPublish else true end' <<< "$RESULT")"
            echo "result-json<<EOF"
            echo "$RESULT" | jq -c .
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "$RESULT" | jq .

      - name: Publish GitHub Release draft for GitHub Packages
        id: github-release
        if: ${{ !inputs.dry-run && steps.publish.outcome == 'success' && env.PUBLISH_GITHUB_RELEASE == 'true' && steps.release-state.outputs.draft == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release-state.outputs.id }}
          RELEASE_TAG: ${{ steps.plan.outputs.release-tag }}
          RELEASE_NAME: ${{ steps.plan.outputs.release-name }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="$(
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
              -f tag_name="$RELEASE_TAG" \
              -f name="$RELEASE_NAME" \
              -F draft=false
          )"

          if [ "$(jq -r '.draft' <<< "$RELEASE")" != "false" ]; then
            echo "::error::GitHub Release remained in draft state."
            exit 1
          fi

          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Preserve existing GitHub Release state
        id: preserved-release-state
        if: ${{ !inputs.dry-run && steps.publish.outcome == 'success' && (env.PUBLISH_GITHUB_RELEASE != 'true' || steps.release-state.outputs.draft != 'true') }}
        env:
          RELEASE_STATE: ${{ steps.release-state.outputs.state }}
          RELEASE_IMMUTABLE: ${{ steps.release-state.outputs.immutable }}
        shell: bash
        run: |
          echo "status=$RELEASE_STATE" >> "$GITHUB_OUTPUT"
          echo "Registry publication completed; GitHub Release state remains $RELEASE_STATE."
      - name: Upload packed npm artifact
        id: packed-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ steps.plan.outputs.version || 'unresolved' }}
          path: ${{ runner.temp }}/npm-package-artifacts/*.tgz
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve publish preflight
        id: preflight
        if: ${{ always() }}
        env:
          CLI_CAN_PUBLISH: ${{ steps.publish.outputs.can-publish }}
          RELEASE_VALID: ${{ steps.release-state.outputs.valid }}
        shell: bash
        run: |
          set -euo pipefail
          CAN_PUBLISH="${CLI_CAN_PUBLISH:-false}"
          if [ "${RELEASE_VALID:-false}" != "true" ]; then
            CAN_PUBLISH=false
          fi
          echo "can-publish=$CAN_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        if: ${{ always() }}
        env:
          RESULT_JSON: ${{ steps.publish.outputs.result-json }}
          ARTIFACT_ID: ${{ steps.packed-artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.packed-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.packed-artifact.outputs.artifact-digest }}
          RELEASE_VALID: ${{ steps.release-state.outputs.valid }}
          RELEASE_STATE: ${{ steps.release-state.outputs.state }}
          RELEASE_IMMUTABLE: ${{ steps.release-state.outputs.immutable }}
          RELEASE_URL: ${{ steps.release-state.outputs.url }}
          RELEASE_REASON: ${{ steps.release-state.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail

          OVERALL_CAN_PUBLISH="${{ steps.preflight.outputs.can-publish || 'false' }}"

          {
            echo "## Package publish"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Dry run | **${{ inputs.dry-run }}** |"
            echo "| Package | \`${{ steps.plan.outputs.name || inputs.package-directory }}\` |"
            echo "| Package version | \`${{ steps.plan.outputs.version || 'unresolved' }}\` |"
            echo "| Package directory | \`${{ inputs.package-directory }}\` |"
            echo "| Requested version | \`${{ inputs.version || 'package version' }}\` |"
            echo "| Access | \`$(jq -r '.access // "unresolved"' <<< "$RESULT_JSON" 2>/dev/null || echo unresolved)\` |"
            echo "| Registry selection | \`${{ inputs.registry }}\` |"
            echo "| Distribution tag | \`${{ steps.plan.outputs.distribution-tag || '(preview suggestion only)' }}\` |"
            echo "| Suggested distribution tag | \`${{ steps.plan.outputs.suggested-distribution-tag || 'unresolved' }}\` |"
            echo "| Verify Git release tag | **${{ inputs.verify-git-tag }}** |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Publish status | \`${{ steps.publish.outputs.status || 'unresolved' }}\` |"
            echo "| Can publish | **$OVERALL_CAN_PUBLISH** |"
            echo "| Result | **${{ job.status }}** |"
            echo

            echo "### Registry readiness"
            echo
            echo "| Registry | Current version | Action |"
            echo "| --- | --- | --- |"

            if [ -n "$RESULT_JSON" ]; then
              jq -r '
                .packages[0].registries // {} |
                to_entries[] |
                "| \(.key) | **\(.value)** | \(if .value == "missing" then "publish" else "skip" end) |"
              ' <<< "$RESULT_JSON"
            else
              echo "| unresolved | unresolved | unresolved |"
            fi

            echo
            echo "### Release preflight"
            echo
            echo "| Check | Value |"
            echo "| --- | --- |"
            echo "| Release tag | \`${{ steps.plan.outputs.release-tag || 'unresolved' }}\` |"

            if [ -n "$RESULT_JSON" ]; then
              PACKAGE_NAME="${{ steps.plan.outputs.name }}"
              TAG_EXISTS="$(jq -r --arg name "$PACKAGE_NAME" '.gitTags[$name].exists // false' <<< "$RESULT_JSON")"
              TAG_AT_HEAD="$(jq -r --arg name "$PACKAGE_NAME" '.gitTags[$name].atHead // false' <<< "$RESULT_JSON")"
              TAG_COMMIT="$(jq -r --arg name "$PACKAGE_NAME" '.gitTags[$name].commit // "none"' <<< "$RESULT_JSON")"
              CLI_REASON="$(jq -r '.reason // "none"' <<< "$RESULT_JSON")"

              echo "| Git tag exists | **$TAG_EXISTS** |"
              echo "| Git tag points to HEAD | **$TAG_AT_HEAD** |"
              echo "| Git tag commit | \`$TAG_COMMIT\` |"
              echo "| CLI readiness reason | $CLI_REASON |"
            else
              echo "| Git tag exists | **unresolved** |"
              echo "| Git tag points to HEAD | **unresolved** |"
              echo "| Git tag commit | \`unresolved\` |"
              echo "| CLI readiness reason | unresolved |"
            fi

            echo "| GitHub Release state | **${RELEASE_STATE:-missing}** |"
            echo "| GitHub Release identity valid | **${RELEASE_VALID:-false}** |"
            echo "| GitHub Release immutable | **${RELEASE_IMMUTABLE:-false}** |"
            if [ -n "$RELEASE_URL" ]; then
              echo "| GitHub Release | [Open release]($RELEASE_URL) |"
            else
              echo "| GitHub Release | unavailable |"
            fi
            if [ -n "$RELEASE_REASON" ]; then
              echo "| GitHub Release reason | $RELEASE_REASON |"
            fi
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "| GitHub Release after workflow | **unchanged (dry run)** |"
            elif [ "${RELEASE_STATE:-missing}" = "draft" ] &&
                 [ "$PUBLISH_GITHUB_RELEASE" = "true" ]; then
              echo "| GitHub Release after workflow | **published** |"
            else
              echo "| GitHub Release after workflow | **${RELEASE_STATE:-missing}, unchanged** |"
            fi
            echo

            echo "### Packed package"
            echo
            echo "| Artifact | Value |"
            echo "| --- | --- |"

            if [ -n "$RESULT_JSON" ] && [ "$(jq '.artifacts | length' <<< "$RESULT_JSON")" -gt 0 ]; then
              echo "| Tarball | \`$(jq -r '.artifacts[0].filename' <<< "$RESULT_JSON")\` |"
              echo "| Package | \`$(jq -r '.artifacts[0].name' <<< "$RESULT_JSON")\` |"
              echo "| Version | \`$(jq -r '.artifacts[0].version' <<< "$RESULT_JSON")\` |"
              echo "| Size | \`$(jq -r '.artifacts[0].size // "unknown"' <<< "$RESULT_JSON") bytes\` |"
              echo "| npm shasum | \`$(jq -r '.artifacts[0].shasum // "unknown"' <<< "$RESULT_JSON")\` |"
              echo "| npm integrity | \`$(jq -r '.artifacts[0].integrity // "unknown"' <<< "$RESULT_JSON")\` |"
            else
              echo "| Tarball | none |"
            fi

            echo "| Workflow artifact | \`npm-package-${{ steps.plan.outputs.version || 'unresolved' }}\` |"
            echo "| Workflow artifact ID | \`${ARTIFACT_ID:-none}\` |"
            echo "| Workflow artifact digest | \`${ARTIFACT_DIGEST:-none}\` |"
            echo "| GitHub Release npm asset | \`${{ steps.release-assets.outputs.tarball || (inputs.dry-run && 'preview only' || 'none') }}\` |"
            echo "| GitHub Release ZIP asset | \`${{ steps.release-assets.outputs.zip || (inputs.dry-run && 'preview only' || 'none') }}\` |"

            if [ -n "$ARTIFACT_URL" ]; then
              echo "| Workflow artifact download | [Open artifact](${ARTIFACT_URL}) |"
            else
              echo "| Workflow artifact download | unavailable |"
            fi

            echo
            echo "### CHANGELOG.md"
            echo

            CHANGELOG_VERSION="${{ steps.plan.outputs.version }}"
            PACKAGE_DIRECTORY="${{ inputs.package-directory }}"
            CHANGELOG_PATH="$PACKAGE_DIRECTORY/CHANGELOG.md"
            if [ "$PACKAGE_DIRECTORY" = "." ]; then
              CHANGELOG_PATH="CHANGELOG.md"
            fi

            if [ -z "$CHANGELOG_VERSION" ]; then
              echo '> Package version was unresolved; cannot select changelog entries.'
            elif [ ! -f "$CHANGELOG_PATH" ]; then
              printf '> No changelog found at `%s`.\n' "$CHANGELOG_PATH"
            else
              CHANGELOG_SECTION="$(
                awk -v version="$CHANGELOG_VERSION" '
                  /^##[[:space:]]/ {
                    heading = $0
                    sub(/^##[[:space:]]+/, "", heading)
                    sub(/^\[/, "", heading)
                    sub(/\].*$/, "", heading)
                    sub(/^v/, "", heading)
                    sub(/[[:space:]].*$/, "", heading)
                    if (in_section) exit
                    if (heading == version) in_section = 1
                  }
                  in_section { print }
                ' "$CHANGELOG_PATH"
              )"

              if [ -n "$CHANGELOG_SECTION" ]; then
                printf '%s\n' "$CHANGELOG_SECTION"
              else
                printf '> No matching entry for version `%s` in `%s`.\n' "$CHANGELOG_VERSION" "$CHANGELOG_PATH"
              fi
            fi

            echo
          } >> "$GITHUB_STEP_SUMMARY"
