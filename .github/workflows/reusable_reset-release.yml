name: "Reusable · Reset Release"

run-name: >-
  Reset release · ${{ inputs.package }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_call:
    inputs:
      package:
        description: Package selector
        required: false
        default: "."
        type: string
      draft-template-path:
        description: Template path; falls back to the reusable workflow's template when absent in the caller
        required: false
        default: .github/release-drafter-template.yml
        type: string
      target-branch:
        description: Release target branch
        required: false
        default: main
        type: string
      match-mode:
        description: Find release by package version or exact tag
        required: false
        default: package-json
        type: string
      exact-tag:
        description: Existing canonical release tag when match-mode is exact
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview the reset without mutating the release or tag
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: reset-release-${{ github.repository }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  dispatch-input-summary:
    name: "job: Workflow parameters"
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_dispatch-input-summary.yml
    with:
      parameters-json: ${{ toJSON(inputs) }}
      heading: "Reset release · Workflow inputs"

  preflight:
    name: "job: API-only before-state audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      canonical-tag: ${{ steps.snapshot.outputs.canonical-tag }}
    steps:
      - name: Capture package release state without checkout
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTOR: ${{ inputs.package }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="repos/$GITHUB_REPOSITORY"
          MANIFEST_PATH=""
          if [ "$SELECTOR" = "." ]; then
            MANIFEST_PATH=package.json
          elif [[ "$SELECTOR" == */* ]] || [[ "$SELECTOR" == packages/* ]]; then
            MANIFEST_PATH="${SELECTOR%/}/package.json"
          fi
          if [ -z "$MANIFEST_PATH" ]; then
            TREE="$(gh api "$REPO/git/trees/$TARGET_BRANCH?recursive=1")"
            mapfile -t FILES < <(jq -r '.tree[] | select(.type == "blob" and (.path | endswith("/package.json") or . == "package.json")) | .path' <<< "$TREE")
            MATCHES=()
            for path in "${FILES[@]}"; do
              CONTENT="$(gh api "$REPO/contents/$path?ref=$TARGET_BRANCH" --jq '.content' | base64 -d)"
              if [ "$(jq -r '.name // ""' <<< "$CONTENT")" = "$SELECTOR" ]; then
                MATCHES+=("$path")
              fi
            done
            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one matching manifest for $SELECTOR, found ${#MATCHES[@]}."
              exit 1
            fi
            MANIFEST_PATH="${MATCHES[0]}"
          fi
          MANIFEST="$(gh api "$REPO/contents/$MANIFEST_PATH?ref=$TARGET_BRANCH" --jq '.content' | base64 -d)"
          VERSION="$(jq -er '.version' <<< "$MANIFEST")"
          PACKAGE_NAME="$(jq -er '.name' <<< "$MANIFEST")"
          DIRECTORY="${MANIFEST_PATH%/package.json}"
          if [ "$MANIFEST_PATH" = package.json ]; then
            TAG="$PACKAGE_NAME@$VERSION"
          else
            TAG="$DIRECTORY@$VERSION"
          fi
          RELEASES="$(gh api --paginate --slurp "$REPO/releases?per_page=100")"
          RELEASE="$(jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | first // empty' <<< "$RELEASES")"
          TAG_STATE=absent
          TAG_SHA=""
          RESPONSE="$(mktemp)"
          if gh api "$REPO/git/ref/tags/$TAG" > "$RESPONSE" 2>"$RESPONSE.err"; then
            TAG_STATE=present
            TAG_SHA="$(jq -r '.object.sha' < "$RESPONSE")"
          elif grep -q 'HTTP 404' "$RESPONSE.err"; then
            TAG_STATE=absent
          else
            echo "::error::Cannot verify existing tag $TAG; state is unknown."
            cat "$RESPONSE.err" >&2
            exit 1
          fi
          if [ -n "$RELEASE" ]; then
            jq -n --arg tag "$TAG" --arg sha "$TAG_SHA" --arg tagState "$TAG_STATE" --argjson release "$RELEASE" '{tag:$tag,tag_state:$tagState,tag_sha:$sha,release:{id:$release.id,name:$release.name,draft:$release.draft,immutable:$release.immutable,prerelease:$release.prerelease,updated_at:$release.updated_at}}' > before.json
          else
            jq -n --arg tag "$TAG" --arg sha "$TAG_SHA" --arg tagState "$TAG_STATE" '{tag:$tag,tag_state:$tagState,tag_sha:$sha,release:null}' > before.json
          fi
          echo "canonical-tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## Before recovery (GitHub API)"
            echo
            echo '~~~json'
            jq '.' before.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist original state
        uses: actions/upload-artifact@v4
        with:
          name: reset-before-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.package }}
          path: before.json
          retention-days: 30
          if-no-files-found: error

  resolve:
    needs: [dispatch-input-summary, preflight]
    name: "job: Resolve reset target"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      blocked: ${{ steps.package.outputs.blocked }}
      package-name: ${{ steps.package.outputs.name }}
      package-version: ${{ steps.package.outputs.package-version }}
      package-directory: ${{ steps.package.outputs.directory }}
      release-tag: ${{ steps.package.outputs.tag }}
      release-name: ${{ steps.package.outputs.release-name }}
      release-query: ${{ steps.package.outputs.release-query }}
      changelog-path: ${{ steps.package.outputs.changelog }}
      tag-prefix: ${{ steps.package.outputs.tag-prefix }}
      reset-commit: ${{ steps.package.outputs.reset-commit }}
      previous-tag-commit: ${{ steps.package.outputs.previous-tag-commit }}
      backup-release-id: ${{ steps.package.outputs.backup-release-id }}
      backup-body-base64: ${{ steps.package.outputs.backup-body-base64 }}
      backup-updated-at: ${{ steps.package.outputs.backup-updated-at }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve package identity
        id: package
        env:
          PACKAGE_SELECTOR: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
          MATCH_MODE: ${{ inputs.match-mode }}
          EXACT_TAG: ${{ inputs.exact-tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PACKAGE_SELECTOR" = "." ]; then
            PACKAGE_DIRECTORY="."
            MANIFEST="package.json"
          elif [ -f "$PACKAGE_SELECTOR/package.json" ]; then
            PACKAGE_DIRECTORY="${PACKAGE_SELECTOR%/}"
            MANIFEST="$PACKAGE_DIRECTORY/package.json"
          else
            MANIFEST="$(
              find . -name package.json -not -path './node_modules/*' -print0 |
                xargs -0 -r jq -r --arg selector "$PACKAGE_SELECTOR" '
                  select(.name == $selector) | input_filename
                ' |
                head -n 1
            )"

            if [ -z "$MANIFEST" ]; then
              echo "::error::Unable to resolve package selector: $PACKAGE_SELECTOR"
              exit 1
            fi

            MANIFEST="${MANIFEST#./}"
            PACKAGE_DIRECTORY="${MANIFEST%/package.json}"
          fi

          PACKAGE_NAME="$(jq -r '.name // empty' "$MANIFEST")"
          PACKAGE_VERSION="$(jq -r '.version // empty' "$MANIFEST")"
          PACKAGE_REGISTRY="$(jq -r '.publishConfig.registry // "https://registry.npmjs.org"' "$MANIFEST")"

          # Reset must account for every registry supported by Publish, not only
          # publishConfig.registry. A version published to either registry is immutable.
          PUBLISH_REGISTRIES=(
            "https://registry.npmjs.org"
            "https://npm.pkg.github.com"
          )

          if [ -z "$PACKAGE_NAME" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "::error::Package name/version is missing from $MANIFEST."
            exit 1
          fi

          if [ "$PACKAGE_DIRECTORY" = "." ]; then
            CHANGELOG_PATH="CHANGELOG.md"
            TAG_PREFIX="$PACKAGE_NAME@"
          else
            CHANGELOG_PATH="$PACKAGE_DIRECTORY/CHANGELOG.md"
            TAG_PREFIX="$PACKAGE_DIRECTORY@"
          fi

          RELEASE_TAG="$TAG_PREFIX$PACKAGE_VERSION"
          RELEASE_NAME="$PACKAGE_NAME v$PACKAGE_VERSION"
          RESET_COMMIT="$(git rev-parse HEAD)"
          PREVIOUS_TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"

          PUBLISHED_REGISTRIES=()
          NPM_REGISTRY_STATE="missing"
          GITHUB_REGISTRY_STATE="missing"

          for REGISTRY in "${PUBLISH_REGISTRIES[@]}"; do
            REGISTRY_HOST="$(node -e 'console.log(new URL(process.argv[1]).host)' "$REGISTRY")"
            NPMRC="$RUNNER_TEMP/reset-release-${REGISTRY_HOST}.npmrc"
            {
              printf 'registry=%s\n' "$REGISTRY"
              if [ "$REGISTRY_HOST" = "npm.pkg.github.com" ]; then
                printf '//%s/:_authToken=%s\n' "$REGISTRY_HOST" "$GH_TOKEN"
              fi
            } > "$NPMRC"

            REGISTRY_OUTPUT="$(
              NPM_CONFIG_USERCONFIG="$NPMRC" npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry "$REGISTRY" 2>&1
            )" && REGISTRY_STATUS=published || REGISTRY_STATUS=missing

            case "$REGISTRY_HOST" in
              registry.npmjs.org)
                NPM_REGISTRY_STATE="$REGISTRY_STATUS"
                ;;
              npm.pkg.github.com)
                GITHUB_REGISTRY_STATE="$REGISTRY_STATUS"
                ;;
            esac

            if [ "$REGISTRY_STATUS" = "published" ]; then
              PUBLISHED_REGISTRIES+=("$REGISTRY")
              continue
            fi

            if ! grep -Eq 'E404|404 Not Found|No match found|is not in this registry' <<< "$REGISTRY_OUTPUT"; then
              echo "::error::Unable to establish registry state for $PACKAGE_NAME@$PACKAGE_VERSION at $REGISTRY."
              printf '%s\n' "$REGISTRY_OUTPUT"
              exit 1
            fi
          done

          {
            echo "# Registry publication state"
            echo
            echo "| Registry | State | Reset action |"
            echo "| --- | --- | --- |"
            printf '| npmjs.org | **%s** | %s |\n' "$NPM_REGISTRY_STATE" "$([ "$NPM_REGISTRY_STATE" = "published" ] && echo "block" || echo "eligible")"
            printf '| GitHub Packages | **%s** | %s |\n' "$GITHUB_REGISTRY_STATE" "$([ "$GITHUB_REGISTRY_STATE" = "published" ] && echo "block" || echo "eligible")"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#PUBLISHED_REGISTRIES[@]}" -gt 0 ] && [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Reset preview blocked"
              echo
              echo "This package version is already published. Reset is prohibited."
              echo "No release, Git tag, or registry state was changed."
              echo "Restore can repair a published version only from its original source."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${#PUBLISHED_REGISTRIES[@]}" -gt 0 ]; then
            echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION is already published to one or more supported registries:"
            printf '::error::%s\n' "${PUBLISHED_REGISTRIES[@]}"
            echo "::error::Reset cannot unpublish a version already distributed through a package registry."
            echo "::error::Publish a newer version instead."
            exit 1
          fi

          echo "blocked=false" >> "$GITHUB_OUTPUT"

          BACKUP_RELEASE="$(
            gh api --paginate --slurp "repos/${{ github.repository }}/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '
                [.[][] | select(.tag_name == $tag)]
                | sort_by(.updated_at // .created_at)
                | last // empty
              '
          )"

          BACKUP_RELEASE_ID=""
          BACKUP_BODY_BASE64=""
          BACKUP_UPDATED_AT=""

          if [ -n "$BACKUP_RELEASE" ]; then
            BACKUP_RELEASE_ID="$(jq -r '.id' <<< "$BACKUP_RELEASE")"
            BACKUP_UPDATED_AT="$(jq -r '.updated_at // .created_at // ""' <<< "$BACKUP_RELEASE")"
            BACKUP_BODY_BASE64="$(jq -r '.body // ""' <<< "$BACKUP_RELEASE" | base64 -w 0)"

            if [ "$(jq -r '.immutable // false' <<< "$BACKUP_RELEASE")" = "true" ]; then
              echo "::error::$RELEASE_TAG is immutable; Reset cannot unpublish it."
              exit 1
            fi
          fi

          case "$MATCH_MODE" in
            package-json)
              RELEASE_QUERY="$PACKAGE_VERSION"
              ;;
            exact)
              if [ -z "$EXACT_TAG" ]; then
                echo "::error::exact-tag is required when match-mode is exact."
                exit 1
              fi
              if [ "$EXACT_TAG" != "$RELEASE_TAG" ]; then
                echo "::error::Exact tag must match the package canonical tag: $RELEASE_TAG"
                exit 1
              fi
              RELEASE_QUERY="$EXACT_TAG"
              ;;
            *)
              echo "::error::match-mode must be package-json or exact."
              exit 1
              ;;
          esac

          {
            echo "name=$PACKAGE_NAME"
            echo "package-version=$PACKAGE_VERSION"
            echo "directory=$PACKAGE_DIRECTORY"
            echo "tag=$RELEASE_TAG"
            echo "release-name=$RELEASE_NAME"
            echo "release-query=$RELEASE_QUERY"
            echo "changelog=$CHANGELOG_PATH"
            echo "tag-prefix=$TAG_PREFIX"
            echo "reset-commit=$RESET_COMMIT"
            echo "previous-tag-commit=$PREVIOUS_TAG_COMMIT"
            echo "backup-release-id=$BACKUP_RELEASE_ID"
            echo "backup-body-base64=$BACKUP_BODY_BASE64"
            echo "backup-updated-at=$BACKUP_UPDATED_AT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Reset release"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Package | `%s` |\n' "$PACKAGE_NAME"
            printf '| Version | `%s` |\n' "$PACKAGE_VERSION"
            printf '| Release tag | `%s` |\n' "$RELEASE_TAG"
            printf '| Configured package registry | `%s` |\n' "$PACKAGE_REGISTRY"
            echo "| Registry guard | **passed: version is unpublished in all supported registries** |"
            printf '| Previous tag commit | `%s` |\n' "${PREVIOUS_TAG_COMMIT:-missing}"
            echo "| Tag action | **preserve existing canonical tag** |"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Checkout version-matched reusable workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/reusable-workflows-runtime
          persist-credentials: false
          sparse-checkout: actions
          sparse-checkout-cone-mode: false
      - name: Validate selected release marker before recovery
        if: ${{ steps.package.outputs.blocked != 'true' }}
        uses: ./.github/reusable-workflows-runtime/actions/validate-release-identity
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ steps.package.outputs.tag }}
          version: ${{ steps.package.outputs.package-version }}
          package-name: ${{ steps.package.outputs.name }}
          target: ${{ steps.package.outputs.directory }}


  reset-release:
    name: "stage: Unrelease to draft and delete version tag"
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && needs.resolve.outputs.blocked != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reset mutable release and remove its canonical tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release-tag }}
          RELEASE_ID: ${{ needs.resolve.outputs.backup-release-id }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_REF="repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
          RELEASES_API="repos/$GITHUB_REPOSITORY/releases"
          if [ -n "$RELEASE_ID" ]; then
            RELEASE="$(gh api "$RELEASES_API/$RELEASE_ID")"
            if [ "$(jq -r '.immutable // false' <<< "$RELEASE")" = "true" ]; then
              echo "::error::$RELEASE_TAG is immutable; Reset cannot delete its associated version tag."
              exit 1
            fi
            IS_DRAFT="$(jq -r '.draft' <<< "$RELEASE")"
          else
            IS_DRAFT=missing
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Preview: $RELEASE_TAG release state=$IS_DRAFT; ensure a draft and remove its version tag."
            exit 0
          fi

          if [ "$IS_DRAFT" = "false" ]; then
            # GitHub has no direct published -> draft transition. Recreate
            # the mutable release, retaining its title and notes.
            ORIGINAL_NAME="$(jq -r '.name // ""' <<< "$RELEASE")"
            ORIGINAL_BODY="$(jq -r '.body // ""' <<< "$RELEASE")"
            ORIGINAL_PRERELEASE="$(jq -r '.prerelease' <<< "$RELEASE")"
            gh api --method DELETE "$RELEASES_API/$RELEASE_ID"
            gh api --method POST "$RELEASES_API" \
              -f tag_name="$RELEASE_TAG" \
              -f name="$ORIGINAL_NAME" \
              -f body="$ORIGINAL_BODY" \
              -F prerelease="$ORIGINAL_PRERELEASE" \
              -F draft=true >/dev/null
          elif [ "$IS_DRAFT" = "missing" ]; then
            echo "::notice::No existing GitHub Release to unpublish for $RELEASE_TAG."
          else
            echo "::notice::$RELEASE_TAG is already a draft."
          fi

          # Reset deliberately removes the package's version tag, unlike
          # Restore which moves that tag to a selected historical commit.
          if gh api "$RELEASE_REF" >/dev/null 2>&1; then
            gh api --method DELETE "$RELEASE_REF"
          fi
          if gh api "$RELEASE_REF" >/dev/null 2>&1; then
            echo "::error::Version tag $RELEASE_TAG still exists after Reset."
            exit 1
          fi
          echo "::notice::Reset complete: release is draft (when present), and $RELEASE_TAG is absent."

  summary:
    name: "job: Reset summary"
    needs: [resolve, reset-release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify after-state and summarize changes
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## After recovery"
            echo
            if [ -z "$RELEASE_TAG" ]; then
              echo "Recovery target was not resolved; no after-state can be verified."
              exit 0
            fi
            RELEASE_STATUS=unknown
            RELEASE=""
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/after-releases.json"; then
              RELEASE="$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty' "$RUNNER_TEMP/after-releases.json")"
              RELEASE_STATUS="$([ -n "$RELEASE" ] && echo present || echo absent)"
            else
              echo "::warning::Unable to fetch after-state releases."
            fi
            TAG_STATUS=unknown
            TAG_SHA=""
            if gh api -i "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/after-tag-response" 2>&1; then
              TAG_STATUS=present
              TAG_SHA="$(sed -n '/^{/,$p' "$RUNNER_TEMP/after-tag-response" | jq -r '.object.sha // empty' 2>/dev/null || true)"
            elif grep -Eq 'HTTP/[0-9.]+ 404|404 Not Found' "$RUNNER_TEMP/after-tag-response"; then
              TAG_STATUS=absent
            else
              echo "::warning::Unable to fetch after-state tag."
            fi
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Canonical tag | `%s` |\\n' "$RELEASE_TAG"
            printf '| Tag lookup | `%s` |\n' "$TAG_STATUS"
            printf '| Tag object SHA | `%s` |\n' "${TAG_SHA:-unknown}"
            if [ -n "$RELEASE" ]; then
              printf '| Release ID | `%s` |\\n' "$(jq -r '.id' <<< "$RELEASE")"
              printf '| Release state | `%s` |\\n' "$(jq -r 'if .draft then "draft" else "published" end' <<< "$RELEASE")"
              printf '| Immutable | `%s` |\\n' "$(jq -r '.immutable // false' <<< "$RELEASE")"
              printf '| Title | %s |\\n' "$(jq -r '.name // "" | gsub("[\\r\\n|]"; " ")' <<< "$RELEASE")"
            else
              printf '| Release lookup | `%s` |\n' "$RELEASE_STATUS"
            fi
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry-run: this is an unchanged-state audit, not proof of a recovery mutation."
            elif [ "$RESOLVE_RESULT" != "success" ]; then
              echo "Recovery failed during resolution; after-state recorded for diagnosis."
            else
              echo "After-state independently queried from GitHub; compare it with Before recovery above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reset result
        shell: bash
        run: |
          {
            echo "# Release reset result"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Resolve package and registry state | **${{ needs.resolve.result }}** |"
            echo "| Unrelease to draft and delete version tag | **${{ needs.reset-release.result }}** |"
            echo
            echo "Reset deletes the canonical version tag. Restore recreates or repositions it at a selected historical commit."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry-run }}" = "true" ] &&
             [ "${{ needs.resolve.outputs.blocked }}" = "true" ] &&
             [ "${{ needs.resolve.result }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ needs.resolve.result }}" != "success" ] ||
             [ "${{ needs.reset-release.result }}" != "success" ]; then
            exit 1
          fi
