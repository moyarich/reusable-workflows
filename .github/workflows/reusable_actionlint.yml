name: "Reusable · Validate GitHub Actions"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflow syntax and expressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run actionlint and audit suppressions
        id: actionlint
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION='1.7.12'
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          curl --fail --location --retry 3 --silent --show-error "$URL" -o "$RUNNER_TEMP/$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          ACTIONLINT="$RUNNER_TEMP/actionlint-bin/actionlint"
          "$ACTIONLINT" -version
          RAW="$RUNNER_TEMP/actionlint-raw.txt"
          FILTERED="$RUNNER_TEMP/actionlint-filtered.txt"
          # Audit the unfiltered diagnostics separately; CI uses .github/actionlint.yaml.
          printf '{}\n' > "$RUNNER_TEMP/actionlint-empty.yaml"
          "$ACTIONLINT" -config "$RUNNER_TEMP/actionlint-empty.yaml" -format '{{json .}}' -shellcheck= > "$RAW" 2>&1 || true
          status=0
          "$ACTIONLINT" -config .github/actionlint.yaml -format '{{json .}}' -shellcheck= > "$FILTERED" 2>&1 || status=$?
          cat "$FILTERED"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Workflow validation and suppression summary
        if: always()
        env:
          RESULT: ${{ steps.actionlint.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          raw = Path(os.environ["RUNNER_TEMP"], "actionlint-raw.txt")
          filtered = Path(os.environ["RUNNER_TEMP"], "actionlint-filtered.txt")
          # Read suppression patterns from the repository configuration.
          config = Path(".github/actionlint.yaml").read_text()
          rules = [(match.group(1), match.group(1).replace("''", "'"))
                   for line in config.splitlines()
                   if (match := re.match(r"^\s+-\s+'(.*)'\s*$", line))]
          if not rules:
              raise RuntimeError("No actionlint suppression patterns found in .github/actionlint.yaml")

          def diagnostics(path):
              if not path.exists():
                  return []
              import json
              entries = []
              for line_number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  if not line.strip():
                      continue
                  try:
                      parsed = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError(
                          f"Non-JSON actionlint output at {path}:{line_number}: {line[:250]!r}"
                      ) from exc
                  if isinstance(parsed, dict):
                      entries.append(parsed)
                  elif isinstance(parsed, list):
                      entries.extend(parsed)
                  else:
                      raise RuntimeError(f"Unexpected actionlint diagnostic at {path}:{line_number}")
              return entries

          raw_lines = diagnostics(raw)
          filtered_lines = diagnostics(filtered)
          counts = {name: 0 for name, _ in rules}
          for diagnostic in raw_lines:
              message = diagnostic.get("message", "")
              for name, pattern in rules:
                  if re.search(pattern, message):
                      counts[name] += 1
                      break

          total = sum(counts.values())
          summary = [
              "## GitHub Actions validation",
              "",
              "| Check | Result |",
              "| --- | --- |",
              f"| Actionlint (workflow syntax and expressions) | {os.environ.get('RESULT', 'unknown')} |",
              f"| Unsuppressed diagnostics | {len(filtered_lines)} |",
              f"| Diagnostics matching suppression rules | {total} |",
              "",
              "### Suppression audit",
              "",
              "| Suppression | Matching diagnostics |",
              "| --- | ---: |",
          ]
          for name, _ in rules:
              summary.append(f"| `{name.replace(chr(124), chr(92) + chr(124))}` | {counts[name]} |")
          summary.extend([
              "",
              "Counts are from structured JSON diagnostics from an unfiltered pass; the filtered pass determines CI success.",
              "Suppression rules remain active even when their matching count is zero.",
              "",
              "Actionlint version: `1.7.12` (runner-installed release)",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("\n".join(summary) + "\n")
          PY
