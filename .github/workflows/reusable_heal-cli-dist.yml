name: "Reusable · Heal generated CLI distribution"

on:
  workflow_call:
    inputs:
      dist-path:
        description: Generated CLI distribution path to commit
        required: true
        type: string
      build-command:
        description: Command to regenerate the distribution
        required: false
        default: npm run build
        type: string
      node-version:
        required: false
        default: "24"
        type: string
      target-branch:
        required: false
        default: main
        type: string
      validation-command:
        description: Command to validate the rebuilt distribution before committing
        required: false
        default: npm run checks
        type: string
      required-workflow:
        description: Workflow file to dispatch after a successful heal
        required: false
        default: ci.yml
        type: string
    outputs:
      changed:
        description: Whether generated distribution files changed
        value: ${{ jobs.heal.outputs.changed }}
      healed-sha:
        description: Exact commit to validate in CI
        value: ${{ jobs.heal.outputs.healed-sha }}
permissions: {}
jobs:
  heal:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      healed-sha: ${{ steps.head.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate distribution
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Validate regenerated distribution
        env:
          VALIDATION_COMMAND: ${{ inputs.validation-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"
      - name: Commit generated files
        id: commit
        env:
          DIST_PATH: ${{ inputs.dist-path }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DIST_PATH" || "$DIST_PATH" == /* || "$DIST_PATH" == *..* ]]; then
            echo "::error::dist-path must be a safe repository-relative path"
            exit 1
          fi
          if [[ ! -e "$DIST_PATH" ]]; then
            echo "::error::Distribution path does not exist: $DIST_PATH"
            exit 1
          fi
          git add -f -- "$DIST_PATH"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated distribution is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update CLI dist"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Record exact healed commit
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify branch still points at healed commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          EXPECTED_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq .sha)"
          test "$actual" = "$EXPECTED_SHA" || { echo "::error::Branch moved before dispatch: $actual != $EXPECTED_SHA"; exit 1; }
      - name: Dispatch and verify required workflow
        id: validation
        uses: moyarich/reusable-workflows/actions/workflow-dispatch@fix/self-heal-branch-sha-guard
        with:
          workflow: ${{ inputs.required-workflow }}
          branch: ${{ inputs.target-branch }}
          sha: ${{ steps.head.outputs.sha }}
          token: ${{ github.token }}
          timeout-seconds: '300'
          poll-seconds: '15'

      - name: Write healing summary
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.commit.outputs.changed || 'false' }}
          RESULT: ${{ job.status }}
          DIST_PATH: ${{ inputs.dist-path }}
          CI_URL: ${{ steps.validation.outputs.workflow-url }}
          CI_CONCLUSION: ${{ steps.validation.outputs.workflow-conclusion }}
        run: |
          {
            echo "## Generated distribution self-heal"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Distribution path | \`$DIST_PATH\` |"
            echo "| Files changed | $CHANGED |"
            echo "| Outcome | $RESULT |"
            echo
            echo "| CI conclusion | ${CI_CONCLUSION:-not completed} |"
            if [[ -n "$CI_URL" ]]; then echo "| CI run | [View run]($CI_URL) |"; fi
            echo
            echo "Required workflow is dispatched for the healed SHA, and the job waits up to five minutes for its result."
          } >> "$GITHUB_STEP_SUMMARY"
