name: "Reusable · Heal generated CLI distribution"

on:
  workflow_call:
    inputs:
      dist-path:
        description: Generated CLI distribution path to commit
        required: true
        type: string
      install-command:
        description: Dependency installation command for the distribution build
        required: false
        default: npm install --no-package-lock --no-audit --no-fund
        type: string
      build-command:
        description: Command to regenerate the distribution
        required: false
        default: npm run build
        type: string
      node-version:
        required: false
        default: "24"
        type: string
      commit:
        description: Commit generated files to the target branch
        type: boolean
        default: true
      expected-sha:
        description: Expected branch SHA produced by preceding repair stage
        required: false
        default: ""
        type: string
      target-branch:
        required: false
        default: main
        type: string
      validation-command:
        description: Command to validate the rebuilt distribution before committing
        required: false
        default: npm run checks
        type: string
    outputs:
      changed:
        description: Whether generated distribution files changed
        value: ${{ jobs.heal.outputs.changed }}
      healed-sha:
        description: Final distribution repair commit SHA
        value: ${{ jobs.heal.outputs.healed-sha }}
permissions: {}
jobs:
  heal:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      healed-sha: ${{ steps.head.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject branch movement since preceding repair
        if: ${{ inputs.expected-sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::Branch moved since preceding repair; restart self-heal"
            exit 1
          }
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"
      - name: Regenerate distribution
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Compare rebuilt distribution
        id: compare
        env:
          DIST_PATH: ${{ inputs.dist-path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DIST_PATH" || "$DIST_PATH" == /* || "$DIST_PATH" == *..* || ! -d "$DIST_PATH" ]]; then
            echo "::error::dist-path must be an existing safe relative directory"
            exit 1
          fi
          git add -f -- "$DIST_PATH"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Distribution matches the committed files."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- "$DIST_PATH"
          fi
      - name: Validate regenerated distribution
        env:
          VALIDATION_COMMAND: ${{ inputs.validation-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"
      - name: Commit generated files
        id: commit
        env:
          DIST_PATH: ${{ inputs.dist-path }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_CHANGES: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=${{ steps.compare.outputs.changed }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.compare.outputs.changed }}" != "true" ]]; then
            echo "Generated distribution is already current."
            exit 0
          fi
          if [[ "$COMMIT_CHANGES" != "true" ]]; then
            echo "Preview mode: distribution differs; no files committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update CLI dist"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Record exact healed commit
        id: head
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_CHANGES: ${{ inputs.commit }}
          CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          remote="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq .sha)"
          if [[ "$COMMIT_CHANGES" == "true" || "$CHANGED" != "true" ]]; then
            test "$remote" = "$sha" || { echo "::error::Branch moved during distribution repair"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Write healing summary
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.compare.outputs.changed || 'false' }}
          RESULT: ${{ job.status }}
          DIST_PATH: ${{ inputs.dist-path }}
        run: |
          {
            echo "## Generated distribution self-heal"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Distribution path | \`$DIST_PATH\` |"
            echo "| Files changed | $CHANGED |"
            echo "| Outcome | $RESULT |"
            echo
            echo
            echo "This worker only repairs generated distribution and returns the final SHA."
          } >> "$GITHUB_STEP_SUMMARY"
