name: "Reusable · Release"

on:
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Report effective reusable workflow inputs; set false when the caller already reports them
        required: false
        default: true
        type: boolean
      version:
        description: Release semantic version
        required: true
        default: "0.1.0"
        type: string
      release-tag:
        description: Immutable release tag
        required: true
        default: "v0.1.0"
        type: string
      release-name:
        description: GitHub Release name
        required: true
        default: "v0.1.0"
        type: string
      changelog-file:
        description: Changelog containing the version section
        required: true
        default: "CHANGELOG.md"
        type: string
      release-notes:
        description: Optional release notes override, useful for previews before the changelog is committed
        required: false
        default: ""
        type: string
      target-ref:
        description: Commit or branch the release tag should resolve to
        required: false
        default: main
        type: string
      dry-run:
        description: Preview without creating or changing tags/releases
        required: false
        default: true
        type: boolean
      create-tag:
        description: Create the immutable release tag when it does not already exist
        required: false
        default: false
        type: boolean
      major-tag:
        description: Optional moving major compatibility tag
        required: false
        default: ""
        type: string
      update-major-tag:
        description: Move major-tag to this release
        required: false
        default: false
        type: boolean
      draft:
        description: Keep the GitHub Release as a draft
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      show-input-summary:
        description: Report effective reusable workflow inputs; set false when the caller already reports them
        required: false
        default: true
        type: boolean
      version:
        description: Release semantic version
        required: true
        type: string
      release-tag:
        description: Immutable release tag
        required: true
        type: string
      release-name:
        description: GitHub Release name
        required: true
        type: string
      changelog-file:
        description: Changelog containing the version section
        required: true
        type: string
      release-notes:
        description: Optional release notes override, useful for previews before the changelog is committed
        required: false
        default: ""
        type: string
      target-ref:
        description: Commit or branch the release tag should resolve to
        required: false
        default: main
        type: string
      dry-run:
        description: Preview without creating or changing tags/releases
        required: false
        default: true
        type: boolean
      create-tag:
        description: Create the immutable release tag when it does not already exist
        required: false
        default: false
        type: boolean
      major-tag:
        description: Optional moving major compatibility tag
        required: false
        default: ""
        type: string
      update-major-tag:
        description: Move major-tag to this release
        required: false
        default: false
        type: boolean
      draft:
        description: Keep the GitHub Release as a draft
        required: false
        default: true
        type: boolean
    outputs:
      release-url:
        description: GitHub Release URL
        value: ${{ jobs.release.outputs.release-url }}
      release-id:
        description: GitHub Release ID
        value: ${{ jobs.release.outputs.release-id }}
      release-tag:
        description: Immutable release tag
        value: ${{ jobs.release.outputs.release-tag }}
      release-status:
        description: preview, created, reused, or failed
        value: ${{ jobs.release.outputs.release-status }}

permissions: {}

jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "release · Reusable workflow inputs"

  release:
    name: "job: Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.release.outputs.url }}
      release-id: ${{ steps.release.outputs.id }}
      release-tag: ${{ inputs.release-tag }}
      release-status: ${{ steps.release.outputs.status || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-ref }}
          fetch-depth: 0

      - name: Validate release identity
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_NAME: ${{ inputs.release-name }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
          MAJOR_TAG: ${{ inputs.major-tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be valid SemVer without a leading v."
            exit 1
          fi

          test -n "$RELEASE_TAG" || { echo "::error::release-tag is required."; exit 1; }
          test -n "$RELEASE_NAME" || { echo "::error::release-name is required."; exit 1; }

          if [ -z "$RELEASE_NOTES" ] && [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::error::Changelog not found: $CHANGELOG_FILE"
            exit 1
          fi

          if [ "${{ inputs.update-major-tag }}" = "true" ] && [ -z "$MAJOR_TAG" ]; then
            echo "::error::major-tag is required when update-major-tag is enabled."
            exit 1
          fi

      - name: Resolve release content
        id: notes
        env:
          VERSION: ${{ inputs.version }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
        shell: bash
        run: |
          set -euo pipefail

          CHANGELOG_SECTION=""
          if [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG_SECTION="$(
              awk -v version="$VERSION" '
                $0 ~ "^## \\[" version "\\]" || $0 ~ "^## " version "([[:space:]]|$)" { in_section=1 }
                in_section && /^## / &&
                  $0 !~ "^## \\[" version "\\]" &&
                  $0 !~ "^## " version "([[:space:]]|$)" { exit }
                in_section { print }
              ' "$CHANGELOG_FILE"
            )"
          fi

          CHANGELOG_SECTION_FILE="$RUNNER_TEMP/changelog-section.md"
          printf '%s\n' "$CHANGELOG_SECTION" > "$CHANGELOG_SECTION_FILE"

          if [ -n "$RELEASE_NOTES" ]; then
            RELEASE_CONTENT="$RELEASE_NOTES"
          else
            RELEASE_CONTENT="$CHANGELOG_SECTION"
          fi

          if [ -z "$RELEASE_CONTENT" ]; then
            echo "::error::$CHANGELOG_FILE has no release section for $VERSION and no release-notes override was supplied."
            exit 1
          fi

          RELEASE_CONTENT_FILE="$RUNNER_TEMP/release-content.md"
          printf '%s\n' "$RELEASE_CONTENT" > "$RELEASE_CONTENT_FILE"

          {
            echo "file=$RELEASE_CONTENT_FILE"
            echo "release-content-file=$RELEASE_CONTENT_FILE"
            echo "changelog-section-file=$CHANGELOG_SECTION_FILE"
            if [ -n "$RELEASE_NOTES" ]; then
              echo "source=override"
            else
              echo "source=changelog"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Inspect release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)"
          TARGET_COMMIT="$(git rev-parse HEAD)"

          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$TARGET_COMMIT" ]; then
            echo "::error::Immutable tag $RELEASE_TAG already points to $TAG_COMMIT, not $TARGET_COMMIT."
            exit 1
          fi

          RELEASE="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty'
          )"

          {
            echo "tag-exists=$([ -n "$TAG_COMMIT" ] && echo true || echo false)"
            echo "target-commit=$TARGET_COMMIT"
            if [ -n "$RELEASE" ]; then
              echo "release-exists=true"
              echo "release-id=$(jq -r '.id' <<< "$RELEASE")"
              echo "release-url=$(jq -r '.html_url' <<< "$RELEASE")"
              echo "release-draft=$(jq -r '.draft' <<< "$RELEASE")"
            else
              echo "release-exists=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable tag
        if: ${{ !inputs.dry-run && inputs.create-tag && steps.state.outputs.tag-exists != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Update major compatibility tag
        if: ${{ !inputs.dry-run && inputs.update-major-tag }}
        env:
          MAJOR_TAG: ${{ inputs.major-tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force "$MAJOR_TAG" HEAD
          git push --force origin "refs/tags/$MAJOR_TAG:refs/tags/$MAJOR_TAG"

      - name: Ensure GitHub Release
        id: release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_NAME: ${{ inputs.release-name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail

          EXISTING="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty'
          )"

          if [ -n "$EXISTING" ]; then
            RELEASE_ID="$(jq -r '.id' <<< "$EXISTING")"

            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name="$RELEASE_TAG" \
              -f name="$RELEASE_NAME" \
              -f body="$(cat "$NOTES_FILE")" \
              -F draft=${{ inputs.draft }} >/dev/null

            UPDATED="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            RELEASE_URL="$(jq -r '.html_url' <<< "$UPDATED")"

            if [ "$(jq -r '.draft' <<< "$UPDATED")" = "true" ]; then
              STATUS="draft"
            else
              STATUS="published"
            fi
          else
            ARGS=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "$RELEASE_NAME"
              --notes-file "$NOTES_FILE"
            )

            if [ "${{ inputs.draft }}" = "true" ]; then
              ARGS+=(--draft)
            fi

            gh release create "${ARGS[@]}"
            CREATED="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
            RELEASE_ID="$(jq -r '.id' <<< "$CREATED")"
            RELEASE_URL="$(jq -r '.html_url' <<< "$CREATED")"

            if [ "$(jq -r '.draft' <<< "$CREATED")" = "true" ]; then
              STATUS="draft"
            else
              STATUS="published"
            fi
          fi

          {
            echo "id=$RELEASE_ID"
            echo "url=$RELEASE_URL"
            echo "status=$STATUS"
          } >> "$GITHUB_OUTPUT"



      - name: GitHub Release summary
        if: ${{ always() }}
        env:
          CHANGELOG_SECTION_FILE: ${{ steps.notes.outputs.changelog-section-file }}
          RELEASE_CONTENT_FILE: ${{ steps.notes.outputs.release-content-file }}
          CONTENT_SOURCE: ${{ steps.notes.outputs.source || 'unresolved' }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# GitHub Release"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Version | `%s` |\n' "${{ inputs.version }}"
            printf '| Immutable tag | `%s` |\n' "${{ inputs.release-tag }}"
            printf '| Release name | `%s` |\n' "${{ inputs.release-name }}"
            printf '| Target ref | `%s` |\n' "${{ inputs.target-ref }}"
            printf '| Dry run | **%s** |\n' "${{ inputs.dry-run }}"
            printf '| Create immutable tag | **%s** |\n' "${{ inputs.create-tag }}"
            printf '| Major alias | `%s` |\n' "${{ inputs.major-tag }}"
            printf '| Update major alias | **%s** |\n' "${{ inputs.update-major-tag }}"
            printf '| Final release state | **%s** |\n' "${{ inputs.draft && 'draft' || 'published' }}"
            printf '| Release content source | `%s` |\n' "$CONTENT_SOURCE"

            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "| Result | **preview** |"
              echo "| GitHub Release | _not mutated_ |"
            else
              printf '| Result | **%s** |\n' "${RELEASE_STATUS:-unresolved}"
              if [ -n "$RELEASE_URL" ]; then
                printf '| GitHub Release | [Open release](%s) |\n' "$RELEASE_URL"
              else
                echo "| GitHub Release | unavailable |"
              fi
            fi

            echo
            echo "## CHANGELOG.md content"
            echo
            if [ -n "$CHANGELOG_SECTION_FILE" ] && [ -s "$CHANGELOG_SECTION_FILE" ]; then
              cat "$CHANGELOG_SECTION_FILE"
            else
              echo "> No matching `CHANGELOG.md` section was found for `${{ inputs.version }}`."
            fi

            echo
            echo "## GitHub Release content"
            echo
            if [ -n "$RELEASE_CONTENT_FILE" ] && [ -s "$RELEASE_CONTENT_FILE" ]; then
              cat "$RELEASE_CONTENT_FILE"
            else
              echo "> Release content could not be resolved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
