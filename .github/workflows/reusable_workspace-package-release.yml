name: "Reusable · Workspace package releases"

on:
  workflow_call:
    inputs:
      workspace-tools-source:
        type: string
        required: false
        default: auto
      package:
        type: string
        required: false
        default: all
      version-mode:
        type: string
        required: false
        default: package-json
      initial-version:
        type: string
        required: false
        default: "0.1.0"
      version-bump:
        type: string
        required: false
        default: patch
      exact-version:
        type: string
        required: false
        default: ""
      commit-version-changes:
        type: boolean
        default: false
      update-major-tag:
        type: boolean
        required: false
        default: true
      draft:
        type: boolean
        required: false
        default: true
      dry-run:
        type: boolean
        required: false
        default: true

permissions: {}

concurrency:
  group: workspace-package-release-${{ github.repository }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  discover-packages:
    name: Discover publishable packages
    permissions:
      contents: read
    uses: $/.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: packages
      workspace-tools-source: ${{ inputs.workspace-tools-source }}
      use-workspaces: true
      include-root-package: true
      require-publish-config: false

  select-packages:
    name: Select requested packages
    needs: discover-packages
    permissions:
      contents: read
    uses: $/.github/workflows/reusable_select-release-packages.yml
    with:
      packages-json: ${{ needs.discover-packages.outputs.packages }}
      package: ${{ inputs.package }}
      event-name: workflow_dispatch
      after-sha: ${{ github.sha }}
      target-branch: ${{ github.ref_name }}
      version-mode: ${{ inputs.version-mode }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}

  select:
    name: Resolve and prepare versions with Workspace Tools
    needs: select-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      count: ${{ steps.versions.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.commit-version-changes && !inputs.dry-run }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve Workspace Tools CLI
        id: workspace-tools
        uses: $/actions/setup-workspace-tools
        with:
          workspace-tools-source: ${{ inputs.workspace-tools-source }}
      - name: Prepare versions, manifests and lockfile
        id: versions
        shell: bash
        env:
          BIN: ${{ steps.workspace-tools.outputs.bin-dir }}
          SELECTOR: ${{ inputs.package }}
          MODE: ${{ inputs.version-mode }}
          BUMP: ${{ inputs.version-bump }}
          EXACT: ${{ inputs.exact-version }}
          INITIAL: ${{ inputs.initial-version }}
          COMMIT: ${{ inputs.commit-version-changes }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=(--package "$SELECTOR" --version-mode "$MODE" --version-bump "$BUMP" --exact-version "$EXACT" --initial-version "$INITIAL" --manifest "$RUNNER_TEMP/prepared.json")
          if [[ "$DRY_RUN" != true ]]; then args+=(--write); fi
          node "$BIN/workspace-prepare-release.mjs" "${args[@]}"
          git diff --check
          resolved="$(jq -ce '[.packages[] | . + {major: (.version | split(".")[0] | tonumber)}]' "$RUNNER_TEMP/prepared.json")"
          [[ "$(jq length <<< "$resolved")" -gt 0 ]] || { echo "::error::No packages selected"; exit 1; }
          echo "matrix=$(jq -cn --argjson packages "$resolved" '{include:$packages}')" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$resolved")" >> "$GITHUB_OUTPUT"
          if [[ "$DRY_RUN" != true ]] && [[ -n "$(git status --porcelain -- package.json package-lock.json packages apps)" ]]; then
            if [[ "$COMMIT" != true ]]; then
              echo "::error::Release has uncommitted version changes; enable commit-version-changes or use already committed package-json versions."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- package.json package-lock.json
            if [[ -d packages ]]; then git add -u -- packages; fi
            if [[ -d apps ]]; then git add -u -- apps; fi
            git commit -m "release: prepare selected workspace versions"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          {
            echo "## Release preparation"
            jq -r '.packages[] | "- " + .name + ": " + .currentVersion + " → " + .version' "$RUNNER_TEMP/prepared.json"
            echo
            echo "Mode: $MODE; dry-run: $DRY_RUN; commit: $COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Validate package release
    needs: select
    if: ${{ always() && needs.select.result == 'success' && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Build workspace dependencies once
        shell: bash
        run: |
          if node -e 'const p=require("./package.json");const w=Array.isArray(p.workspaces)?p.workspaces:p.workspaces?.packages??[];process.exit(w.length?0:1)'; then
            npm run build --workspaces --include-workspace-root --if-present
          else
            npm run build --if-present
          fi
      - name: Validate every selected package tarball
        env:
          PACKAGE_MATRIX: ${{ needs.select.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.include[] | [.name, .directory] | @tsv' <<< "$PACKAGE_MATRIX" | while IFS="$(printf '\\t')" read -r package directory; do
            echo "::group::Validate $package"
            if [ "$directory" = "." ]; then npm pack --dry-run; else npm pack --workspace "$package" --dry-run; fi
            echo "::endgroup::"
          done

  release:
    name: GitHub package release
    needs: [select, gate]
    if: ${{ always() && needs.select.result == 'success' && needs.gate.result == 'success' && needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1 # Avoid concurrent release/tag mutations and GitHub release-index races.
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: write
    uses: $/.github/workflows/reusable_release.yml
    with:
      version: ${{ matrix.version }}
      release-tag: ${{ format('{0}@{1}', matrix.name, matrix.version) }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-file: ${{ matrix.directory == '.' && 'CHANGELOG.md' || format('{0}/CHANGELOG.md', matrix.directory) }}
      target-ref: ${{ github.ref_name }}
      create-tag: true
      major-tag: ${{ format('{0}@v{1}', matrix.name, matrix.major) }}
      update-major-tag: ${{ inputs.update-major-tag }}
      draft: ${{ inputs.draft }}
      dry-run: ${{ inputs.dry-run }}

  report:
    name: Workspace release · Summary
    if: ${{ always() }}
    needs: [discover-packages, select-packages, select, gate, release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Consolidated release report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVER_STATUS: ${{ needs.discover-packages.result }}
          DISCOVERED_JSON: ${{ needs.discover-packages.outputs.packages }}
          SELECTION_STATUS: ${{ needs.select-packages.result }}
          SELECT_STATUS: ${{ needs.select.result }}
          PACKAGE_MATRIX: ${{ needs.select.outputs.matrix }}
          PREPARE_STATUS: ${{ needs.select.result }}
          VALIDATE_STATUS: ${{ needs.gate.result }}
          RELEASE_STATUS: ${{ needs.release.result }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          VERSION_MODE: ${{ inputs.version-mode }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          DRY_RUN: ${{ inputs.dry-run }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          {
            echo "# Workspace package release · Summary"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Repository | `%s` |\n' "$GITHUB_REPOSITORY"
            printf '| Requested packages | `%s` |\n' "$REQUESTED_PACKAGE"
            printf '| Version mode | `%s` |\n' "$VERSION_MODE"
            printf '| Version bump | `%s` |\n' "$VERSION_BUMP"
            printf '| Dry run | **%s** |\n' "$DRY_RUN"
            printf '| Draft release | **%s** |\n' "$DRAFT"
            echo
            echo "## Job outcomes"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            printf '| Discover packages | **%s** |\n' "$DISCOVER_STATUS"
            printf '| Select packages | **%s** |\n' "$SELECTION_STATUS"
            printf '| Resolve versions | **%s** |\n' "$SELECT_STATUS"
            printf '| Prepare manifests | **%s** |\n' "$PREPARE_STATUS"
            printf '| Build and validate tarballs | **%s** |\n' "$VALIDATE_STATUS"
            printf '| GitHub package releases | **%s** |\n' "$RELEASE_STATUS"
            echo
            echo "## Discovered packages"
            echo
            if jq -e 'type == "array"' >/dev/null 2>&1 <<< "$DISCOVERED_JSON"; then
              printf 'Discovered: **%s**\n\n' "$(jq 'length' <<< "$DISCOVERED_JSON")"
            else
              echo "Discovery did not return a package inventory."
            fi
            echo
            echo "## Selected packages and versions"
            echo
            if jq -e '.include | type == "array"' >/dev/null 2>&1 <<< "$PACKAGE_MATRIX"; then
              printf 'Selected: **%s**\n\n' "$(jq '.include | length' <<< "$PACKAGE_MATRIX")"
              echo "| Package | Directory | Release version | Expected Git tag |"
              echo "| --- | --- | --- | --- |"
              jq -r '.include[] | "| `" + .name + "` | `" + .directory + "` | `" + .version + "` | `" + .name + "@" + .version + "` |"' <<< "$PACKAGE_MATRIX"
            else
              echo "Selection or version resolution did not complete."
            fi
            echo
            echo "## Individual package release jobs"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            if jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | contains("GitHub package release") and endswith("job: Release")) | [.name, (.conclusion // .status)] | @tsv' 2>/dev/null)"; then
              if [ -n "$jobs" ]; then
                while IFS="$(printf '\t')" read -r job outcome; do
                  printf '| %s | **%s** |\n' "$job" "$outcome"
                done <<< "$jobs"
              else
                echo "| No per-package release jobs ran | skipped |"
              fi
            else
              echo "| Package-level details | Unable to retrieve job results; see the Actions job list |"
            fi
            echo
            echo "## Overall result"
            echo
            if [[ "$DISCOVER_STATUS" == failure || "$SELECTION_STATUS" == failure || "$SELECT_STATUS" == failure || "$PREPARE_STATUS" == failure || "$VALIDATE_STATUS" == failure || "$RELEASE_STATUS" == failure ]]; then
              echo "**Failed** — see unsuccessful jobs above; dry-run mode does not imply success."
            elif [[ "$RELEASE_STATUS" == success && "$DRY_RUN" == true ]]; then
              echo "**Dry-run completed** — no release or tag mutations requested."
            elif [[ "$RELEASE_STATUS" == success ]]; then
              echo "**Release workflow completed.**"
            else
              echo "**Incomplete or skipped** — review the job outcomes above."
            fi
            echo
            echo "_Per-package release details and immutable-tag warnings remain available in the individual job summaries._"
          } >> "$GITHUB_STEP_SUMMARY"
