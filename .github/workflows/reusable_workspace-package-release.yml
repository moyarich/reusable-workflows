            echo "| --- | --- |"
            if jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | contains("GitHub package release") and endswith("job: Release")) | [.name, (.conclusion // .status)] | @tsv' 2>/dev/null)"; then
              if [ -n "$jobs" ]; then
                while IFS="$(printf '\t')" read -r job outcome; do
                  printf '| %s | **%s** |\n' "$job" "$outcome"
                done <<< "$jobs"
              else
