name: "Reusable · Workspace package releases"

on:
  workflow_call:
    inputs:
      workspace-tools-source:
        type: string
        required: false
        default: auto
      package:
        type: string
        required: false
        default: all
      version-mode:
        type: string
        required: false
        default: package-json
      initial-version:
        type: string
        required: false
        default: "0.1.0"
      version-bump:
        type: string
        required: false
        default: patch
      exact-version:
        type: string
        required: false
        default: ""
      update-major-tag:
        type: boolean
        required: false
        default: true
      draft:
        type: boolean
        required: false
        default: true
      dry-run:
        type: boolean
        required: false
        default: true

permissions: {}

concurrency:
  group: workspace-package-release-${{ github.repository }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  discover-packages:
    name: Discover publishable packages
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: packages
      workspace-tools-source: ${{ inputs.workspace-tools-source }}
      use-workspaces: true
      include-root-package: true
      require-publish-config: false

  select-packages:
    name: Select requested packages
    needs: discover-packages
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_select-release-packages.yml
    with:
      packages-json: ${{ needs.discover-packages.outputs.packages }}
      package: ${{ inputs.package }}
      event-name: workflow_dispatch
      after-sha: ${{ github.sha }}
      target-branch: main
      version-mode: ${{ inputs.version-mode }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}

  select:
    name: Resolve versions for selected packages
    needs: select-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      count: ${{ steps.versions.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve Workspace Tools CLI
        id: workspace-tools
        uses: moyarich/reusable-workflows/actions/setup-workspace-tools@main
        with:
          workspace-tools-source: ${{ inputs.workspace-tools-source }}
      - name: Resolve release versions
        id: versions
        env:
          MATRIX: ${{ needs.select-packages.outputs.matrix }}
          VERSION_MODE: ${{ inputs.version-mode }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          EXACT_VERSION: ${{ inputs.exact-version }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
          WORKSPACE_TOOLS_BIN: ${{ steps.workspace-tools.outputs.bin-dir }}
        shell: bash
        run: |
          set -euo pipefail
          selected="$(jq -c '.include' <<< "$MATRIX")"
          resolved="$(node "$WORKSPACE_TOOLS_BIN/workspace-release-identity.mjs" resolve-versions \
            --packages-json "$selected" \
            --mode "$VERSION_MODE" \
            --bump "$VERSION_BUMP" \
            --exact-version "$EXACT_VERSION" \
            --initial-version "$INITIAL_VERSION")"
          count="$(jq 'length' <<< "$resolved")"
          if [ "$count" -eq 0 ]; then
            echo "::error::No publishable packages selected"
            exit 1
          fi
          echo "matrix=$(jq -cn --argjson packages "$resolved" '{include: $packages}')" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "# Package release selection"
            echo
            printf '**%s publishable packages selected**\n\n' "$count"
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Package selector | `%s` |\n' "${{ inputs.package }}"
            printf '| Version mode | `%s` |\n' "$VERSION_MODE"
            printf '| Dry run | **%s** |\n' "${{ inputs.dry-run }}"
            echo
            echo "## Packages"
            echo
            echo "| Package | Directory | Current version | Release version |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| `" + .name + "` | `" + .directory + "` | `" + (.currentVersion // .current_version // "unknown") + "` | `" + .version + "` |"' <<< "$resolved"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-versions:
    name: Prepare package versions
    needs: select
    if: ${{ !inputs.dry-run && inputs.version-mode != 'package-json' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Update selected manifests and lockfile
        env:
          PACKAGES: ${{ needs.select.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGES="$PACKAGES" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const selected = JSON.parse(process.env.PACKAGES).include;
          const lockPath = "package-lock.json";
          const lock = JSON.parse(readFileSync(lockPath, "utf8"));
          const selectedByName = new Map(selected.map(pkg => [pkg.name, pkg]));
          const rootManifest = JSON.parse(readFileSync("package.json", "utf8"));
          const rootSelection = selected.find(pkg => pkg.directory === ".");
          if (rootSelection) {
            if (rootManifest.private === true || rootManifest.name !== rootSelection.name) throw Error("Selected root manifest is not publishable or does not match");
            rootManifest.version = rootSelection.version;
            lock.version = rootSelection.version;
            if (lock.packages?.[""]) lock.packages[""].version = rootSelection.version;
          }
          const workspaceEntries = Object.entries(lock.packages ?? {})
            .filter(([directory, meta]) => directory && !directory.startsWith("node_modules/") && meta.name);
          const files = [];
          for (const [directory, meta] of workspaceEntries) {
            const manifestPath = `${directory}/package.json`;
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            if (manifest.name !== meta.name) throw Error(`Workspace mismatch: ${directory}`);
            const target = selectedByName.get(manifest.name);
            if (target) {
              if (target.directory !== directory) throw Error(`Selected directory mismatch: ${manifest.name}`);
              manifest.version = target.version;
              meta.version = target.version;
            }
            // Update only local dependencies whose declared range would reject
            // the selected release version. Preserve compatible caret, tilde,
            // wildcard, and other ranges to avoid unnecessary manifest churn.
            const accepts = (range, version) => {
              if (range === "*" || range === "latest") return true;
              const parse = text => {
                const m = text.match(/^([0-9]+)\\.([0-9]+)\\.([0-9]+)(?:-([0-9A-Za-z.-]+))?$/);
                return m ? m.slice(1, 4).map(Number) : null;
              };
              const actual = parse(version);
              if (!actual) return false;
              const prefix = range.startsWith("^") || range.startsWith("~") ? range[0] : "";
              const required = parse(prefix ? range.slice(1) : range);
              if (!required) return false;
              const compare = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              if (!prefix) return range === version;
              if (compare(actual, required) < 0) return false;
              if (prefix === "~") return actual[0] === required[0] && actual[1] === required[1];
              if (required[0] > 0) return actual[0] === required[0];
              if (required[1] > 0) return actual[0] === 0 && actual[1] === required[1];
              return actual[0] === 0 && actual[1] === 0 && actual[2] === required[2];
            };
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              if (!manifest[field]) continue;
              for (const [name, range] of Object.entries(manifest[field])) {
                const dependency = selectedByName.get(name);
                if (!dependency || accepts(range, dependency.version)) continue;
                const prefix = range.startsWith("^") || range.startsWith("~") ? range[0] : "";
                manifest[field][name] = prefix + dependency.version;
              }
            }
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              if (manifest[field]) meta[field] = { ...manifest[field] };
            }
            files.push([manifestPath, manifest]);
          }
          for (const pkg of selected) {
            if (pkg.directory !== "." && !workspaceEntries.some(([directory]) => directory === pkg.directory)) {
              throw Error(`Selected workspace missing from lockfile: ${pkg.directory}`);
            }
          }
          if (rootSelection) files.push(["package.json", rootManifest]);
          for (const [path, value] of files) writeFileSync(path, JSON.stringify(value, null, 2) + "\n");
          writeFileSync(lockPath, JSON.stringify(lock, null, 2) + "\n");
          NODE
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- package.json packages package-lock.json
            git commit -m "release: prepare selected package versions"
            git push origin HEAD:main
          fi

  gate:
    name: Validate package release
    needs: [select, prepare-versions]
    if: ${{ always() && needs.select.result == 'success' && (needs.prepare-versions.result == 'success' || needs.prepare-versions.result == 'skipped') && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Build workspace dependencies once
        run: npm run build --workspaces --include-workspace-root --if-present
      - name: Validate every selected package tarball
        env:
          PACKAGE_MATRIX: ${{ needs.select.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.include[] | [.name, .directory] | @tsv' <<< "$PACKAGE_MATRIX" | while IFS=
            echo "::group::Validate $package"
            if [ "$directory" = "." ]; then npm pack --dry-run; else npm pack --workspace "$package" --dry-run; fi
            echo "::endgroup::"
          done

  release:
    name: GitHub package release
    needs: [select, prepare-versions, gate]
    if: ${{ always() && needs.select.result == 'success' && (needs.prepare-versions.result == 'success' || needs.prepare-versions.result == 'skipped') && needs.gate.result == 'success' && needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1 # Avoid concurrent release/tag mutations and GitHub release-index races.
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/reusable_release.yml
    with:
      version: ${{ matrix.version }}
      release-tag: ${{ format('{0}@{1}', matrix.name, matrix.version) }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-file: ${{ matrix.directory == '.' && 'CHANGELOG.md' || format('{0}/CHANGELOG.md', matrix.directory) }}
      target-ref: main
      create-tag: true
      major-tag: ${{ format('{0}@v{1}', matrix.name, matrix.major) }}
      update-major-tag: ${{ inputs.update-major-tag }}
      draft: ${{ inputs.draft }}
      dry-run: ${{ inputs.dry-run }}

  report:
    name: Workspace release · Summary
    if: ${{ always() }}
    needs: [discover-packages, select-packages, select, prepare-versions, gate, release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Consolidated release report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVER_STATUS: ${{ needs.discover-packages.result }}
          DISCOVERED_JSON: ${{ needs.discover-packages.outputs.packages }}
          SELECTION_STATUS: ${{ needs.select-packages.result }}
          SELECT_STATUS: ${{ needs.select.result }}
          PACKAGE_MATRIX: ${{ needs.select.outputs.matrix }}
          PREPARE_STATUS: ${{ needs.prepare-versions.result }}
          VALIDATE_STATUS: ${{ needs.gate.result }}
          RELEASE_STATUS: ${{ needs.release.result }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          VERSION_MODE: ${{ inputs.version-mode }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          DRY_RUN: ${{ inputs.dry-run }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          {
            echo "# Workspace package release · Summary"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Repository | `%s` |\n' "$GITHUB_REPOSITORY"
            printf '| Requested packages | `%s` |\n' "$REQUESTED_PACKAGE"
            printf '| Version mode | `%s` |\n' "$VERSION_MODE"
            printf '| Version bump | `%s` |\n' "$VERSION_BUMP"
            printf '| Dry run | **%s** |\n' "$DRY_RUN"
            printf '| Draft release | **%s** |\n' "$DRAFT"
            echo
            echo "## Job outcomes"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            printf '| Discover packages | **%s** |\n' "$DISCOVER_STATUS"
            printf '| Select packages | **%s** |\n' "$SELECTION_STATUS"
            printf '| Resolve versions | **%s** |\n' "$SELECT_STATUS"
            printf '| Prepare manifests | **%s** |\n' "$PREPARE_STATUS"
            printf '| Build and validate tarballs | **%s** |\n' "$VALIDATE_STATUS"
            printf '| GitHub package releases | **%s** |\n' "$RELEASE_STATUS"
            echo
            echo "## Discovered packages"
            echo
            if jq -e 'type == "array"' >/dev/null 2>&1 <<< "$DISCOVERED_JSON"; then
              printf 'Discovered: **%s**\n\n' "$(jq 'length' <<< "$DISCOVERED_JSON")"
            else
              echo "Discovery did not return a package inventory."
            fi
            echo
            echo "## Selected packages and versions"
            echo
            if jq -e '.include | type == "array"' >/dev/null 2>&1 <<< "$PACKAGE_MATRIX"; then
              printf 'Selected: **%s**\n\n' "$(jq '.include | length' <<< "$PACKAGE_MATRIX")"
              echo "| Package | Directory | Release version | Expected Git tag |"
              echo "| --- | --- | --- | --- |"
              jq -r '.include[] | "| `" + .name + "` | `" + .directory + "` | `" + .version + "` | `" + .name + "@" + .version + "` |"' <<< "$PACKAGE_MATRIX"
            else
              echo "Selection or version resolution did not complete."
            fi
            echo
            echo "## Individual package release jobs"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            if jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | contains("GitHub package release") and endswith("job: Release")) | [.name, (.conclusion // .status)] | @tsv' 2>/dev/null)"; then
              if [ -n "$jobs" ]; then
                while IFS="$(printf '\t')" read -r job outcome; do
                  printf '| %s | **%s** |\n' "$job" "$outcome"
                done <<< "$jobs"
              else
                echo "| No per-package release jobs ran | skipped |"
              fi
            else
              echo "| Package-level details | Unable to retrieve job results; see the Actions job list |"
            fi
            echo
            echo "## Overall result"
            echo
            if [[ "$DISCOVER_STATUS" == failure || "$SELECTION_STATUS" == failure || "$SELECT_STATUS" == failure || "$PREPARE_STATUS" == failure || "$VALIDATE_STATUS" == failure || "$RELEASE_STATUS" == failure ]]; then
              echo "**Failed** — see unsuccessful jobs above; dry-run mode does not imply success."
            elif [[ "$RELEASE_STATUS" == success && "$DRY_RUN" == true ]]; then
              echo "**Dry-run completed** — no release or tag mutations requested."
            elif [[ "$RELEASE_STATUS" == success ]]; then
              echo "**Release workflow completed.**"
            else
              echo "**Incomplete or skipped** — review the job outcomes above."
            fi
            echo
            echo "_Per-package release details and immutable-tag warnings remain available in the individual job summaries._"
          } >> "$GITHUB_STEP_SUMMARY"
\\t' read -r package directory; do
            echo "::group::Validate $package"
            npm pack --workspace "$package" --dry-run
            echo "::endgroup::"
          done

  release:
    name: GitHub package release
    needs: [select, prepare-versions, gate]
    if: ${{ always() && needs.select.result == 'success' && (needs.prepare-versions.result == 'success' || needs.prepare-versions.result == 'skipped') && needs.gate.result == 'success' && needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1 # Avoid concurrent release/tag mutations and GitHub release-index races.
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/reusable_release.yml
    with:
      version: ${{ matrix.version }}
      release-tag: ${{ format('{0}@{1}', matrix.name, matrix.version) }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-file: ${{ format('{0}/CHANGELOG.md', matrix.directory) }}
      target-ref: main
      create-tag: true
      major-tag: ${{ format('{0}@v{1}', matrix.name, matrix.major) }}
      update-major-tag: ${{ inputs.update-major-tag }}
      draft: ${{ inputs.draft }}
      dry-run: ${{ inputs.dry-run }}

  report:
    name: Workspace release · Summary
    if: ${{ always() }}
    needs: [discover-packages, select-packages, select, prepare-versions, gate, release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Consolidated release report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVER_STATUS: ${{ needs.discover-packages.result }}
          DISCOVERED_JSON: ${{ needs.discover-packages.outputs.packages }}
          SELECTION_STATUS: ${{ needs.select-packages.result }}
          SELECT_STATUS: ${{ needs.select.result }}
          PACKAGE_MATRIX: ${{ needs.select.outputs.matrix }}
          PREPARE_STATUS: ${{ needs.prepare-versions.result }}
          VALIDATE_STATUS: ${{ needs.gate.result }}
          RELEASE_STATUS: ${{ needs.release.result }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          VERSION_MODE: ${{ inputs.version-mode }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          DRY_RUN: ${{ inputs.dry-run }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          {
            echo "# Workspace package release · Summary"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Repository | `%s` |\n' "$GITHUB_REPOSITORY"
            printf '| Requested packages | `%s` |\n' "$REQUESTED_PACKAGE"
            printf '| Version mode | `%s` |\n' "$VERSION_MODE"
            printf '| Version bump | `%s` |\n' "$VERSION_BUMP"
            printf '| Dry run | **%s** |\n' "$DRY_RUN"
            printf '| Draft release | **%s** |\n' "$DRAFT"
            echo
            echo "## Job outcomes"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            printf '| Discover packages | **%s** |\n' "$DISCOVER_STATUS"
            printf '| Select packages | **%s** |\n' "$SELECTION_STATUS"
            printf '| Resolve versions | **%s** |\n' "$SELECT_STATUS"
            printf '| Prepare manifests | **%s** |\n' "$PREPARE_STATUS"
            printf '| Build and validate tarballs | **%s** |\n' "$VALIDATE_STATUS"
            printf '| GitHub package releases | **%s** |\n' "$RELEASE_STATUS"
            echo
            echo "## Discovered packages"
            echo
            if jq -e 'type == "array"' >/dev/null 2>&1 <<< "$DISCOVERED_JSON"; then
              printf 'Discovered: **%s**\n\n' "$(jq 'length' <<< "$DISCOVERED_JSON")"
            else
