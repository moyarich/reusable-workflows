name: "Reusable · Approved release from preparation PR"

on:
  workflow_call:
    inputs:
      expected-base:
        type: string
        default: main
      required-workflows:
        type: string
        default: ''
      dry-run:
        type: boolean
        default: false
    secrets:
      npm-token:
        required: false

permissions: {}

concurrency:
  group: approved-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify approved merged preparation
    permissions:
      contents: read
      checks: read
      actions: read
      statuses: read
      pull-requests: read
    uses: $/.github/workflows/reusable_verify-release-preparation.yml
    with:
      expected-base: ${{ inputs.expected-base }}
      required-workflows: ${{ inputs.required-workflows }}

  plan:
    name: Gate automatic publishing
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      directory: ${{ steps.package.outputs.directory }}
      version: ${{ steps.package.outputs.version }}
      release-tag: ${{ steps.package.outputs.release-tag }}
    steps:
      - name: Require one explicitly approved release package
        id: package
        env:
          PACKAGES: ${{ needs.verify.outputs.packages }}
          APPROVED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length == 1' <<< "$PACKAGES" >/dev/null || {
            echo "::error::Automatic release currently supports exactly one approved package per preparation PR. Multi-package releases require explicit orchestration."
            exit 1
          }
          jq -e '.[0] | (.name | type == "string" and length > 0)' <<< "$PACKAGES" >/dev/null
          jq -e '.[0] | (.directory | type == "string" and test("^(packages|apps)/[A-Za-z0-9_./-]+$") and (contains("..") | not))' <<< "$PACKAGES" >/dev/null
          jq -e '.[0] | (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))' <<< "$PACKAGES" >/dev/null
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          name="$(jq -r '.[0].name' <<< "$PACKAGES")"
          directory="$(jq -r '.[0].directory' <<< "$PACKAGES")"
          version="$(jq -r '.[0].version' <<< "$PACKAGES")"
          {
            echo "name=$name"
            echo "directory=$directory"
            echo "version=$version"
            echo "release-tag=$name@$version"
          } >> "$GITHUB_OUTPUT"
          printf '## Approved release preparation\n\nPackage: `%s`\nVersion: `%s`\nMerged SHA: `%s`\n' "$name" "$version" "$APPROVED_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release approved package
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    permissions:
      contents: write
    uses: $/.github/workflows/reusable_release.yml
    with:
      show-input-summary: false
      version: ${{ needs.plan.outputs.version }}
      release-tag: ${{ needs.plan.outputs.release-tag }}
      release-name: ${{ format('{0} v{1}', needs.plan.outputs.name, needs.plan.outputs.version) }}
      changelog-file: ${{ format('{0}/CHANGELOG.md', needs.plan.outputs.directory) }}
      target-ref: ${{ github.event.pull_request.merge_commit_sha }}
      create-tag: true
      draft: false
      dry-run: ${{ inputs.dry-run }}

