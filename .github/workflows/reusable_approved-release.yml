name: "Reusable · Approved release from preparation PR"

on:
  workflow_call:
    inputs:
      expected-base:
        type: string
        default: main
      required-workflows:
        type: string
        default: ''
      dry-run:
        type: boolean
        default: false
    secrets:
      npm-token:
        required: false

permissions: {}

concurrency:
  group: approved-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify approved merged preparation
    permissions:
      contents: read
      checks: read
      actions: read
      statuses: read
      pull-requests: read
    uses: $/.github/workflows/reusable_verify-release-preparation.yml
    with:
      expected-base: ${{ inputs.expected-base }}
      required-workflows: ${{ inputs.required-workflows }}

  plan:
    name: Validate approved package matrix
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Validate selected packages
        id: packages
        env:
          PACKAGES: ${{ needs.verify.outputs.packages }}
          APPROVED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          jq -ce '
            if type != "array" or length == 0 then error("No approved release packages") else . end
            | if all(.[]; (.name | type == "string" and length > 0) and
                            (.directory | type == "string" and test("^(packages|apps)/[A-Za-z0-9_./-]+$") and (contains("..") | not)) and
                            (.version | type == "string" and test("^[0-9]+\\\\.[0-9]+\\\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))) then . else error("Invalid release package") end
            | {include: .}
          ' <<< "$PACKAGES" | { read -r matrix; echo "matrix=$matrix" >> "$GITHUB_OUTPUT"; }
          echo "## Approved release package matrix" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \\(.name)@\\(.version) (\\(.directory))"' <<< "$PACKAGES" >> "$GITHUB_STEP_SUMMARY"

  draft:
    name: "Draft · ${{ matrix.name }}@${{ matrix.version }}"
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: read
    uses: $/.github/workflows/reusable_release-drafter.yml
    with:
      show-input-summary: false
      target-branch: ${{ inputs.expected-base }}
      version: ${{ matrix.version }}
      release-tag: ${{ format('{0}@{1}', matrix.name, matrix.version) }}
      tag-prefix: ${{ format('{0}@', matrix.name) }}
      package-name: ${{ matrix.name }}
      package-directory: ${{ matrix.directory }}
      target-key: ${{ matrix.name }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-path: ${{ format('{0}/CHANGELOG.md', matrix.directory) }}
      dry-run: ${{ inputs.dry-run }}

  release:
    name: "Release · ${{ matrix.name }}@${{ matrix.version }}"
    needs: [plan, draft]
    if: ${{ always() && needs.plan.result == 'success' && needs.draft.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: write
    uses: $/.github/workflows/reusable_release.yml
    with:
      show-input-summary: false
      version: ${{ matrix.version }}
      release-tag: ${{ format('{0}@{1}', matrix.name, matrix.version) }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-file: ${{ format('{0}/CHANGELOG.md', matrix.directory) }}
      target-ref: ${{ github.event.pull_request.merge_commit_sha }}
      create-tag: true
      draft: false
      dry-run: ${{ inputs.dry-run }}
