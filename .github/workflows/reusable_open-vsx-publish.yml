name: "Reusable · Publish VS Code extension"

on:
  workflow_call:
    inputs:
      package-directory:
        description: Extension workspace directory containing package.json
        type: string
        required: true
      node-version:
        description: Node.js version
        type: string
        default: "24"
      install-command:
        description: Dependency installation command executed at repository root
        type: string
        default: npm ci --include=optional
      check-command:
        description: Repository validation command (empty to skip)
        type: string
        default: npm run check
      package-command:
        description: Command creating VSIX artifacts (empty if check-command already packages)
        type: string
        default: ""
      artifact-glob:
        description: Repository-relative path to generated VSIX files
        type: string
        required: true
      artifact-name:
        description: Uploaded artifact name
        type: string
        default: openvsx-vsix
      registry:
        description: "Configured registry alias (openvsx, marketplace) or all"
        type: string
        default: openvsx
      registries-file:
        description: Optional caller registry YAML path (overrides bundled extension registry defaults)
        type: string
        default: ""
      publish-command:
        description: Optional Open VSX publishing command (uses ovsx CLI when empty)
        type: string
        default: ""
      dry-run:
        description: Validate and upload VSIX without publishing
        type: boolean
        default: true
    secrets:
      ovsx-token:
        required: false
      vsce-token:
        required: false
      package-token:
        required: false
    outputs:
      publish-status:
        description: validated, published, or failed
        value: ${{ jobs.extension.outputs.publish-status }}
  workflow_dispatch:
    inputs:
      package-directory:
        type: string
        required: true
      artifact-glob:
        type: string
        required: true
      registry:
        type: choice
        options: [openvsx, marketplace, all]
        default: openvsx
      registries-file:
        type: string
        default: ""
      publish-command:
        type: string
        default: ""
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  extension:
    name: "job: Validate and publish VSIX"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      publish-status: ${{ steps.outcome.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version || '24' }}
      - name: Validate paths and configuration
        env:
          DIRECTORY: ${{ inputs.package-directory }}
          GLOB: ${{ inputs.artifact-glob }}
          REGISTRY: ${{ inputs.registry || 'openvsx' }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$DIRECTORY" "$GLOB"; do
            [ -n "$value" ] || { echo "::error::Package directory and VSIX path are required"; exit 1; }
            case "$value" in /*|..|../*|*/../*|*/..) echo "::error::Invalid path: $value"; exit 1;; esac
          done
          [ -f "$DIRECTORY/package.json" ] || { echo "::error::Missing $DIRECTORY/package.json"; exit 1; }
          [ -n "$REGISTRY" ] || { echo "::error::Registry selector must not be empty"; exit 1; }
      - name: Checkout bundled extension registry defaults
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: ${{ github.workflow_sha }}
          path: .github/reusable-extension-registry-config
          persist-credentials: false
          sparse-checkout: config/vscodew-registries.yml
          sparse-checkout-cone-mode: false
      - name: Resolve extension registry aliases
        id: registries
        shell: bash
        env:
          REGISTRIES_FILE: ${{ inputs.registries-file }}
          REGISTRY_SELECTION: ${{ inputs.registry || 'openvsx' }}
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -ruri <<'RUBY'
          defaults_file = '.github/reusable-extension-registry-config/config/vscodew-registries.yml'
          abort "Missing bundled extension registry defaults: #{defaults_file}" unless File.file?(defaults_file)
          requested_file = ENV.fetch('REGISTRIES_FILE', '')
          abort 'Invalid registries-file path' if requested_file.start_with?('/') || requested_file.split('/').include?('..')
          base = YAML.safe_load_file(defaults_file).fetch('registries')
          abort 'Default extension registries must be a mapping' unless base.is_a?(Hash)
          overrides = if requested_file != '' && File.file?(requested_file)
            YAML.safe_load_file(requested_file).fetch('registries', {})
          else
            {}
          end
          abort 'Caller extension registries must be a mapping' unless overrides.is_a?(Hash)
          configured = base.merge(overrides) do |key, default, override|
            abort "Registry #{key} must be a mapping" unless default.is_a?(Hash) && override.is_a?(Hash)
            default.merge(override)
          end
          supported = {
            'openvsx' => 'https://open-vsx.org',
            'marketplace' => 'https://marketplace.visualstudio.com'
          }
          configured.each do |alias_name, entry|
            abort "Unsupported extension registry alias: #{alias_name}" unless supported.key?(alias_name)
            abort "Invalid extension registry configuration for #{alias_name}" unless entry.is_a?(Hash)
            url = URI.parse(entry.fetch('url'))
            expected = URI.parse(supported.fetch(alias_name))
            abort "Unsupported registry endpoint for #{alias_name}" unless url.is_a?(URI::HTTPS) && url.host == expected.host && (url.path == '' || url.path == '/') && url.userinfo.nil? && url.query.nil? && url.fragment.nil?
            abort "enabled must be a boolean for #{alias_name}" unless [true, false].include?(entry.fetch('enabled', true))
          end
          selector = ENV.fetch('REGISTRY_SELECTION')
          selected = if selector == 'all'
            configured.select { |_, entry| entry.fetch('enabled', true) }.keys
          else
            abort "Unknown extension registry alias: #{selector}" unless configured.key?(selector)
            abort "Extension registry disabled: #{selector}" unless configured.fetch(selector).fetch('enabled', true)
            [selector]
          end
          abort 'No enabled extension registries selected' if selected.empty?
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |out|
            out.puts "openvsx=#{selected.include?('openvsx')}"
            out.puts "marketplace=#{selected.include?('marketplace')}"
            out.puts "selected=#{selected.join(',')}"
          end
          File.open(ENV.fetch('GITHUB_STEP_SUMMARY'), 'a') do |out|
            out.puts "### Resolved extension registries"
            out.puts
            out.puts "| Alias | Selected |"
            out.puts "| --- | --- |"
            configured.each_key { |name| out.puts "| #{name} | #{selected.include?(name)} |" }
            out.puts
            out.puts "Configuration: #{requested_file != '' && File.file?(requested_file) ? requested_file : 'bundled defaults'}"
          end
          RUBY
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
          COMMAND: ${{ inputs.install-command || 'npm ci --include=optional' }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Validate extension
        if: ${{ inputs.check-command != '' }}
        env:
          COMMAND: ${{ inputs.check-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Package VSIX
        if: ${{ inputs.package-command != '' }}
        env:
          COMMAND: ${{ inputs.package-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Verify VSIX output
        env:
          GLOB: ${{ inputs.artifact-glob }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=( $GLOB )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No VSIX files matched $GLOB"
            exit 1
          fi
          for file in "${files[@]}"; do
            [ -f "$file" ] && [ -s "$file" ] || { echo "::error::Empty or invalid VSIX: $file"; exit 1; }
            [[ "$file" == *.vsix ]] || { echo "::error::Expected .vsix artifact: $file"; exit 1; }
          done
          [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected one VSIX, found ${#files[@]}"; exit 1; }
          printf 'Validated %s VSIX file(s)\n' "${#files[@]}"
      - name: Upload validated VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'open-vsx-vsix' }}
          path: ${{ inputs.artifact-glob }}
          if-no-files-found: error
      - name: Check selected registry credentials
        if: ${{ !inputs.dry-run }}
        env:
          OPENVSX: ${{ steps.registries.outputs.openvsx }}
          MARKETPLACE: ${{ steps.registries.outputs.marketplace }}
          OVSX_PAT: ${{ secrets.ovsx-token }}
          VSCE_PAT: ${{ secrets.vsce-token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OPENVSX" = "true" ]; then
            [ -n "$OVSX_PAT" ] || { echo "::error::Open VSX requires ovsx-token"; exit 1; }
          fi
          if [ "$MARKETPLACE" = "true" ]; then
            [ -n "$VSCE_PAT" ] || { echo "::error::VS Code Marketplace requires vsce-token"; exit 1; }
          fi
      - name: Publish to Open VSX
        if: ${{ !inputs.dry-run && (steps.registries.outputs.openvsx == 'true') }}
        env:
          OVSX_PAT: ${{ secrets.ovsx-token }}
          COMMAND: ${{ inputs.publish-command }}
          GLOB: ${{ inputs.artifact-glob }}
          DIRECTORY: ${{ inputs.package-directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$COMMAND" ]; then
            (cd "$DIRECTORY" && bash -euo pipefail -c "$COMMAND")
          else
            shopt -s nullglob globstar
            files=( $GLOB )
            npx --yes ovsx publish "${files[0]}"
          fi
      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry-run && (steps.registries.outputs.marketplace == 'true') }}
        env:
          VSCE_PAT: ${{ secrets.vsce-token }}
          GLOB: ${{ inputs.artifact-glob }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=( $GLOB )
          npx --yes @vscode/vsce publish --packagePath "${files[0]}"
      - name: Report outcome
        id: outcome
        if: ${{ success() }}
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "status=validated" >> "$GITHUB_OUTPUT"
          else
            echo "status=published" >> "$GITHUB_OUTPUT"
          fi
      - name: Workflow summary
        if: ${{ always() }}
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          DIRECTORY: ${{ inputs.package-directory }}
          VSIX: ${{ inputs.artifact-glob }}
          REGISTRY: ${{ steps.registries.outputs.selected }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## VS Code extension publishing"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Package directory | \`%s\` |\n' "$DIRECTORY"
            printf '| VSIX artifacts | \`%s\` |\n' "$VSIX"
            printf '| Registry | \`%s\` |\\n' "$REGISTRY"
            printf '| Dry run | \`%s\` |\n' "$DRY_RUN"
            printf '| Result | **%s** |\n' "$STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
