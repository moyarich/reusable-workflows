name: CI / Actionlint
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "actions/**"
  workflow_call:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  actionlint:
    uses: $/.github/workflows/reusable_actionlint.yml
