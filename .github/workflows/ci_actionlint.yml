name: CI / Actionlint
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "actions/**"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    uses: $/.github/workflows/reusable_actionlint.yml
