name: CI
on:
  pull_request:
    paths:
      - "src/**"
      - "packages/**"
      - "actions/**"
      - "tests/**"
      - ".storybook/**"
      - "**/.storybook/**"
      - "**/*.stories.*"
      - "**/*.story.*"
      - "**/*.spec.*"
      - "**/*.specs.*"
      - "**/playwright.config.*"
      - "playwright.config.*"
      - "vitest.config.*"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.*"
      - ".prettierignore"
      - "tsconfig*.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact healed commit SHA to validate
        type: string
        required: false
        default: ""
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout-sha || github.run_id }}
  cancel-in-progress: false
jobs:
  actionlint:
    uses: $/.github/workflows/ci_actionlint.yml
  cli:
    uses: $/.github/workflows/ci_cli.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha || '' }}
  actions:
    uses: $/.github/workflows/ci_actions.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha || '' }}
  storybook:
    uses: $/.github/workflows/ci_storybook.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha || '' }}
  playwright:
    uses: $/.github/workflows/ci_playwright.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha || '' }}
