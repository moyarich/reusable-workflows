name: "Reusable · Update action major tag"

on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: Published stable semantic-version tag, such as v1.2.3.
        required: true
        type: string
  workflow_call:
    inputs:
      source-tag:
        description: Published stable semantic-version tag, such as v1.2.3.
        required: true
        type: string
    outputs:
      major-tag:
        description: Major compatibility tag that was created or updated.
        value: ${{ jobs.publish.outputs.major-tag }}

permissions: {}

jobs:
  publish:
    name: "job: Update major action tag"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      major-tag: ${{ steps.publish.outputs.major-tag }}

    steps:
      - name: Checkout reusable action implementation
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/reusable-workflows-runtime
          persist-credentials: false

      - id: publish
        name: Promote highest published stable major tag
        uses: ./.github/reusable-workflows-runtime/actions/release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: promote
          source-tag: ${{ inputs.source-tag }}
          dry-run: "false"
