name: Reusable CI / Playwright
on:
  workflow_call:
    inputs:
      checkout-sha:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
permissions:
  contents: read
  packages: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install project dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          npm_config_userconfig: ${{ runner.temp }}/playwright-npmrc
        shell: bash
        run: |
          # Authenticate only requests to GitHub Packages; keep registry selection
          # in the consuming repository's .npmrc and lockfile.
          umask 077
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$npm_config_userconfig"
          trap 'rm -f "$npm_config_userconfig"' EXIT
          npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Discover browser test configurations
        id: discover
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';

          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          const workspaces = root.workspaces
            ? JSON.parse(execFileSync('npm', ['query', '.workspace', '--json'], { encoding: 'utf8' }))
            : [];
          const directories = [...new Set(['.', ...workspaces.map(workspace => workspace.location)])];
          const extensions = ['ts', 'js', 'mts', 'mjs', 'cts', 'cjs'];
          const targets = [];
          for (const directory of directories) {
            const manifest = JSON.parse(readFileSync(join(directory, 'package.json'), 'utf8'));
            const dependencies = { ...manifest.dependencies, ...manifest.devDependencies };
            const config = (prefix) => extensions
              .map(extension => prefix + '.' + extension)
              .find(file => existsSync(join(directory, file)));
            const standalone = config('playwright.config');
            if (standalone && (dependencies.playwright || dependencies['@playwright/test'] || manifest.scripts?.['test:e2e'])) {
              targets.push({ directory, runner: 'playwright', config: standalone });
            }
            const browser = config('vitest.browser.config');
            if (browser) {
              targets.push({ directory, runner: 'vitest', config: browser });
            }
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'browser-test-targets.json'), JSON.stringify(targets));
          appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=' + (targets.length > 0) + '\n');
          console.log(targets.length ? targets : 'No browser test configurations found; skipping.');
          NODE
      - name: Install browser dependencies and run browser tests
        id: test
        if: steps.discover.outputs.enabled == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';

          const targets = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'browser-test-targets.json'), 'utf8'));
          let failed = false;
          const installed = new Set();
          for (const { directory, runner, config } of targets) {
            console.log('::group::' + runner + ' (' + directory + '/' + config + ')');
            try {
              const run = (args, capture = false) => {
                const result = spawnSync('npm', ['exec', '--no', '--', ...args], {
                  cwd: directory,
                  encoding: 'utf8',
                  stdio: capture ? ['ignore', 'pipe', 'pipe'] : 'inherit',
                });
                if (result.error) throw result.error;
                return result;
              };
              if (runner === 'playwright') {
                const list = run(['playwright', 'test', '--config', config, '--list'], true);
                const output = (list.stdout || '') + (list.stderr || '');
                console.log(output);
                if (/No tests found|Total: 0 tests/.test(output)) continue;
                if (list.status !== 0) throw new Error('Playwright test discovery failed');
              }
              // Use the project's locked Playwright version and install browser binaries
              // plus OS libraries. npm exec --no forbids downloading unpinned packages.
              if (!installed.has(directory)) {
                const install = run(['playwright', 'install', '--with-deps', 'chromium', 'firefox', 'webkit']);
                if (install.status !== 0) throw new Error('Playwright browser installation failed');
                installed.add(directory);
              }
              const args = runner === 'vitest'
                ? ['vitest', 'run', '--config', config]
                : ['playwright', 'test', '--config', config];
              if (run(args).status !== 0) throw new Error('Browser tests failed');
            } catch (error) {
              console.error('::error::' + directory + ': ' + error.message);
              failed = true;
            } finally {
              console.log('::endgroup::');
            }
          }
          if (failed) process.exitCode = 1;
          NODE
      - name: Upload failure traces
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: |
            **/test-results/
            **/playwright-report/
            **/__screenshots__/
          if-no-files-found: ignore
