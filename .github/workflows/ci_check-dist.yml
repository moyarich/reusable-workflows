name: CI / Check distribution

run-name: >-
  Check dist · ${{ github.event_name == 'push' && 'actions' || inputs.package }}

on:
  push:
    paths:
      - "packages/cli/src/**"
      - "packages/actions/actions/**"
      - "packages/actions/scripts/**"
      - "packages/actions/plugins/**"
      - "packages/cli/src/workflow-dispatch/**"
      - "packages/cli/src/verify-workflow-runs/**"
      - "packages/actions/vite.config.ts"
      - ".github/workflows/ci_cli.yml"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - "tests/**"
      - "actions/**"
      - ".github/workflows/check-dist.yml"
      - ".github/workflows/reusable_check-dist.yml"
  workflow_dispatch:
    inputs:
      package:
        description: all, package directory, or package name
        type: string
        required: true
        default: all
      dist-path:
        description: "Distribution path template. Supports {packageDir}, {package}, {packageName}, {workspace}; blank uses repository configuration or {packageDir}/dist."
        type: string
        default: ""
      build-command:
        description: Build command override (for example npm run build:cli); 
          empty uses the selected workspace build
        type: string
        default: ""
      install-command:
        description: Dependency install command
        type: string
        default: npm ci --ignore-scripts
      dry-run:
        description: Upload rebuilt artifacts, without committing or pushing
        type: boolean
        default: true
      commit:
        description: Commit updated output only when dry-run is false (single package only)
        type: boolean
        default: false
      node-caching:
        description: Node cache mode (npm or empty to disable)
        type: string
        default: npm
      include-root-package:
        description: Include buildable root package in discovery
        type: boolean
        default: false
      workspace-tools-source:
        description: Workspace Tools CLI source for discovery
        type: choice
        required: true
        default: auto
        options:
          - auto
          - checkout:current
          - checkout:upstream;branch:main
          - registry:npm:latest

permissions: {}

concurrency:
  group: dist-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check-dist:
    permissions:
      contents: write
    uses: $/.github/workflows/reusable_self-heal-check-dist.yml
    with:
      package: ${{ github.event_name == 'push' && 'packages/actions' || inputs.package }}
      dist-path: ${{ github.event_name == 'push' && 'actions/' || inputs.dist-path }}
      build-command: ${{ github.event_name == 'push' && 'npm run build:actions' || inputs.build-command }}
      install-command: ${{ github.event_name == 'push' && 'npm install --no-package-lock --no-audit --no-fund' || inputs.install-command }}
      dry-run: ${{ github.event_name != 'push' && inputs.dry-run }}
      commit: ${{ github.event_name == 'push' || inputs.commit }}
      node-caching: ${{ github.event_name == 'push' && '' || inputs.node-caching }}
      include-root-package: ${{ inputs.include-root-package }}
      workspace-tools-source: ${{ github.event_name == 'push' && 'auto' || inputs.workspace-tools-source }}
      validation-command: ${{ github.event_name == 'push' && 'test -f actions/setup-workspace-tools/action.yml && test -f actions/setup-workspace-tools/index.mjs && test -f actions/release-draft-sync/action.yml && test -f actions/parse-typed-inputs/action.yml && test -f actions/validate-package-changelogs/action.yml' || '' }}
