name: "Reusable · Move Release Tag"

on:
  workflow_call:
    inputs:
      tag:
        description: Exact release tag to create or move
        type: string
        required: true
      commit:
        description: Full commit SHA the tag must point to
        type: string
        required: true
      target-branch:
        description: Branch to check out for tag verification
        type: string
        required: false
        default: main
      require-branch-head:
        description: Reject tag movement if target branch HEAD no longer equals the resolved commit
        type: boolean
        required: false
        default: false
      dry-run:
        description: Preview without modifying the tag
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  move-tag:
    name: "job: Move release tag"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      DRY_RUN: ${{ inputs.dry-run }}
      REQUIRE_BRANCH_HEAD: ${{ inputs.require-branch-head }}
    steps:
      - name: Checkout reusable release-tag action
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/reusable-workflows-runtime
          persist-credentials: false

      - name: Restore exact canonical release tag
        uses: ./.github/reusable-workflows-runtime/actions/release-tag
        with:
          mode: restore
          tag: ${{ inputs.tag }}
          commit: ${{ inputs.commit }}
          target-branch: ${{ inputs.target-branch }}
          require-branch-head: ${{ inputs.require-branch-head }}
          dry-run: ${{ inputs.dry-run }}
