name: CI / GitHub Actions bundles
on:
  push:
    branches: [main]
    paths:
      - "actions/**"
      - "packages/actions/**"
      - "packages/cli/**"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_actions.yml"
  pull_request:
    paths:
      - "actions/**"
      - "packages/actions/**"
      - "packages/cli/**"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_actions.yml"
  workflow_call:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout-sha || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Recreate actions from empty distribution
        id: build-actions
        shell: bash
        run: |
          set -euo pipefail
          # Preserve authored action.yml metadata while regenerating distributions.
          npm run build:actions
          # Authored source files must survive Vite cleanup and regeneration.
          git diff --exit-code -- packages/cli/src/ packages/actions/actions/ packages/actions/scripts/
          git diff --exit-code -- actions/
          if [[ -n "$(git ls-files --others --exclude-standard -- actions/)" ]]; then
            echo "::error::Action build created untracked generated files. Commit regenerated actions/."
            git ls-files --others --exclude-standard -- actions/
            exit 1
          fi

      - name: Verify generated action entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -f actions/setup-workspace-tools/index.mjs
          test -f actions/release-draft-sync/index.mjs
          test -f actions/validate-release-identity/index.mjs
          test -f actions/check-dist/action.yml
          test -f actions/resolve-workspaces/action.yml
