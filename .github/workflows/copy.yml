name: Copy canonical workflow callers
run-name: >-
  Copy callers · ${{ inputs.repository == 'all' && 'all destinations' || inputs.repository }} · ${{ inputs.dry-run && 'preview' || 'open PRs' }}

on:
  workflow_dispatch:
    inputs:
      # Keep this list synchronized with .github/copy-files-config.yml.
      # workflow_dispatch choice options are static; GitHub does not support dynamic choices.
      repository:
        description: Copy to all configured destinations, or select one repository
        type: choice
        required: true
        default: all
        options:
          - all
          - moyarich/github_emulator
          - moyarich/moyaforge
          - moyarich/autofilename
          - moyarich/colorshower
          - moyarich/workspace-tools
          - moyarich/css-expand-collapse
          - moyarich/console
          - moyarich/JotebookSync
          - moyarich/vscode-act-runner-local
          - moyarich/dev-toolkit
          - moyarich/vscode-dev-toolkit
          - moyarich/css-color-parser
          - moyarich/vscode-dependency-links
          - moyarich/vue-webview-vite
          - moyarich/pointer-bubble
          - moyarich/css-modules-kit
      dry-run:
        description: Preview changes; do not create destination pull requests
        type: boolean
        required: true
        default: true
      confirm-all:
        description: 'Required to open PRs in ALL destinations (ignored for previews or one repository)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Never cancel an in-flight propagation, even if a second dispatch starts.
concurrency:
  group: copy-canonical-workflow-callers
  cancel-in-progress: false

jobs:
  validate:
    name: Validate copy scope
    runs-on: ubuntu-latest
    steps:
      - name: Validate destination and require confirmation for bulk writes
        env:
          REPOSITORY: ${{ inputs.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
          CONFIRM_ALL: ${{ inputs.confirm-all }}
        shell: bash
        run: |
          if [[ "$DRY_RUN" != "true" && "$REPOSITORY" == "all" && "$CONFIRM_ALL" != "true" ]]; then
            echo "::error::To open PRs for every configured destination, rerun with confirm-all enabled. Otherwise select a single repository or use dry-run."
            exit 1
          fi
          {
            echo "### Workflow caller synchronization"
            echo "- Destination: $([[ "$REPOSITORY" == all ]] && echo 'all configured repositories' || echo "$REPOSITORY")"
            echo "- Mode: $([[ "$DRY_RUN" == "true" ]] && echo 'preview only' || echo 'create/update pull requests')"
          } >> "$GITHUB_STEP_SUMMARY"

  copy:
    name: Synchronize selected destinations
    needs: validate
    uses: ./.github/workflows/reusable_copy-files-to-another-repository.yml
    with:
      repository: ${{ inputs.repository == 'all' && '' || inputs.repository }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      workflow-token: ${{ secrets._WORKFLOW_TOKEN }}
