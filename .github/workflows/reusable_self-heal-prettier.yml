name: "Reusable · self-heal · Prettier"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check formatting without changes, or fix it in the runner
        required: false
        default: fix
        type: string
      prettier-config:
        description: Use this repository's Prettier rules or the reusable-workflows reference rules
        required: true
        default: this-repository
        type: choice
        options:
          - this-repository
          - reusable-workflows
      commit:
        description: Commit Prettier changes
        required: true
        default: true
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    outputs:
      healed-sha:
        description: Checked-out or committed branch SHA at end of repair
        value: ${{ jobs.format.outputs.healed-sha }}
    inputs:
      checkout-sha:
        description: Commit SHA to validate in check mode
        type: string
        default: ""
      expected-sha:
        description: Require the checked-out branch to equal the prior repair commit
        required: false
        default: ""
        type: string
      mode:
        description: Check formatting without changes, or fix it in the runner
        required: false
        default: fix
        type: string
      prettier-config:
        description: Use this repository's Prettier rules or the reusable-workflows reference rules
        required: false
        default: this-repository
        type: string
      commit:
        description: Commit Prettier changes
        required: false
        default: true
        type: boolean
      node-version:
        description: Node.js version
        required: false
        default: "24"
        type: string

permissions:
  contents: write

jobs:
  format:
    outputs:
      healed-sha: ${{ steps.head.outputs.sha }}
    name: "Prettier self-heal"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.mode == 'check' && (inputs.checkout-sha || github.event.pull_request.head.sha || github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name) }}
          persist-credentials: ${{ inputs.mode == 'fix' && inputs.commit }}
          fetch-depth: 1

      - name: Verify branch has not moved after prior repair
        if: ${{ inputs.expected-sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::Branch advanced since previous repair; restart self-heal"
            exit 1
          }
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci --ignore-scripts

      - name: Resolve installed Prettier
        id: prettier
        shell: bash
        run: |
          set -euo pipefail
          test -x node_modules/.bin/prettier || { echo "::error::Prettier must be installed by npm ci"; exit 1; }
          echo "version=$(node_modules/.bin/prettier --version)" >> "$GITHUB_OUTPUT"

      - name: Resolve Prettier configuration and ignores
        id: config
        env:
          SOURCE: ${{ inputs.prettier-config }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IGNORE_FILE="$GITHUB_WORKSPACE/.prettier-self-heal.ignore"
          : > "$IGNORE_FILE"
          if [ -f .prettierignore ]; then
            cat .prettierignore > "$IGNORE_FILE"
            printf '\n' >> "$IGNORE_FILE"
          fi
          printf '%s\n' '.github/workflows/' 'dist/' '.prettier-self-heal.ignore' >> "$IGNORE_FILE"
          echo "ignore-file=$IGNORE_FILE" >> "$GITHUB_OUTPUT"
          case "$SOURCE" in
            this-repository)
              echo "config-file=" >> "$GITHUB_OUTPUT"
              ;;
            reusable-workflows)
              CONFIG_FILE="$RUNNER_TEMP/shared-prettier.json"
              SHARED_REF="${WORKFLOW_REF##*@}"
              [ -n "$SHARED_REF" ] || { echo "::error::Reusable workflow ref is missing"; exit 1; }
              gh api "repos/moyarich/reusable-workflows/contents/.github/reusable-configurations/.prettierrc.json?ref=$SHARED_REF" --jq '.content' | base64 --decode > "$CONFIG_FILE"
              echo "config-file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::prettier-config must be this-repository or reusable-workflows"
              exit 1
              ;;
          esac

      - name: Run Prettier
        id: format
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="${{ steps.config.outputs.config-file }}"
          CONFIG_ARGS=()
          if [ -n "$CONFIG_FILE" ]; then CONFIG_ARGS+=(--config "$CONFIG_FILE"); fi
          case "$MODE" in
            check|fix) ;;
            *) echo "::error::mode must be check or fix"; exit 1 ;;
          esac
          if node_modules/.bin/prettier . --check \
            --ignore-path "${{ steps.config.outputs.ignore-file }}" \
            "${CONFIG_ARGS[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formatting already matches Prettier."
            exit 0
          fi
          if [[ "$MODE" == check ]]; then
            echo "::error::Formatting differs from Prettier. Run self-heal in fix mode."
            exit 1
          fi
          echo "Prettier drift detected; applying formatting fixes."
          node_modules/.bin/prettier . --write \
            --ignore-path "${{ steps.config.outputs.ignore-file }}" \
            "${CONFIG_ARGS[@]}"
          git status --short -- . ':!.github/workflows/**' ':!dist/**' ':!.prettier-self-heal.ignore' > /tmp/format-status.txt
          if [ -s /tmp/format-status.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Prettier changes
        if: ${{ inputs.mode == 'fix' && inputs.commit && steps.format.outputs.changed == 'true' }}
        shell: bash
        env:
          TARGET_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The GitHub token cannot update workflow files. Protect these paths.
          git add --all -- . ':!.github/workflows/**' ':!dist/**' ':!.prettier-self-heal.ignore'
          if git diff --cached --quiet; then
            echo "No permitted formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format repository"
          TARGET_REF="$TARGET_REF"

          # Another commit may reach the branch while Prettier is running.
          # Preserve those commits; never force-push or overwrite the branch.
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/$TARGET_REF"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Prettier changes conflict with newer commits on $TARGET_REF. Resolve them on the branch and rerun."
              exit 1
            fi

            if git push origin "HEAD:refs/heads/$TARGET_REF"; then
              echo "Prettier changes pushed on attempt $attempt."
              exit 0
            fi

            echo "::warning::Branch $TARGET_REF moved during push (attempt $attempt/3); retrying against its latest head."
          done

          echo "::error::Could not push Prettier changes after 3 attempts because $TARGET_REF keeps moving."
          exit 1

      - name: Record final commit SHA
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Format summary
        if: ${{ always() }}
        shell: bash
        env:
          SUMMARY_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          {
            echo "# Prettier self-heal"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Node.js | `%s` |\n' "${{ inputs.node-version || '24' }}"
            printf '| Mode | %s |\n' "${{ inputs.mode }}"
            printf '| Configuration source | %s |\n' "${{ inputs.prettier-config }}"
            printf '| Prettier | `%s` |\n' "${{ steps.prettier.outputs.version || 'unknown' }}"
            printf '| Commit requested | **%s** |\n' "${{ inputs.commit }}"
            printf '| Branch | `%s` |\n' "$SUMMARY_REF"
            echo "| Changes detected | **${{ steps.format.outputs.changed || 'unknown' }}** |"

            echo "| Result | **${{ job.status }}** |"

            if [ -s /tmp/format-status.txt ]; then
              echo
              echo "## Prettier changes"
              echo
              echo '~~~text'
              cat /tmp/format-status.txt
              echo '~~~'

              if [ "${{ inputs.commit }}" != "true" ]; then
                echo
                echo "> [!NOTE]"
                echo "> Preview only. Prettier changes were written in the runner but not committed."
              fi
            else
              echo
              echo "No Prettier changes were required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

