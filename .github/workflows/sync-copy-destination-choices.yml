name: Sync copier destination choices

on:
  push:
    branches: [main]
    paths:
      - .github/copy-files-config.yml
      - .github/workflows/copy.yml
      - packages/cli/src/workflow-choices/**
      - packages/cli/src/bin/sync-workflow-choices.ts
      - .github/workflows/sync-copy-destination-choices.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-copy-destination-choices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Update workflow choices from destination inventory
        run: >-
          node --experimental-strip-types
          packages/cli/src/bin/sync-workflow-choices.ts
          --config .github/copy-files-config.yml
          --workflow .github/workflows/copy.yml
          --input repository
      - name: Format workflow
        run: npx --no-install prettier --write .github/workflows/copy.yml
      - name: Commit synchronization
        env:
          WORKFLOW_TOKEN: ${{ secrets._WORKFLOW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/copy.yml; then
            echo "Workflow choices already match destination inventory"
            exit 0
          fi
          if [[ -z "$WORKFLOW_TOKEN" ]]; then
            echo "::error::Missing _WORKFLOW_TOKEN with contents and workflow write permissions"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/copy.yml
          git commit -m 'chore(actions): sync copy destination choices'
          auth="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
