name: "Self-test · Release draft"

on:
  pull_request:
    paths:
      - ".github/workflows/reusable_release-drafter.yml"
      - ".github/workflows/_self-test_release-draft.yml"
      - "actions/release-draft-sync/**"
      - "actions/validate-release-identity/**"
      - "actions/_assets/**"
      - "packages/cli/tests/release-identity-marker.test.mjs"
      - "tests/release-draft-auto-version.test.mjs"
      - ".github/workflows/release-draft.yml"
      - ".github/release-drafter-template.yml"
      - "CHANGELOG.md"
  push:
    paths:
      - ".github/workflows/reusable_release-drafter.yml"
      - ".github/workflows/_self-test_release-draft.yml"
      - "actions/release-draft-sync/**"
      - "actions/validate-release-identity/**"
      - "packages/cli/tests/release-identity-marker.test.mjs"
      - "tests/release-draft-auto-version.test.mjs"
      - ".github/workflows/release-draft.yml"
      - ".github/release-drafter-template.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions: {}

jobs:
  release-drafter:
    name: Reusable release drafter
    permissions:
      contents: write
      pull-requests: read
    uses: $/.github/workflows/reusable_release-drafter.yml
    with:
      target-branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
      initial-version: "0.1.0"
      tag-prefix: "self-test-v"
      release-name: "Release Drafter Self-Test v{{VERSION}}"
      changelog-path: CHANGELOG.md
      template-path: .github/release-drafter-template.yml
      target-key: release-drafter-self-test
      dry-run: true

  release-contracts:
    name: Release marker and version contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - run: npx --no-install vitest run packages/cli/tests/release-identity-marker.test.mjs tests/release-draft-auto-version.test.mjs
        id: contracts
      - name: Write contract summary
        if: always()
        env:
          RESULT: ${{ steps.contracts.outcome }}
        run: |
          echo '## Release identity and version contracts' >> "$GITHUB_STEP_SUMMARY"
          echo "| Vitest contracts | $RESULT |" >> "$GITHUB_STEP_SUMMARY"

  aggregate-summary:
    name: Release draft self-test result
    needs: [release-drafter, release-contracts]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record release draft results
        env:
          DRAFTER: ${{ needs.release-drafter.result }}
          CONTRACTS: ${{ needs.release-contracts.result }}
        run: |
          {
            echo "## Release draft self-test"
            echo
            echo "| Contract | Result |"
            echo "| --- | --- |"
            echo "| Reusable release drafter (dry run) | $DRAFTER |"
            echo "| Identity and version contracts | $CONTRACTS |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$DRAFTER" = success && test "$CONTRACTS" = success
