name: Reusable · self-heal · Check distributions

on:
  workflow_call:
    inputs:
      package:
        type: string
        default: all
      dist-path:
        type: string
        default: ""
      config-path:
        type: string
        default: .github/check-dist-config.yml
      build-command:
        type: string
        default: ""
      install-command:
        type: string
        default: npm ci --ignore-scripts
      dry-run:
        type: boolean
        default: true
      commit:
        type: boolean
        default: false
      node-caching:
        type: string
        default: npm
      include-root-package:
        type: boolean
        default: false
      workspace-tools-source:
        type: string
        default: auto
      validation-command:
        type: string
        default: ""
      checkout-sha:
        type: string
        default: ""
      target-branch:
        type: string
        default: ""
      expected-sha:
        type: string
        default: ""
      node-version:
        type: string
        default: "24"
      artifact-name:
        type: string
        default: ""

permissions: {}

jobs:
  discover-packages:
    name: Discover workspace packages
    permissions:
      contents: read
    uses: 
      $/.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: packages
      use-workspaces: true
      require-build-script: true
      include-private: true
      include-root-package: ${{ inputs.include-root-package }}
      workspace-tools-source: ${{ inputs.workspace-tools-source }}

  select-packages:
    name: Select distributions
    needs: discover-packages
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-packages: ${{ steps.select.outputs.has-packages }}
      single-package: ${{ steps.select.outputs.single-package }}
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select and validate distribution packages
        id: select
        uses: $/actions/check-dist
        with:
          discovered: ${{ needs.discover-packages.outputs.packages }}
          package: ${{ inputs.package }}
          dist-path: ${{ inputs.dist-path }}
          config-path: ${{ inputs.config-path }}
          build-command: ${{ inputs.build-command }}

  check-dist:
    name: "dist: ${{ matrix.name }}"
    needs: select-packages
    if: ${{ needs.select-packages.outputs.has-packages == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-packages.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      healed-sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target commit
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          TARGET_BRANCH: ${{ inputs.target-branch || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH" || { echo "::error::Missing repair target branch"; exit 1; }
          if [[ -n "$EXPECTED_SHA" && "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::Branch moved since dispatch"
            exit 1
          fi

      - name: Resolve distribution template
        id: resolve
        shell: bash
        env:
          DIST_TEMPLATE: ${{ matrix.distTemplate }}
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const template = process.env.DIST_TEMPLATE;
          const name = process.env.PACKAGE_NAME;
          const dir = process.env.PACKAGE_DIRECTORY.replace(/\\/g, '/').replace(/\/$/, '');
          const parts = dir.split('/').filter(Boolean);
          const vars = {
            package: name ? name.split('/').pop() : (parts.at(-1) || ''),
            packageName: name,
            packageDir: dir || '.',
            workspace: parts.length > 1 ? parts[0] : '.',
          };
          const expanded = template.replace(/\{([^{}]+)\}/g, (_, key) => {
            if (!(key in vars) || !vars[key]) throw Error('Unsupported or missing distribution placeholder: ' + key);
            return vars[key];
          });
          if (/[{}]/.test(expanded) || path.isAbsolute(expanded) || expanded.split(/[\\/]+/).includes('..')) {
            throw Error('Distribution path must be a safe repository-relative directory: ' + expanded);
          }
          const normalized = path.posix.normalize(expanded.replace(/\\/g, '/'));
          if (normalized === '.' || normalized.startsWith('../') || normalized.startsWith('/')) {
            throw Error('Invalid distribution directory: ' + normalized);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dist-path=' + normalized + '\n');
          console.log('Resolved distribution path: ' + normalized);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-caching }}

      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Rebuild distribution
        env:
          BUILD_COMMAND: ${{ matrix.buildCommand }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Compare distribution
        id: compare
        env:
          DIST_PATH: ${{ steps.resolve.outputs.dist-path }}
          COMMIT_DIST: ${{ matrix.commitDist }}
          REPAIR: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DIST_PATH" || "$DIST_PATH" == /* || "$DIST_PATH" == *..* || ! -d "$DIST_PATH" ]]; then
            echo "::error::dist-path must be an existing safe relative directory"
            exit 1
          fi
          if [[ "$COMMIT_DIST" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CI-only distribution: build output exists; Git comparison skipped."
            exit 0
          fi
          git add -f -- "$DIST_PATH"
          if git diff --cached --quiet -- "$DIST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Distribution matches committed output."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- "$DIST_PATH"
            if [[ "$REPAIR" != "true" ]]; then
              echo "::error::Distribution differs from committed output."
              exit 1
            fi
          fi

      - name: Validate rebuilt distribution
        if: inputs.validation-command != ''
        env:
          VALIDATION_COMMAND: ${{ inputs.validation-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Commit regenerated distribution
        if: ${{ matrix.commitDist && inputs.commit && !inputs.dry-run && needs.select-packages.outputs.single-package == 'true' && steps.compare.outputs.changed == 'true' }}
        env:
          TARGET_BRANCH: ${{ inputs.target-branch || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update action distribution"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Record verified SHA
        id: head
        env:
          TARGET_BRANCH: ${{ inputs.target-branch || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_CHANGES: ${{ matrix.commitDist && inputs.commit && !inputs.dry-run && needs.select-packages.outputs.single-package == 'true' }}
          CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          remote=""
          if [[ "$COMMIT_CHANGES" == "true" ]]; then
            remote="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_BRANCH" --jq .sha)"
          fi
          if [[ "$COMMIT_CHANGES" == "true" && "$remote" != "$sha" ]]; then
            echo "::error::Target branch advanced during distribution repair"
            exit 1
          fi
          if [[ "$COMMIT_CHANGES" != "true" && "$CHANGED" == "true" ]]; then
            echo "Preview mode: distribution differs and was not committed."
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload rebuilt dist
        if: ${{ always() && steps.resolve.outputs.dist-path != '' && (!matrix.commitDist || !(inputs.commit && !inputs.dry-run && needs.select-packages.outputs.single-package == 'true') || (steps.compare.outputs.changed == 'true' && failure())) }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name || format('dist-{0}', matrix.artifactSuffix) }}
          path: ${{ steps.resolve.outputs.dist-path }}
          if-no-files-found: error

      - name: Distribution summary
        if: always()
        env:
          CHANGED: ${{ steps.compare.outputs.changed || 'unknown' }}
          RESULT: ${{ job.status }}
          REPAIR: ${{ true }}
          COMMIT: ${{ matrix.commitDist && inputs.commit && !inputs.dry-run && needs.select-packages.outputs.single-package == 'true' }}
          COMMIT_DIST: ${{ matrix.commitDist }}
          SHA: ${{ steps.head.outputs.sha }}
          RESOLVED_PATH: ${{ steps.resolve.outputs.dist-path }}
        run: |
          {
            echo "## Distribution verification"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Distribution path | $RESOLVED_PATH |"
            echo "| Repair mode | $REPAIR |"
            echo "| Commit distribution | $COMMIT_DIST |"
            echo "| Distribution changed | $CHANGED |"
            echo "| Commit requested | $COMMIT |"
            echo "| Result | $RESULT |"
            if [[ -n "$SHA" ]]; then echo "| Verified SHA | \`$SHA\` |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
