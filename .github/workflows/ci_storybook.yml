name: CI / Storybook
on:
  push:
    branches: [main]
    paths:
      - ".storybook/**"
      - "**/.storybook/**"
      - "**/*.stories.*"
      - "**/*.story.*"
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_storybook.yml"
  pull_request:
    paths:
      - ".storybook/**"
      - "**/.storybook/**"
      - "**/*.stories.*"
      - "**/*.story.*"
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_storybook.yml"
  workflow_call:
    inputs:
      checkout-sha:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate (e.g. after self-heal)
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout-sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  storybook:
    uses: $/.github/workflows/reusable_ci_storybook.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha }}
