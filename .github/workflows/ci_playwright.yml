name: CI / Playwright
on:
  push:
    branches: [main]
    paths:
      - "**/*.spec.*"
      - "**/*.specs.*"
      - "**/playwright.config.*"
      - "playwright.config.*"
      - ".github/workflows/ci_playwright.yml"
  pull_request:
    paths:
      - "**/*.spec.*"
      - "**/*.specs.*"
      - "**/playwright.config.*"
      - "playwright.config.*"
      - ".github/workflows/ci_playwright.yml"
  workflow_call:
    inputs:
      checkout-sha:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate (e.g. after self-heal)
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  playwright:
    uses: $/.github/workflows/reusable_ci_playwright.yml
    with:
      checkout-sha: ${{ inputs.checkout-sha }}
