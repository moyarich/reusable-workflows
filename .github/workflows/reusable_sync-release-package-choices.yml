name: "Reusable · Sync release package choices"

on:
  workflow_call:
    inputs:
      workflow-file:
        description: Caller workflow to update
        type: string
        required: false
        default: .github/workflows/release.yml
      workflow-files:
        description: JSON array of workflow files to synchronize
        type: string
        required: false
        default: "[]"
      packages-directory:
        type: string
        required: false
        default: packages
      use-workspaces:
        type: boolean
        required: false
        default: true
      workspace-tools-source:
        type: string
        required: false
        default: auto
      require-publish-config:
        description: Require publishConfig for npm choices (opt-in; npm does not require it).
        type: boolean
        required: false
        default: false
      include-private-release:
        description: Include private packages in GitHub Release selectors.
        type: boolean
        required: false
        default: false

    secrets:
      workflow-token:
        description: Token with permission to modify GitHub Actions workflow files
        required: false

permissions: {}

concurrency:
  group: sync-release-package-choices-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify workflow authorization token
    runs-on: ubuntu-latest
    steps:
      - name: Require workflow-token
        shell: bash
        env:
          WORKFLOW_TOKEN: ${{ secrets.workflow-token }}
        run: |
          if [[ -z "$WORKFLOW_TOKEN" ]]; then
            echo "::error title=Missing workflow-token::Pass a workflow-authorized token through the caller workflow secrets.workflow-token (for example secrets._WORKFLOW_TOKEN). It needs permission to modify GitHub Actions workflow files."
            exit 1
          fi

  discover-release:
    needs: preflight
    permissions:
      contents: read
    uses: $/.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: ${{ inputs.packages-directory }}
      workspace-tools-source: ${{ inputs.workspace-tools-source }}
      use-workspaces: ${{ inputs.use-workspaces }}
      require-publish-config: false
      include-private: ${{ inputs.include-private-release }}
      write-summary: false

  discover-publish:
    needs: preflight
    permissions:
      contents: read
    uses: $/.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: ${{ inputs.packages-directory }}
      workspace-tools-source: ${{ inputs.workspace-tools-source }}
      use-workspaces: ${{ inputs.use-workspaces }}
      require-publish-config: ${{ inputs.require-publish-config }}
      include-private: false
      write-summary: false

  sync:
    name: Update manual release package choices
    needs: [discover-release, discover-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Checkout reusable workflow CLI sources
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: main
          path: .workflow-cli
          persist-credentials: false

      - name: Install YAML tooling
        run: npm ci --prefix .workflow-cli --no-audit --no-fund

      - name: Sync selected workflow choices
        id: choices
        shell: bash
        env:
          RELEASE_PACKAGES_JSON: ${{ needs.discover-release.outputs.packages }}
          PUBLISH_PACKAGES_JSON: ${{ needs.discover-publish.outputs.packages }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          WORKFLOW_FILES: ${{ inputs.workflow-files }}
        run: node --experimental-strip-types .workflow-cli/packages/cli/src/bin/sync-release-choices.ts

      - name: Format updated workflow selectors
        if: steps.choices.outcome == 'success'
        shell: bash
        env:
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          WORKFLOW_FILES: ${{ inputs.workflow-files }}
        run: |
          set -euo pipefail
          mapfile -t files < <(python3 -c 'import json,os; print(*(json.loads(os.environ["WORKFLOW_FILES"]) or [os.environ["WORKFLOW_FILE"]]), sep=chr(10))')
          present=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              present+=("$file")
            else
              echo "::notice title=Workflow skipped::Configured workflow file '$file' does not exist; skipping."
            fi
          done
          if [ "${#present[@]}" -gt 0 ]; then
            npx --yes prettier@3.6.2 --write "${present[@]}"
          else
            echo "::notice title=No workflows to format::All configured workflow files are missing; formatting skipped."
          fi

      - name: Commit changed package choices
        id: commit
        shell: bash
        env:
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          WORKFLOW_FILES: ${{ inputs.workflow-files }}
          WORKFLOW_TOKEN: ${{ secrets.workflow-token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["WORKFLOW_FILES"]) or [os.environ["WORKFLOW_FILE"]]))')
          if git diff --quiet -- "${files[@]}"; then
            echo "Package choices are already up to date"
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo '::error::A workflow-authorized token is required to update .github/workflows/*.yml. Configure a fine-grained PAT with Contents and Workflows read/write permissions (or classic PAT with repo and workflow scopes) in the caller secret and pass it as workflow-token.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore(actions): synchronize release package choices"
          authorization="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:main
          echo "result=updated" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package synchronization summary
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_PACKAGES_JSON: ${{ needs.discover-release.outputs.packages }}
          PUBLISH_PACKAGES_JSON: ${{ needs.discover-publish.outputs.packages }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          WORKFLOW_FILES: ${{ inputs.workflow-files }}
          DISCOVER_RELEASE_STATUS: ${{ needs.discover-release.result }}
          DISCOVER_PUBLISH_STATUS: ${{ needs.discover-publish.result }}
          UPDATE_STATUS: ${{ steps.choices.outcome }}
          COMMIT_STATUS: ${{ steps.commit.outcome }}
          SYNC_RESULT: ${{ steps.commit.outputs.result }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: node --experimental-strip-types .workflow-cli/packages/cli/src/bin/sync-release-summary.ts
