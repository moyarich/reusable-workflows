name: "Reusable · Sync release package choices"

on:
  workflow_call:
    inputs:
      workflow-file:
        description: Caller workflow to update
        type: string
        required: false
        default: .github/workflows/release.yml
      workflow-files:
        description: JSON array of workflow files to synchronize
        type: string
        required: false
        default: "[]"
      packages-directory:
        type: string
        required: false
        default: packages
      use-workspaces:
        type: boolean
        required: false
        default: true
      workspace-tools-source:
        type: string
        required: false
        default: registry:npm:latest
      require-publish-config:
        type: boolean
        required: false
        default: true

    secrets:
      workflow-token:
        description: Token with permission to modify GitHub Actions workflow files
        required: false

permissions: {}

concurrency:
  group: sync-release-package-choices-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify workflow authorization token
    runs-on: ubuntu-latest
    steps:
      - name: Require workflow-token
        shell: bash
        env:
          WORKFLOW_TOKEN: ${{ secrets.workflow-token }}
        run: |
          if [[ -z "$WORKFLOW_TOKEN" ]]; then
            echo "::error title=Missing workflow-token::Pass a workflow-authorized token through the caller workflow secrets.workflow-token (for example secrets._WORKFLOW_TOKEN). It needs permission to modify GitHub Actions workflow files."
            exit 1
          fi

  discover:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: ${{ inputs.packages-directory }}
      workspace-tools-source: ${{ inputs.workspace-tools-source }}
      use-workspaces: ${{ inputs.use-workspaces }}
      require-publish-config: ${{ inputs.require-publish-config }}

  sync:
    name: Update manual release package choices
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Install YAML parser
        run: python3 -m pip install --quiet 'ruamel.yaml>=0.18,<0.20'

      - name: Sync selected workflow choices
        id: choices
        shell: bash
        env:
          PACKAGES_JSON: ${{ needs.discover.outputs.packages }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          WORKFLOW_FILES: ${{ inputs.workflow-files }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from ruamel.yaml import YAML

          files = json.loads(os.environ["WORKFLOW_FILES"]) or [os.environ["WORKFLOW_FILE"]]
          packages = json.loads(os.environ["PACKAGES_JSON"])["included"]
          if not packages:
              raise SystemExit("Refusing to erase choices: no publishable packages found")
          directories = sorted({package["directory"] for package in packages})
          options = ["all", *directories]
          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.indent(mapping=2, sequence=4, offset=2)

          for filename in files:
              path = Path(filename)
              if (not isinstance(filename, str) or path.is_absolute()
                      or ".." in path.parts or path.suffix not in (".yml", ".yaml")
                      or path.parts[:2] != (".github", "workflows")):
                  raise SystemExit(f"Invalid workflow path: {filename}")
              original = path.read_text(encoding="utf-8")
              workflow = yaml.load(original)
              try:
                  package_input = workflow["on"]["workflow_dispatch"]["inputs"]["package"]
              except (KeyError, TypeError):
                  raise SystemExit(f"Missing workflow_dispatch.inputs.package: {filename}")
              if not isinstance(package_input, dict):
                  raise SystemExit(f"Invalid package input: {filename}")
              if (package_input.get("description") == "Select a publishable workspace package"
                      and package_input.get("required") is True
                      and package_input.get("type") == "choice"
                      and package_input.get("default") == "all"
                      and list(package_input.get("options", [])) == options):
                  print(f"Already current: {filename}")
                  continue
              package_input["description"] = "Select a publishable workspace package"
              package_input["required"] = True
              package_input["type"] = "choice"
              package_input["default"] = "all"
              package_input["options"] = options

              from io import StringIO
              stream = StringIO()
              yaml.dump(workflow, stream)
              updated = stream.getvalue()
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated {filename}: {', '.join(options)}")
              else:
                  print(f"Already current: {filename}")
          PY

      - name: Commit changed package choices
        id: commit
        shell: bash
        env:
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          WORKFLOW_FILES: ${{ inputs.workflow-files }}
          WORKFLOW_TOKEN: ${{ secrets.workflow-token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["WORKFLOW_FILES"]) or [os.environ["WORKFLOW_FILE"]]))')
          if git diff --quiet -- "${files[@]}"; then
            echo "Package choices are already up to date"
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo '::error::A workflow-authorized token is required to update .github/workflows/*.yml. Configure a fine-grained PAT with Contents and Workflows read/write permissions (or classic PAT with repo and workflow scopes) in the caller secret and pass it as workflow-token.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore(actions): synchronize release package choices"
          authorization="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:main
          echo "result=updated" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package synchronization summary
        if: ${{ always() }}
        shell: bash
        env:
          PACKAGES_JSON: ${{ needs.discover.outputs.packages }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
          WORKFLOW_FILES: ${{ inputs.workflow-files }}
          DISCOVER_STATUS: ${{ needs.discover.result }}
          UPDATE_STATUS: ${{ steps.choices.outcome }}
          COMMIT_STATUS: ${{ steps.commit.outcome }}
          SYNC_RESULT: ${{ steps.commit.outputs.result }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          def parse_json(value, fallback):
              try:
                  return json.loads(value)
              except (ValueError, TypeError):
                  return fallback

          packages = parse_json(os.environ.get("PACKAGES_JSON"), {}).get("included", [])
          files = parse_json(os.environ.get("WORKFLOW_FILES"), []) or [os.environ["WORKFLOW_FILE"]]
          result = os.environ.get("SYNC_RESULT") or "failed or skipped"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("# Release package choice synchronization\n\n")
              output.write(f"**Result:** {result}\n\n")
              output.write("| Stage | Status |\n| --- | --- |\n")
              for stage, key in [("Discovery", "DISCOVER_STATUS"), ("Update workflow choices", "UPDATE_STATUS"), ("Commit and push", "COMMIT_STATUS")]:
                  output.write(f"| {stage} | {os.environ.get(key, 'unknown')} |\n")
              output.write(f"\n**Publishable packages:** {len(packages)}\n\n")
              output.write("| Package | Directory | Version |\n| --- | --- | --- |\n")
              for package in packages:
                  output.write(f"| `{package.get('name', '')}` | `{package.get('directory', '')}` | `{package.get('version', '')}` |\n")
              output.write("\n**Updated selectors:**\n\n")
              for filename in files:
                  output.write(f"- `{filename}`\n")
              if os.environ.get("COMMIT_SHA"):
                  output.write(f"\n**Commit:** `{os.environ['COMMIT_SHA']}`\n")
          PY
