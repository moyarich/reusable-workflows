name: Reusable · Copy files to another repository

on:
  workflow_call:
    inputs:
      repository:
        type: string
        default: ''
      workflow:
        description: Optional canonical workflow filename (empty means all)
        type: string
        default: ''
      dry-run:
        type: boolean
        default: true
      mode:
        type: string
        default: pull-request
    secrets:
      workflow-token:
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Optional destination repository
        type: string
        default: ''
      workflow:
        description: Optional canonical workflow filename
        type: string
        default: ''
      dry-run:
        description: Preview changes without writing to destinations
        type: boolean
        default: true
      mode:
        description: Create pull requests or update destination branches
        type: choice
        default: pull-request
        options: [pull-request, update-branch]

permissions:
  contents: read

concurrency:
  group: copy-shared-workflow-callers
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      source-repository: ${{ steps.config.outputs.source_repository }}
    steps:
      - name: Checkout caller configuration and local runtime
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /.github/copy-files-config.yml
            /actions/cli/
            /package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Checkout shared action runtimes
        if: github.repository != 'moyarich/reusable-workflows'
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: main
          path: .workflow-tools
          sparse-checkout: actions/cli
          persist-credentials: false
      - id: config
        name: Validate copier config and plan destinations
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
          WORKFLOW_CLI: ${{ github.repository == 'moyarich/reusable-workflows' && 'actions/cli/index.mjs' || '.workflow-tools/actions/cli/index.mjs' }}
        run: >-
          node "$WORKFLOW_CLI" copy-workflow
          --config .github/copy-files-config.yml
          --repository "$REQUESTED_REPOSITORY" --plan
      - name: Summarize copy plan
        if: always()
        env:
          PLAN_RESULT: ${{ steps.config.outcome }}
          MATRIX: ${{ steps.config.outputs.matrix }}
          SOURCE: ${{ steps.config.outputs.source_repository }}
          TARGET: ${{ inputs.repository }}
          WORKFLOW: ${{ inputs.workflow }}
          DRY_RUN: ${{ inputs.dry-run }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          {
            echo "## Canonical workflow copy — plan"
            echo
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| Status | \`$PLAN_RESULT\` |"
            echo "| Source | \`${SOURCE:-unknown}\` |"
            echo "| Selection | \`${TARGET:-all}\` |"
            echo "| Workflow | \`${WORKFLOW:-all}\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            if [[ "$PLAN_RESULT" == success && -n "$MATRIX" ]]; then
              echo
              echo "### Destinations"
              echo
              echo "| Repository | Branch |"
              echo "| --- | --- |"
              jq -r '.include[] | "| `" + .name + "` | `" + .branch + "` |"' <<< "$MATRIX"
            else
              echo
              echo "Configuration planning failed; consult the validation logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  copy:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || '{"include":[]}') }}
    steps:
      - name: Checkout local runtime and configuration
        if: github.repository == 'moyarich/reusable-workflows'
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /actions/
            /.github/copy-files-config.yml
            /package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout shared action runtime
        if: github.repository != 'moyarich/reusable-workflows'
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: main
          sparse-checkout: actions
          persist-credentials: false
      - name: Checkout canonical source workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.source-repository }}
          ref: main
          path: source-workflows
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Checkout caller configuration
        if: github.repository != 'moyarich/reusable-workflows'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          path: caller-config
          sparse-checkout: /.github/copy-files-config.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read destination workflow inventory
        env:
          GH_TOKEN: ${{ secrets.workflow-token }}
          DEST_REPO: ${{ matrix.name }}
          DEST_BRANCH: ${{ matrix.branch }}
        run: |
          gh api "repos/$DEST_REPO/contents/.github/workflows?ref=$DEST_BRANCH" --jq '[.[] | select(.type == "file") | .name]' > "$RUNNER_TEMP/existing-workflows.json"
      - name: Read existing destination publisher
        env:
          GH_TOKEN: ${{ secrets.workflow-token }}
          DEST_REPO: ${{ matrix.name }}
          DEST_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          if jq -e 'index("publish.yml") != null' "$RUNNER_TEMP/existing-workflows.json" >/dev/null; then
            gh api "repos/$DEST_REPO/contents/.github/workflows/publish.yml?ref=$DEST_BRANCH" --jq .content | base64 --decode > "$RUNNER_TEMP/destination-publish.yml"
          fi
      - name: Generate repository-specific workflows
        env:
          DEST_REPO: ${{ matrix.name }}
          SELECTED_WORKFLOW: ${{ inputs.workflow }}
          CALLER_CONFIG: ${{ github.repository == 'moyarich/reusable-workflows' && '.github/copy-files-config.yml' || 'caller-config/.github/copy-files-config.yml' }}
        shell: bash
        run: |
          args=(--config "$CALLER_CONFIG"
            --source-root source-workflows
            --repository "$DEST_REPO" --workflow "$SELECTED_WORKFLOW"
            --output "$RUNNER_TEMP/generated"
            --existing-files "$RUNNER_TEMP/existing-workflows.json")
          if [[ -f "$RUNNER_TEMP/destination-publish.yml" ]]; then
            args+=(--destination-publish-file "$RUNNER_TEMP/destination-publish.yml")
          fi
          node actions/cli/index.mjs copy-workflow "${args[@]}"
      - id: sync
        name: Copy generated workflows to destination
        uses: ./actions/copy-files-to-another-repository
        with:
          token: ${{ secrets.workflow-token }}
          source-repository: ${{ needs.plan.outputs.source-repository }}
          source-ref: main
          source-directory: ${{ runner.temp }}/generated
          destination-repository: ${{ matrix.name }}
          destination-branch: ${{ matrix.branch }}
          mode: ${{ inputs.mode }}
          dry-run: ${{ inputs.dry-run }}
          commit-message: "chore(ci): sync shared workflow callers from ${{ needs.plan.outputs.source-repository }}"
      - name: Summarize destination synchronization
        if: always()
        shell: bash
        env:
          REPOSITORY: ${{ matrix.name }}
          BRANCH: ${{ matrix.branch }}
          WORKFLOW: ${{ inputs.workflow }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry-run }}
          RESULT: ${{ steps.sync.outcome }}
          CHANGED: ${{ steps.sync.outputs.changed }}
          COMMITTED: ${{ steps.sync.outputs.committed }}
          PR_URL: ${{ steps.sync.outputs.pull-request-url }}
        run: |
          {
            echo "## Canonical workflow copy — destination"
            echo
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`$REPOSITORY\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Workflow | \`${WORKFLOW:-all}\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Result | \`$RESULT\` |"
            echo "| Changed | \`${CHANGED:-unknown}\` |"
            echo "| Committed | \`${COMMITTED:-false}\` |"
            if [[ -n "$PR_URL" ]]; then
              echo "| Destination PR | [View pull request]($PR_URL) |"
            fi
            echo
            if [[ "$RESULT" != success ]]; then
              echo "Synchronization did not complete; review the job logs."
            elif [[ "$CHANGED" == false ]]; then
              echo "No changes: destination already matches the generated workflows."
            elif [[ "$DRY_RUN" == true ]]; then
              echo "Preview only — no changes committed."
            elif [[ "$MODE" == pull-request ]]; then
              echo "Updates were pushed to the destination review branch."
            else
              echo "Updates were pushed directly to the destination branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
