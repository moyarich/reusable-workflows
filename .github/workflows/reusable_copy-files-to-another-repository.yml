name: Reusable · Copy files to another repository

on:
  workflow_call:
    inputs:
      repository:
        type: string
        default: ''
      workflow:
        description: Optional canonical workflow filename (empty means all)
        type: string
        default: ''
      dry-run:
        type: boolean
        default: true
    secrets:
      workflow-token:
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Optional destination repository
        type: string
        default: ''
      workflow:
        description: Optional canonical workflow filename
        type: string
        default: ''
      dry-run:
        description: Preview without creating PRs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: copy-shared-workflow-callers
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      source-repository: ${{ steps.config.outputs.source_repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: config
        name: Validate copier config and plan destinations
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
        run: >-
          node --experimental-strip-types packages/cli/src/bin/copy-workflows.ts
          --config .github/copy-files-config.yml
          --schema packages/cli/src/copy-files-to-another-repository/config.schema.json
          --repository "$REQUESTED_REPOSITORY" --plan

  copy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout copier and local action
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: ${{ github.repository == 'moyarich/reusable-workflows' && github.ref_name || 'main' }}
          persist-credentials: false
      - name: Checkout canonical source workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.source-repository }}
          ref: main
          path: source-workflows
          persist-credentials: false
      - name: Checkout caller configuration
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          path: caller-config
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test workflow generation
        run: npx --no-install vitest run tests/copy-workflow-generation.test.ts
      - name: Read destination workflow inventory
        env:
          GH_TOKEN: ${{ secrets.workflow-token }}
          DEST_REPO: ${{ matrix.name }}
          DEST_BRANCH: ${{ matrix.branch }}
        run: |
          gh api "repos/$DEST_REPO/contents/.github/workflows?ref=$DEST_BRANCH" --jq '[.[] | select(.type == "file") | .name]' > "$RUNNER_TEMP/existing-workflows.json"
      - name: Read existing destination publisher
        env:
          GH_TOKEN: ${{ secrets.workflow-token }}
          DEST_REPO: ${{ matrix.name }}
          DEST_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          if jq -e 'index("publish.yml") != null' "$RUNNER_TEMP/existing-workflows.json" >/dev/null; then
            gh api "repos/$DEST_REPO/contents/.github/workflows/publish.yml?ref=$DEST_BRANCH" --jq .content | base64 --decode > "$RUNNER_TEMP/destination-publish.yml"
          fi
      - name: Generate repository-specific workflows
        env:
          DEST_REPO: ${{ matrix.name }}
          SELECTED_WORKFLOW: ${{ inputs.workflow }}
        shell: bash
        run: |
          args=(--config caller-config/.github/copy-files-config.yml
            --schema packages/cli/src/copy-files-to-another-repository/config.schema.json
            --source-root source-workflows
            --repository "$DEST_REPO" --workflow "$SELECTED_WORKFLOW"
            --output "$RUNNER_TEMP/generated"
            --existing-files "$RUNNER_TEMP/existing-workflows.json")
          if [[ -f "$RUNNER_TEMP/destination-publish.yml" ]]; then
            args+=(--destination-publish-file "$RUNNER_TEMP/destination-publish.yml")
          fi
          node --experimental-strip-types packages/cli/src/bin/copy-workflows.ts "${args[@]}"
      - name: Copy generated workflows to destination
        uses: ./actions/copy-files-to-another-repository
        with:
          token: ${{ secrets.workflow-token }}
          source-repository: ${{ needs.plan.outputs.source-repository }}
          source-ref: main
          source-directory: ${{ runner.temp }}/generated
          destination-repository: ${{ matrix.name }}
          destination-branch: ${{ matrix.branch }}
          mode: pr
          dry-run: ${{ inputs.dry-run }}
          commit-message: "chore(ci): sync shared workflow callers from ${{ needs.plan.outputs.source-repository }}"
