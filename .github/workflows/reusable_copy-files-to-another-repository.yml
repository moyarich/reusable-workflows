name: Reusable · Copy files to another repository

on:
  workflow_call:
    inputs:
      repository:
        type: string
        default: ''
      workflow:
        description: Optional canonical workflow filename (empty means all)
        type: string
        default: ''
      dry-run:
        type: boolean
        default: true
    secrets:
      workflow-token:
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Optional destination repository
        type: string
        default: ''
      workflow:
        description: Optional canonical workflow filename
        type: string
        default: ''
      dry-run:
        description: Preview without creating PRs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: copy-shared-workflow-callers
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      source-repository: ${{ steps.config.outputs.source_repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet 'ruamel.yaml>=0.18,<0.20' check-jsonschema
      - name: Validate copier configuration schema
        run: check-jsonschema --schemafile packages/cli/src/copy-files-to-another-repository/config.schema.json .github/copy-files-config.yml
      - id: config
        name: Validate destinations and build matrix
        shell: bash
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from ruamel.yaml import YAML
          from pathlib import Path
          config_path = Path(".github/copy-files-config.yml")
          if not config_path.is_file():
              raise SystemExit("Missing required caller configuration: .github/copy-files-config.yml")
          config = YAML(typ="safe").load(config_path)
          source = config["source"]
          assert source["directory"] == ".github/workflows"
          assert re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", source["repository"])
          assert isinstance(source["include"], list) and source["include"]
          targets = config["repositories"]
          assert isinstance(targets, list) and targets
          names = [t["name"] for t in targets]
          assert len(names) == len(set(names))
          for target in targets:
              assert re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", target["name"])
              assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", target["branch"])
              assert ".." not in target["branch"]
          requested = os.environ.get("REQUESTED_REPOSITORY", "")
          if requested:
              targets = [t for t in targets if t["name"] == requested]
              assert len(targets) == 1, "Requested repository is not in the allowlist"
          matrix = {"include": [{"name": t["name"], "branch": t["branch"]} for t in targets]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              out.write("source_repository=" + source["repository"] + "\n")
          PY

  copy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout copier and local action
        uses: actions/checkout@v7
        with:
          repository: moyarich/reusable-workflows
          ref: ${{ github.repository == 'moyarich/reusable-workflows' && github.ref_name || 'main' }}
          persist-credentials: false
      - name: Checkout canonical source workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.source-repository }}
          ref: main
          path: source-workflows
          persist-credentials: false
      - name: Checkout caller configuration
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          path: caller-config
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet 'ruamel.yaml>=0.18,<0.20'
      - name: Test workflow generation
        run: python3 -m unittest discover -s packages/cli/tests -p 'test_copy_workflows.py' -v
      - name: Read destination workflow inventory
        env:
          GH_TOKEN: ${{ secrets.workflow-token }}
          DEST_REPO: ${{ matrix.name }}
          DEST_BRANCH: ${{ matrix.branch }}
        run: |
          gh api "repos/$DEST_REPO/contents/.github/workflows?ref=$DEST_BRANCH" --jq '[.[] | select(.type == "file") | .name]' > "$RUNNER_TEMP/existing-workflows.json"
      - name: Read existing destination publisher
        env:
          GH_TOKEN: ${{ secrets.workflow-token }}
          DEST_REPO: ${{ matrix.name }}
          DEST_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          if jq -e 'index("publish.yml") != null' "$RUNNER_TEMP/existing-workflows.json" >/dev/null; then
            gh api "repos/$DEST_REPO/contents/.github/workflows/publish.yml?ref=$DEST_BRANCH" --jq .content | base64 --decode > "$RUNNER_TEMP/destination-publish.yml"
          fi
      - name: Generate repository-specific workflows
        env:
          DEST_REPO: ${{ matrix.name }}
          SELECTED_WORKFLOW: ${{ inputs.workflow }}
        run: |
          cd source-workflows
          python3 ../packages/cli/scripts/copy-workflows.py --config ../caller-config/.github/copy-files-config.yml --repository "$DEST_REPO" --workflow "$SELECTED_WORKFLOW" --output "$RUNNER_TEMP/generated" --existing-files "$RUNNER_TEMP/existing-workflows.json" $(test ! -f "$RUNNER_TEMP/destination-publish.yml" || printf -- "--destination-publish-file %s" "$RUNNER_TEMP/destination-publish.yml")
      - name: Copy generated workflows to destination
        uses: ./actions/copy-files-to-another-repository
        with:
          token: ${{ secrets.workflow-token }}
          source-repository: ${{ needs.plan.outputs.source-repository }}
          source-ref: main
          source-directory: ${{ runner.temp }}/generated
          destination-repository: ${{ matrix.name }}
          destination-branch: ${{ matrix.branch }}
          mode: pr
          dry-run: ${{ inputs.dry-run }}
          commit-message: "chore(ci): sync shared workflow callers from ${{ needs.plan.outputs.source-repository }}"
