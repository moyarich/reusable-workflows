name: "Reusable · Discover Packages"

on:
  workflow_dispatch:
    inputs:
      packages-directory:
        description: "Folder to scan when use-workspaces is false."
        required: false
        default: packages
        type: string
      use-workspaces:
        description: "Discover packages using root package.json workspaces instead of scanning a folder."
        required: false
        default: false
        type: boolean
      include-root-package:
        description: "Also consider the repository root package.json."
        required: false
        default: false
        type: boolean
      include-private:
        description: "Include packages marked private in package.json."
        required: false
        default: false
        type: boolean
      require-publish-config:
        description: "Only include packages with publishConfig in package.json."
        required: false
        default: false
        type: boolean
      require-test-script:
        description: "Only include packages defining an npm test script."
        required: false
        default: false
        type: boolean
      require-build-script:
        description: "Only include packages defining an npm build script."
        required: false
        default: false
        type: boolean
      workspace-tools-source:
        description: "CLI location: registry (public npm), repository (Git ref), or workspace (local checkout)."
        required: false
        default: registry
        type: choice
        options:
          - registry
          - repository
          - workspace
      workspace-tools-ref:
        description: "Workspace Tools Git branch, tag, or commit when source is repository."
        required: false
        default: main
        type: string
      workspace-tools-version:
        description: "Workspace Tools version on public npm when source is registry."
        required: false
        default: "0.1.1"
        type: string

  workflow_call:
    inputs:
      packages-directory:
        description: "Folder to scan when use-workspaces is false."
        required: false
        default: packages
        type: string
      use-workspaces:
        description: "Discover packages using root package.json workspaces instead of scanning a folder."
        required: false
        default: false
        type: boolean
      include-root-package:
        description: "Also consider the repository root package.json."
        required: false
        default: false
        type: boolean
      include-private:
        description: "Include packages marked private in package.json."
        required: false
        default: false
        type: boolean
      require-publish-config:
        description: "Only include packages with publishConfig in package.json."
        required: false
        default: false
        type: boolean
      require-test-script:
        description: "Only include packages defining an npm test script."
        required: false
        default: false
        type: boolean
      require-build-script:
        description: "Only include packages defining an npm build script."
        required: false
        default: false
        type: boolean
      workspace-tools-source:
        description: "CLI location: registry (public npm), repository (Git ref), or workspace (local checkout)."
        required: false
        default: registry
        type: string
      workspace-tools-ref:
        description: "Workspace Tools Git branch, tag, or commit when source is repository."
        required: false
        default: main
        type: string
      workspace-tools-version:
        description: "Workspace Tools version on public npm when source is registry."
        required: false
        default: "0.1.1"
        type: string
    outputs:
      packages:
        description: Compact JSON array of discovered packages
        value: ${{ jobs.discover.outputs.packages }}
      matrix:
        description: GitHub Actions matrix object with include array
        value: ${{ jobs.discover.outputs.matrix }}
      has-packages:
        description: Whether any packages matched
        value: ${{ jobs.discover.outputs.has-packages }}
      count:
        description: Number of matching packages
        value: ${{ jobs.discover.outputs.count }}

permissions:
  contents: read

jobs:
  discover:
    name: "job: Discover"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      matrix: ${{ steps.packages.outputs.matrix }}
      has-packages: ${{ steps.packages.outputs.has-packages }}
      count: ${{ steps.packages.outputs.count }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@moyarich"

      - name: Install local Workspace Tools build dependencies
        if: ${{ inputs.workspace-tools-source == 'workspace' }}
        shell: bash
        run: npm ci --ignore-scripts

      - name: Resolve workspace tools CLI
        id: workspace-tools
        uses: moyarich/reusable-workflows/actions/setup-workspace-tools@main
        with:
          source: ${{ inputs.workspace-tools-source }}
          version: ${{ inputs.workspace-tools-version }}
          ref: ${{ inputs.workspace-tools-ref }}

      - id: packages
        name: Discover packages
        shell: bash
        env:
          BIN_DIR: ${{ steps.workspace-tools.outputs.bin-dir }}
        run: |
          set -euo pipefail
          args=( "--directory=${{ inputs.packages-directory }}" --json )
          [ "${{ inputs.use-workspaces }}" = "true" ] && args+=(--workspaces)
          [ "${{ inputs.include-root-package }}" = "true" ] && args+=(--include-root-package)
          [ "${{ inputs.include-private }}" = "true" ] && args+=(--include-private)
          [ "${{ inputs.require-publish-config }}" = "true" ] && args+=(--require-publish-config)
          [ "${{ inputs.require-test-script }}" = "true" ] && args+=(--require-test-script)
          [ "${{ inputs.require-build-script }}" = "true" ] && args+=(--require-build-script)

          packages="$(node "$BIN_DIR/discover-packages.mjs" "${args[@]}")"
          matrix="$(jq -cn --argjson packages "$packages" '{include:$packages}')"
          count="$(jq 'length' <<<"$packages")"

          {
            echo "packages=$packages"
            echo "matrix=$matrix"
            echo "count=$count"
            if [ "$count" -gt 0 ]; then echo "has-packages=true"; else echo "has-packages=false"; fi
          } >> "$GITHUB_OUTPUT"
