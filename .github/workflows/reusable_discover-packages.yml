name: "Reusable · Discover Packages"

on:
  workflow_dispatch:
    inputs:
      packages-directory:
        description: Directory containing direct-child packages when workspace discovery is disabled
        required: true
        default: packages
        type: string
      use-workspaces:
        description: Discover packages from root package.json workspaces patterns
        required: true
        default: false
        type: boolean
      include-root-package:
        description: Include the repository root package.json when it matches the filters
        required: true
        default: false
        type: boolean
      include-private:
        description: Include private packages
        required: true
        default: false
        type: boolean
      require-publish-config:
        description: Only include publishable packages
        required: true
        default: false
        type: boolean
      require-test-script:
        description: Only include packages with a test script
        required: true
        default: false
        type: boolean
      require-build-script:
        description: Only include packages with a build script
        required: true
        default: false
        type: boolean
      workspace-tools-source:
        description: Workspace Tools source — published package or current caller checkout
        required: true
        default: registry
        type: choice
        options:
          - registry
          - workspace
      workspace-tools-version:
        description: Published @moyarich/workspace-tools version when source is registry
        required: true
        default: "0.1.0"
        type: string

  workflow_call:
    inputs:
      packages-directory:
        required: false
        default: packages
        type: string
      use-workspaces:
        required: false
        default: false
        type: boolean
      include-root-package:
        required: false
        default: false
        type: boolean
      include-private:
        required: false
        default: false
        type: boolean
      require-publish-config:
        required: false
        default: false
        type: boolean
      require-test-script:
        required: false
        default: false
        type: boolean
      require-build-script:
        required: false
        default: false
        type: boolean
      workspace-tools-source:
        description: Workspace Tools source — published package or current caller checkout
        required: false
        default: registry
        type: string
      workspace-tools-version:
        description: Published @moyarich/workspace-tools version when source is registry
        required: false
        default: "0.1.0"
        type: string
    outputs:
      packages:
        description: Compact JSON array of discovered packages
        value: ${{ jobs.discover.outputs.packages }}
      matrix:
        description: GitHub Actions matrix object with include array
        value: ${{ jobs.discover.outputs.matrix }}
      has-packages:
        description: Whether any packages matched
        value: ${{ jobs.discover.outputs.has-packages }}
      count:
        description: Number of matching packages
        value: ${{ jobs.discover.outputs.count }}

permissions:
  contents: read

jobs:
  discover:
    name: "job: Discover"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      matrix: ${{ steps.packages.outputs.matrix }}
      has-packages: ${{ steps.packages.outputs.has-packages }}
      count: ${{ steps.packages.outputs.count }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Resolve workspace tools CLI
        id: workspace-tools
        shell: bash
        env:
          SOURCE: ${{ inputs.workspace-tools-source || 'registry' }}
          VERSION: ${{ inputs.workspace-tools-version || '0.1.0' }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            workspace)
              PACKAGE_NAME="$(node -p "require('./package.json').name")"
              if [ "$PACKAGE_NAME" != "@moyarich/workspace-tools" ]; then
                echo "::error::workspace-tools-source=workspace requires @moyarich/workspace-tools; found $PACKAGE_NAME"
                exit 1
              fi
              npm ci --ignore-scripts
              npm run build
              BIN_DIR="$GITHUB_WORKSPACE/dist/bin"
              ;;
            registry)
              npm install --global "@moyarich/workspace-tools@$VERSION" --registry=https://npm.pkg.github.com
              BIN_DIR="$(dirname "$(command -v discover-packages)")"
              ;;
            *)
              echo "::error::workspace-tools-source must be 'registry' or 'workspace'."
              exit 1
              ;;
          esac
          echo "bin-dir=$BIN_DIR" >> "$GITHUB_OUTPUT"

      - id: packages
        name: Discover packages
        shell: bash
        env:
          BIN_DIR: ${{ steps.workspace-tools.outputs.bin-dir }}
        run: |
          set -euo pipefail
          args=( "${{ inputs.packages-directory }}" --json )
          [ "${{ inputs.use-workspaces }}" = "true" ] && args+=(--workspaces)
          [ "${{ inputs.include-root-package }}" = "true" ] && args+=(--include-root-package)
          [ "${{ inputs.include-private }}" = "true" ] && args+=(--include-private)
          [ "${{ inputs.require-publish-config }}" = "true" ] && args+=(--require-publish-config)
          [ "${{ inputs.require-test-script }}" = "true" ] && args+=(--require-test-script)
          [ "${{ inputs.require-build-script }}" = "true" ] && args+=(--require-build-script)

          packages="$(node "$BIN_DIR/discover-packages.mjs" "${args[@]}")"
          matrix="$(jq -cn --argjson packages "$packages" '{include:$packages}')"
          count="$(jq 'length' <<<"$packages")"

          {
            echo "packages=$packages"
            echo "matrix=$matrix"
            echo "count=$count"
            if [ "$count" -gt 0 ]; then echo "has-packages=true"; else echo "has-packages=false"; fi
          } >> "$GITHUB_OUTPUT"
