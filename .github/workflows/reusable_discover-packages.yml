name: "Reusable · Discover Packages"

on:
  workflow_dispatch:
    inputs:
      packages-directory:
        description: "Folder to scan when use-workspaces is false."
        required: false
        default: packages
        type: string
      use-workspaces:
        description: "Discover packages using root package.json workspaces instead of scanning a folder."
        required: false
        default: false
        type: boolean
      include-root-package:
        description: "Also consider the repository root package.json."
        required: false
        default: false
        type: boolean
      include-private:
        description: "Include packages marked private in package.json."
        required: false
        default: false
        type: boolean
      require-publish-config:
        description: "Only include packages with publishConfig in package.json."
        required: false
        default: false
        type: boolean
      require-test-script:
        description: "Only include packages defining an npm test script."
        required: false
        default: false
        type: boolean
      require-build-script:
        description: "Only include packages defining an npm build script."
        required: false
        default: false
        type: boolean
      write-summary:
        description: Write the full package discovery job summary (disable when a parent workflow provides a consolidated report).
        required: false
        default: true
        type: boolean
      workspace-tools-source:
        description: "CLI location: registry (public npm), repository (Git ref), or caller (local checkout)."
        required: false
        default: auto
        type: string

  workflow_call:
    inputs:
      packages-directory:
        description: "Folder to scan when use-workspaces is false."
        required: false
        default: packages
        type: string
      use-workspaces:
        description: "Discover packages using root package.json workspaces instead of scanning a folder."
        required: false
        default: false
        type: boolean
      include-root-package:
        description: "Also consider the repository root package.json."
        required: false
        default: false
        type: boolean
      include-private:
        description: "Include packages marked private in package.json."
        required: false
        default: false
        type: boolean
      require-publish-config:
        description: "Only include packages with publishConfig in package.json."
        required: false
        default: false
        type: boolean
      require-test-script:
        description: "Only include packages defining an npm test script."
        required: false
        default: false
        type: boolean
      require-build-script:
        description: "Only include packages defining an npm build script."
        required: false
        default: false
        type: boolean
      write-summary:
        description: Write the full package discovery job summary (disable when a parent workflow provides a consolidated report).
        required: false
        default: true
        type: boolean
      workspace-tools-source:
        description: "CLI location: registry (public npm), repository (Git ref), or caller (local checkout)."
        required: false
        default: auto
        type: string

    outputs:
      packages:
        description: Structured discovery JSON report with included and filtered packages
        value: ${{ jobs.discover.outputs.packages }}
      matrix:
        description: GitHub Actions matrix object with include array
        value: ${{ jobs.discover.outputs.matrix }}
      has-packages:
        description: Whether any packages matched
        value: ${{ jobs.discover.outputs.has-packages }}
      count:
        description: Number of matching packages
        value: ${{ jobs.discover.outputs.count }}

permissions:
  contents: read

jobs:
  discover:
    name: "job: Discover"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      matrix: ${{ steps.packages.outputs.matrix }}
      has-packages: ${{ steps.packages.outputs.has-packages }}
      count: ${{ steps.packages.outputs.count }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@moyarich"

      - name: Install local Workspace Tools build dependencies
        if: ${{ inputs.workspace-tools-source == 'checkout:current' || ((inputs.workspace-tools-source == 'auto' || inputs.workspace-tools-source == '') && github.repository == 'moyarich/workspace-tools') }}
        shell: bash
        run: npm ci --ignore-scripts

      - name: Checkout version-matched reusable workflow actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/reusable-workflows-runtime
          persist-credentials: false
          sparse-checkout: actions
          sparse-checkout-cone-mode: false
      - name: Resolve workspace tools CLI
        id: workspace-tools
        uses: ./.github/reusable-workflows-runtime/actions/setup-workspace-tools
        with:
          workspace-tools-source: ${{ inputs.workspace-tools-source || 'auto' }}

      - id: packages
        name: Discover packages
        shell: bash
        env:
          BIN_DIR: ${{ steps.workspace-tools.outputs.bin-dir }}
        run: |
          set -euo pipefail
          args=( "--directory=${{ inputs.packages-directory }}" --json )
          [ "${{ inputs.use-workspaces }}" = "true" ] && args+=(--workspaces)
          [ "${{ inputs.include-root-package }}" = "true" ] && args+=(--include-root-package)
          [ "${{ inputs.include-private }}" = "true" ] && args+=(--include-private)
          [ "${{ inputs.require-publish-config }}" = "true" ] && args+=(--require-publish-config)
          [ "${{ inputs.require-test-script }}" = "true" ] && args+=(--require-test-script)
          [ "${{ inputs.require-build-script }}" = "true" ] && args+=(--require-build-script)

          report="$(node "$BIN_DIR/discover-packages.mjs" "${args[@]}")"
          packages="$(jq -c '.included' <<<"$report")"
          matrix="$(jq -cn --argjson packages "$packages" '{include:$packages}')"
          count="$(jq '.included | length' <<<"$report")"
          if [ "${{ inputs.write-summary }}" = "true" ]; then
          REPORT_JSON="$report" python3 - <<'PY'
          import json
          import os

          report = json.loads(os.environ["REPORT_JSON"])
          rows = [
              "# Package discovery", "",
              "This report describes the current package configuration and the discovery filters. "
              "Filtered packages are not necessarily misconfigured. Guidance appears only for "
              "packages that are not npm-publishable.", "",
              "| Package | Manifest | Scope | npm publishable | Discovery | Current configuration / filter | Publishing guidance (if not publishable) |",
              "| --- | --- | --- | --- | --- | --- | --- |",
          ]
          def safe(value):
              return str(value).replace("|", "&#124;").replace("\\n", " ")
          for state, items in (("Included", [{"package": p, "reasons": []} for p in report["included"]]), ("Filtered", report["filtered"])):
              for item in items:
                  pkg = item["package"]
                  scope = pkg.get("scope", "") if pkg.get("scoped") else "Unscoped"
                  reasons = list(dict.fromkeys(item.get("reasons", [])))
                  current = "; ".join(reasons) if reasons else "Matches the selected discovery filters"
                  is_private = bool(pkg.get("private")) or any("private: true" in str(r) for r in reasons)
                  if is_private:
                      current = "Private package (often intentional for apps); " + current
                  guidance = []
                  if not pkg.get("publishable"):
                      if is_private:
                          guidance.append("Only if publishing is intended: set private to false or remove it")
                      if not pkg.get("publishConfig") and any("publishConfig" in str(r) for r in reasons):
                          guidance.append("Only if using the require-publish-config discovery filter: add publishConfig")
                  optional = "; ".join(guidance) if not pkg.get("publishable") else "—"
                  if not optional:
                      optional = "Not npm-publishable under the current configuration"
                  rows.append("| " + safe(pkg["name"]) + " | `" + safe(pkg["directory"]) + "/package.json` | " + safe(scope) + " | " + ("Yes" if pkg.get("publishable") else "No") + " | " + state + " | " + safe(current) + " | " + safe(optional) + " |")
          rows += [
              "",
              "**Reading this report:** `private: true` is a valid choice for apps, examples, "
              "and internal packages; it prevents npm publishing by design. A missing "
              "`publishConfig` is also valid unless the selected discovery filter requires it. "
              "Discovery does not verify registry authorization or guarantee successful publication.", "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as output:
              output.write("\n".join(rows))
          PY
          fi

          {
            echo "packages=$report"
            echo "matrix=$matrix"
            echo "count=$count"
            if [ "$count" -gt 0 ]; then echo "has-packages=true"; else echo "has-packages=false"; fi
          } >> "$GITHUB_OUTPUT"
