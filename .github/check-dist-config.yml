# yaml-language-server: $schema=https://raw.githubusercontent.com/moyarich/reusable-workflows/main/reusable-configurations/check-dist-config.schema.json
# Check-dist settings specific to reusable-workflows.
# The shared caller remains identical across repositories.
# Root generates public GitHub Actions; packages/cli separately builds the npm tarball.
# Never point the root target at a temporary Vite staging directory.
extraPackages:
  - name: reusable-workflows-workspace
    directory: .
packages:
  ".":
    distPath: actions
    buildCommand: npm run build:actions
