# Built-in registries. Caller registries-file extends or overrides by key.
install-registry: https://npm.pkg.github.com
install-scope: '@moyarich'
registries:
  npm:
    url: https://registry.npmjs.org
    backend: npm
    token-source: npm-token
    publish-mode: staged
    enabled: true
    publish-github-release: false
    query:
      type: npm
  github:
    url: https://npm.pkg.github.com
    backend: github
    token-source: github-token
    publish-mode: direct
    enabled: true
    publish-github-release: true
    query:
      type: npm
